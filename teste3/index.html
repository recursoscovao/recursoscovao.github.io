<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carregando...</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Mantenha o seu CSS original e adicione este para a barra de status */
        :root { --cor-dinamica: #E691A7; --text-grey: #8792a1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { height: 100vh; display: flex; flex-direction: column; background: #f0f2f5; overflow: hidden; }
        
        header { background: white; border-radius: 0 0 35px 35px; display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; padding: 0 15px; height: 95px; flex-shrink: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 70px; }
        .title-group { display: flex; flex-direction: column; line-height: 0.85; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: 1.65rem; color: var(--cor-dinamica); }
        #txt-titulo2 { font-weight: 800; font-size: 1.4rem; color: #8792a1; }

        main { flex: 1; display: flex; flex-direction: column; background: white; margin: 15px 20px; padding: 20px; border-radius: 35px; box-shadow: 0 0 20px rgba(0,0,0,0.05); overflow: hidden; }
        .view-container { display: none; flex-direction: column; height: 100%; }
        .view-active { display: flex; }

        /* NOVA BARRA DE STATUS */
        .game-status-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px dashed #eee; margin-bottom: 15px; }
        .status-left { display: flex; align-items: center; gap: 10px; }
        .badge-round { background: #E691A7; color: white; padding: 8px 18px; border-radius: 20px; font-weight: 900; font-size: 1.2rem; }
        .status-right { display: flex; gap: 8px; }
        .badge-score { padding: 8px 15px; border-radius: 15px; color: white; font-weight: 900; display: flex; align-items: center; gap: 5px; }
        .bg-hit { background: #8cc63f; }
        .bg-miss { background: #ff5e5e; }

        #game-main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .btn-jogar { background: var(--cor-dinamica); color: white; padding: 18px; border-radius: 25px; font-weight: 900; border: none; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>
    <header>
        <button class="hamburger-btn" style="background:none; border:none; font-size:25px; color:var(--cor-dinamica)"><i class="fas fa-bars"></i></button>
        <div class="header-center">
            <img id="header-icon" src="">
            <div class="title-group">
                <div id="txt-titulo1"></div>
                <div id="txt-titulo2"></div>
            </div>
        </div>
        <img id="icon-voltar-top" style="height:40px" src="" onclick="window.location.href='../'">
    </header>

    <main>
        <div id="view-apresentacao" class="view-container view-active">
            <div id="area-jogo-conteudo" style="flex:1; display:flex; align-items:center; justify-content:center"></div>
            <button class="btn-jogar" onclick="mudarEcra('jogo')">JOGAR</button>
        </div>

        <div id="view-jogo" class="view-container">
            <div class="game-status-bar">
                <div class="status-left">
                    <div id="btn-ajuda" onclick="usarAjuda()"><img id="img-lampada" src="" style="height:40px; cursor:pointer"></div>
                    <div class="badge-round" id="round-val">1 / 10</div>
                </div>
                <div class="status-right">
                    <div class="badge-score bg-hit"><i class="fas fa-check"></i> <span id="hits-val">0</span></div>
                    <div class="badge-score bg-miss"><i class="fas fa-times"></i> <span id="miss-val">0</span></div>
                </div>
            </div>
            <div id="game-main-content"></div>
        </div>

        <div id="view-resultados" class="view-container">
            <div id="scr-result" style="flex:1"></div>
        </div>
    </main>

    <script src="dados.js"></script>
    <script src="jogo.js"></script>
    <script>
        function mudarEcra(id) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('view-active'));
            document.getElementById('view-' + id).classList.add('view-active');
            if(id === 'jogo') initGame();
        }

        window.onload = () => {
            const bib = BIBLIOTECA_CONTEUDO.jd.jd;
            document.getElementById('txt-titulo1').innerText = bib.t1;
            document.getElementById('txt-titulo2').innerText = bib.t2;
            document.getElementById('header-icon').src = JOGO_CONFIG.caminhoIconsMenu + "iconpre.png";
            document.getElementById('icon-voltar-top').src = JOGO_CONFIG.caminhoIconsMenu + "voltar.png";
            document.getElementById('img-lampada').src = JOGO_CONFIG.caminhoImg + "lampada.png";
            document.getElementById('area-jogo-conteudo').innerHTML = `<img src="${JOGO_CONFIG.caminhoIconsJogos}abelha.png" style="height:150px">`;
            startLogic();
        };
    </script>
</body>
</html>

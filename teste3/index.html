<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carregando...</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --text-grey: #8792a1; --cor-dinamica: #E691A7; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #f0f2f5; }

        header { 
            background: white; border-radius: 0 0 35px 35px; display: grid; grid-template-columns: 50px 1fr 50px; 
            align-items: center; padding: 0 15px; height: 95px; z-index: 1000; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
        }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 70px; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.85; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: 1.65rem; color: var(--cor-dinamica); }
        #txt-titulo2 { font-weight: 800; font-size: 1.4rem; color: var(--text-grey); }
        .hamburger-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--cor-dinamica); }

        .menu-dropdown { 
            position: absolute; top: 85px; left: 15px; display: none; flex-direction: column; gap: 8px; z-index: 2000; width: 230px; 
        }
        .menu-item { 
            display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 15px; text-decoration: none; 
            color: #7b899b; font-weight: 800; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            text-transform: uppercase; font-size: 0.95rem;
        }

        main { 
            flex: 1; display: flex; flex-direction: column; background: white; margin: 0 20px 20px 20px; 
            padding: 25px; border-radius: 35px; box-shadow: 0 0 20px 2px color-mix(in srgb, var(--cor-dinamica), transparent 80%); overflow: hidden;
        }
        .view-container { display: none; flex-direction: column; height: 100%; }
        .view-active { display: flex; }

        /* BARRA DE STATUS JOGO */
        .game-status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px dashed #f0f0f0; }
        .status-left { display: flex; align-items: center; gap: 10px; }
        .status-help { height: 40px; cursor: pointer; }
        .status-round { background: #E691A7; color: white; padding: 5px 15px; border-radius: 15px; font-weight: 900; font-size: 1.1rem; }
        .status-right { display: flex; gap: 8px; }
        .score-box { padding: 5px 12px; border-radius: 12px; color: white; font-weight: 900; display: flex; align-items: center; gap: 6px; min-width: 55px; justify-content: center; }
        .bg-correct { background: #8cc63f; }
        .bg-wrong { background: #ff5e5e; }

        .game-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .btn-jogar { background: var(--cor-dinamica); color: white; padding: 18px; border-radius: 25px; font-weight: 900; font-size: 1.2rem; border: none; cursor: pointer; width: 100%; margin-top: 15px; }
        
        footer { height: 40px; display: flex; align-items: center; justify-content: center; background: white; border-radius: 35px 35px 0 0; }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="menu-dropdown"></div>
        <div class="header-center">
            <img id="header-icon" src="">
            <div class="title-group">
                <div id="txt-titulo1"></div>
                <div id="txt-titulo2"></div>
            </div>
        </div>
        <img id="icon-voltar-top" src="" style="height: 42px; cursor: pointer;" onclick="window.location.href='../'">
    </header>

    <main>
        <div id="view-apresentacao" class="view-container view-active">
            <div class="game-content" id="img-apresentacao"></div>
            <button class="btn-jogar" onclick="mudarEcra('jogo')">JOGAR</button>
        </div>

        <div id="view-jogo" class="view-container">
            <div class="game-status">
                <div class="status-left">
                    <img id="img-lampada" src="" class="status-help" onclick="usarAjuda()">
                    <div class="status-round" id="txt-contador">1 / 10</div>
                </div>
                <div class="status-right">
                    <div class="score-box bg-correct"><i class="fas fa-check"></i> <span id="val-acertos">0</span></div>
                    <div class="score-box bg-wrong"><i class="fas fa-times"></i> <span id="val-erros">0</span></div>
                </div>
            </div>
            <div id="area-jogo" class="game-content"></div>
        </div>

        <div id="view-resultados" class="view-container">
            <div id="conteudo-resultados" class="game-content"></div>
            <button class="btn-jogar" onclick="location.reload()">VOLTAR AO INÍCIO</button>
        </div>
    </main>

    <footer><span id="txt-rodape" style="color:var(--text-grey); font-weight:700; font-size:0.8rem;"></span></footer>

    <script src="dados.js"></script>
    <script src="jogo.js"></script>
    <script>
        function toggleMenu(e) { 
            if(e) e.stopPropagation(); 
            const m = document.getElementById('dropdownMenu');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; 
        }
        window.onclick = () => document.getElementById('dropdownMenu').style.display = 'none';

        function mudarEcra(id) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('view-active'));
            document.getElementById('view-' + id).classList.add('view-active');
            if(id === 'jogo') initGame();
        }

        window.onload = () => {
            const config = JOGO_CONFIG;
            const bib = BIBLIOTECA_CONTEUDO[config.anoAtivo][config.areaAtiva];
            const tema = BIBLIOTECA_TEMAS[config.areaAtiva];

            document.documentElement.style.setProperty('--cor-dinamica', tema.corPrimaria);
            document.getElementById('txt-titulo1').innerText = bib.t1;
            document.getElementById('txt-titulo2').innerText = bib.t2;
            document.getElementById('txt-rodape').innerHTML = bib.rodape;
            document.getElementById('header-icon').src = config.caminhoIconsMenu + config.iconesMenu[config.anoAtivo];
            document.getElementById('icon-voltar-top').src = config.caminhoIconsMenu + tema.voltarMobile;
            document.getElementById('img-lampada').src = config.caminhoImg + "lampada.png";
            document.getElementById('img-apresentacao').innerHTML = `<img src="${config.caminhoIconsJogos}abelha.png" style="height:150px">`;

            const menu = document.getElementById('dropdownMenu');
            Object.keys(config.links).forEach(key => {
                if(config.iconesMenu[key] && key !== 'jd') {
                    menu.innerHTML += `<a href="${config.links[key]}" class="menu-item"><img src="${config.caminhoIconsMenu}${config.iconesMenu[key]}" width="30"> ${key}</a>`;
                }
            });
            startLogic();
        };
    </script>
</body>
</html>

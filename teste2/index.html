<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recursos Educativos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --text-grey: #8792a1;
            --cor-dinamica: #E691A7; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #f0f2f5; }

        /* --- HEADER --- */
        header { 
            background: white; border-radius: 0 0 35px 35px;
            display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; 
            padding: 0 15px; height: 95px; z-index: 1000; flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 15px;
        }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 70px; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.85; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: 1.65rem; }
        #txt-titulo2 { font-weight: 800; font-size: 1.4rem; color: #8792a1; }
        .hamburger-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--cor-dinamica); }
        #icon-voltar-top { height: 42px; width: 42px; object-fit: contain; cursor: pointer; justify-self: end;}

        /* --- MAIN (O CARTÃO DO JOGO) --- */
        main { 
            flex: 1; display: flex; flex-direction: column; background: white; 
            margin: 0 15px 15px 15px; border-radius: 35px; border: 2px solid #fff; 
            max-width: 1100px; align-self: center; width: calc(100% - 30px);
            box-shadow: 0 0 20px 2px color-mix(in srgb, var(--cor-dinamica), transparent 50%);
            overflow: hidden; /* Garante que o jogo não saia do border-radius */
        }

        /* 1ª Divisão: Barra de Status (Topo) */
        .card-status { 
            width: 100%; height: 60px; padding: 0 25px;
            display: flex; align-items: center; justify-content: space-between;
            background: #fff; border-bottom: 2px solid #f0f2f5;
        }
        .status-item { font-weight: 800; color: #1A499C; font-size: 1.1rem; text-transform: uppercase; }
        .status-item span { color: var(--cor-dinamica); margin-left: 5px; }

        /* 2ª Divisão: Área de Jogo (Meio + Fundo Unidos) */
        .card-jogo { 
            flex: 1; position: relative; width: 100%;
            background: #f9f9f9; 
            /* Limite discreto interno */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.03); 
            display: flex; align-items: center; justify-content: center;
        }

        /* Iframe ou Elemento do Jogo 100% */
        #game-frame {
            width: 100%; height: 100%; border: none;
            display: block;
        }

        /* --- ECRÃ INICIAL (VISTA DE LANÇAMENTO) --- */
        /* Usamos uma classe para alternar entre o launcher e o jogo real */
        .view-launcher { display: flex; flex-direction: column; height: 100%; width: 100%; padding: 25px; }
        .launcher-thumb { flex: 1; display: flex; align-items: center; justify-content: center; }
        .launcher-thumb img { max-height: 80%; object-fit: contain; }
        .launcher-btns { display: flex; gap: 15px; padding-top: 20px; }

        .btn-info { 
            width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--cor-dinamica); 
            color: var(--cor-dinamica); display: flex; align-items: center; justify-content: center; 
            font-size: 1.8rem; background: white; cursor: pointer; transition: 0.3s;
        }
        .btn-info i { font-family: 'Georgia', serif; font-style: italic; font-weight: bold; }

        .btn-jogar { 
            flex: 1; background: var(--cor-dinamica); color: white; padding: 18px; border-radius: 25px; 
            display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 900; 
            font-size: 1.3rem; text-decoration: none; cursor: pointer; border: none;
        }

        /* --- FOOTER --- */
        footer { 
            height: 35px; display: flex; align-items: center; justify-content: center;
            background: white; border-radius: 35px 35px 0 0; flex-shrink: 0;
        }
        .footer-text { color: var(--text-grey); font-size: 0.8rem; font-weight: 700; }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="menu-dropdown"></div>

        <div class="header-center">
            <img id="header-icon" src="" alt="">
            <div class="title-group">
                <div id="txt-titulo1"></div>
                <div id="txt-titulo2"></div>
            </div>
        </div>
        <img id="icon-voltar-top" src="" alt="Voltar" onclick="voltarPagina()">
    </header>

    <main id="main-container">
        <!-- VISTA DE LANÇAMENTO (O que aparece antes de clicar jogar) -->
        <div id="launcher-view" class="view-launcher">
            <div class="card-topo" style="border:none; padding:0; text-align:center; display:block;">
                <h2 id="jogo-titulo-launcher" style="font-weight:900; color:#1A499C; text-transform:uppercase;">Carregando...</h2>
            </div>
            <div class="launcher-thumb" id="jogo-thumb"></div>
            <div class="launcher-btns">
                <div class="btn-info" onclick="alert('Abrir ecrã de info...')"><i>i</i></div>
                <button class="btn-jogar" onclick="iniciarJogo()">
                    <i class="fas fa-play"></i> JOGAR
                </button>
            </div>
        </div>

        <!-- VISTA DO JOGO (O que aparece ao clicar jogar) -->
        <div id="game-view" style="display: none; flex-direction: column; height: 100%; width: 100%;">
            <!-- 1ª DIVISÃO: STATUS -->
            <div class="card-status">
                <div class="status-item">Nível: <span id="stat-nivel">1</span></div>
                <div class="status-item" id="stat-nome-jogo">JOGO</div>
                <div class="status-item">Pontos: <span id="stat-pontos">0</span></div>
            </div>

            <!-- 2ª DIVISÃO: ÁREA DE JOGO (UNIDA) -->
            <div class="card-jogo" id="card-jogo-area">
                <!-- O jogo ocupará 100% deste espaço -->
                <iframe id="game-frame" src=""></iframe>
            </div>
        </div>
    </main>
    
    <footer><span class="footer-text" id="txt-rodape"></span></footer>

    <script src="dados.js"></script>
    <script>
        function iniciarJogo() {
            // Esconde o launcher e mostra o jogo
            document.getElementById('launcher-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            
            // Carrega o URL do jogo no iframe
            const config = JOGO_CONFIG;
            const jogo = config.listaFases[0].jogos[0];
            document.getElementById('game-frame').src = jogo.link;
            document.getElementById('stat-nome-jogo').innerText = jogo.nome;
        }

        function voltarPagina() {
            // Se estiver no jogo, volta para o launcher. Se não, volta para a página anterior.
            const gameView = document.getElementById('game-view');
            if(gameView.style.display === 'flex') {
                gameView.style.display = 'none';
                document.getElementById('launcher-view').style.display = 'flex';
                document.getElementById('game-frame').src = '';
            } else {
                window.location.href = '../';
            }
        }

        window.onload = () => {
            const config = JOGO_CONFIG;
            const bibConteudo = BIBLIOTECA_CONTEUDO[config.anoAtivo][config.areaAtiva];
            const bibTema = BIBLIOTECA_TEMAS[config.areaAtiva];

            document.documentElement.style.setProperty('--cor-dinamica', bibTema.corPrimaria);
            document.body.style.backgroundColor = bibTema.corPagina;
            
            document.getElementById('txt-titulo1').innerText = bibConteudo.t1;
            document.getElementById('txt-titulo1').style.color = bibTema.corPrimaria;
            document.getElementById('txt-titulo2').innerText = bibConteudo.t2;
            document.getElementById('txt-rodape').innerHTML = bibConteudo.rodape;
            
            document.getElementById('header-icon').src = config.caminhoIconsMenu + config.iconesMenu[config.anoAtivo];
            document.getElementById('icon-voltar-top').src = config.caminhoIconsMenu + bibTema.voltarMobile;

            // Carrega dados iniciais no Launcher
            const jogo = config.listaFases[0].jogos[0];
            if(jogo) {
                document.getElementById('jogo-titulo-launcher').innerText = jogo.nome;
                document.getElementById('jogo-thumb').innerHTML = `<img src="${config.caminhoIconsJogos}${jogo.icon}">`;
            }
        };

        function toggleMenu(e) { 
            if(e) e.stopPropagation(); 
            // Lógica do menu...
        }
    </script>
</body>
</html>

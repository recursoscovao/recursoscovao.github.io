<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pequenos Curiosos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --cor-primaria: #E691A7; --cor-escura: #D54267; --bg-page: #fff5f7; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { background-color: var(--bg-page); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        /* DECORAÇÃO FLORES */
        .decor-flower { position: fixed; bottom: 0; width: 220px; z-index: -1; pointer-events: none; opacity: 0.8; }
        .flower-left { left: 0; }
        .flower-right { right: 0; transform: scaleX(-1); }

        /* HEADER */
        header { 
            background: white; height: 90px; padding: 0 25px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); border-radius: 0 0 35px 35px; z-index: 100;
        }
        .header-center { display: flex; align-items: center; gap: 15px; }
        .header-center img { height: 60px; }
        .title-group { line-height: 1.1; }
        .t1 { font-weight: 900; color: var(--cor-primaria); font-size: 1.4rem; }
        .t2 { font-weight: 800; color: #8792a1; font-size: 1.2rem; }
        .sub-h { font-size: 0.75rem; color: #8792a1; font-weight: 700; }

        .btn-ham { background: none; border: none; font-size: 26px; color: var(--cor-primaria); cursor: pointer; }
        .btn-voltar-top { 
            background: var(--cor-primaria); color: white; padding: 10px 20px; border-radius: 25px; 
            text-decoration: none; font-weight: 900; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;
        }

        /* MENU DROPDOWN */
        .menu-drop { 
            position: absolute; top: 95px; left: 25px; background: white; border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); display: none; flex-direction: column; padding: 10px; z-index: 1000;
        }
        .menu-item { padding: 12px 20px; text-decoration: none; color: #555; font-weight: 800; display: flex; align-items: center; gap: 12px; border-radius: 12px; }
        .menu-item:hover { background: var(--bg-page); color: var(--cor-escura); }
        .menu-item img { width: 25px; }

        /* ÁREA DE JOGO */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #game-stage { width: 100%; max-width: 900px; height: 100%; display: flex; align-items: center; justify-content: center; }

        .game-card { background: white; border-radius: 40px; padding: 40px; width: 100%; box-shadow: 0 15px 50px rgba(0,0,0,0.05); text-align: center; }

        /* STATUS JOGO */
        .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .st-pill { background: #f8f9fa; padding: 6px 15px; border-radius: 20px; font-weight: 800; font-size: 0.9rem; color: #555; display: flex; align-items: center; gap: 8px; }
        .st-green { background: #e8f5e9; color: #2e7d32; }
        .st-red { background: #ffebee; color: #c62828; }

        /* ELEMENTOS VISUAIS */
        .target-box { width: 140px; height: 140px; border: 2px solid #eee; border-radius: 25px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; position: relative; }
        .target-box img { width: 80%; }
        .target-box span { font-size: 4.5rem; font-weight: 900; color: var(--cor-escura); }

        .options-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 30px; }
        .opt-btn { background: white; border: 2px solid #f0f0f0; border-radius: 20px; aspect-ratio: 1.1; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .opt-btn:hover { transform: translateY(-5px); border-color: var(--cor-primaria); }
        .opt-btn img { width: 70%; }
        .opt-btn span { font-size: 2.5rem; font-weight: 900; }

        /* BOTÕES GERAIS */
        .btn-p { background: var(--cor-escura); color: white; border: none; padding: 18px 60px; border-radius: 35px; font-weight: 900; font-size: 1.2rem; cursor: pointer; box-shadow: 0 8px 0 rgba(0,0,0,0.1); width: fit-content; margin: 10px auto; display: block; }
        .btn-s { background: white; color: var(--cor-primaria); border: 2px solid var(--cor-primaria); padding: 12px 40px; border-radius: 30px; font-weight: 800; cursor: pointer; width: 100%; max-width: 300px; margin: 8px auto; display: block; }

        /* RESPONSIVO MOBILE */
        @media (max-width: 768px) {
            .options-grid { grid-template-columns: repeat(2, 1fr); }
            header { height: 75px; padding: 0 15px; }
            .t1, .t2 { font-size: 1.1rem; }
            .btn-voltar-top span { display: none; }
            .btn-voltar-top { width: 45px; height: 45px; padding: 0; justify-content: center; border-radius: 50%; }
            .game-card { padding: 25px; border-radius: 30px; }
        }
    </style>
</head>
<body>

    <img src="https://pequenoscuriosos.pt/assets/img/decor-flores.png" class="decor-flower flower-left" alt="">
    <img src="https://pequenoscuriosos.pt/assets/img/decor-flores.png" class="decor-flower flower-right" alt="">

    <header>
        <button class="btn-ham" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="menuDropdown" class="menu-drop"></div>
        <div class="header-center">
            <img id="header-icon" src="" alt="">
            <div class="title-group">
                <div class="t1" id="txt-t1"></div>
                <div class="t2" id="txt-t2"></div>
                <div class="sub-h" id="txt-sub"></div>
            </div>
        </div>
        <a href="../" class="btn-voltar-top"><i class="fas fa-arrow-left"></i> <span>VOLTAR</span></a>
    </header>

    <main>
        <div id="game-stage"></div>
    </main>

    <script src="dados.js"></script>
    <script src="jogo.js"></script>
    <script>
        function toggleMenu(e) {
            e.stopPropagation();
            const m = document.getElementById('menuDropdown');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }
        window.onclick = () => document.getElementById('menuDropdown').style.display = 'none';
    </script>
</body>
</html>

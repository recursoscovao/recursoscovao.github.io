<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo - Pequenos Curiosos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --cor-primaria: #E691A7; --cor-escura: #D54267; --text-grey: #8792a1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* HEADER */
        header { 
            background: white; border-radius: 0 0 35px 35px;
            display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; 
            padding: 0 15px; height: 95px; z-index: 1000; flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 65px; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.85; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: 1.5rem; }
        #txt-titulo2 { font-weight: 800; font-size: 1.3rem; color: #8792a1; }
        #txt-subtitulo-header { color: var(--text-grey); font-weight: 600; font-size: 0.65rem; margin-top: 4px; }
        .hamburger-btn { background: none; border: none; font-size: 26px; cursor: pointer; color: var(--text-grey); }
        #icon-voltar-top { height: 42px; cursor: pointer; justify-self: end; }

        /* MAIN CONTAINER */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; width: 100%; max-width: 1200px; margin: 0 auto; }

        /* CARDS E ECRÃS */
        .card-jogo {
            background: white; border-radius: 40px; padding: 35px; width: 100%; max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); text-align: center;
        }

        /* ECRÃ 1: INICIAL */
        .img-capa-circulo {
            width: 150px; height: 150px; background: #fff5f7; border-radius: 50%;
            margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
            border: 6px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .img-capa-circulo img { width: 70%; object-fit: contain; }
        .badge-facil { background: #e8f5e9; color: #4caf50; padding: 4px 15px; border-radius: 20px; font-weight: 900; font-size: 0.7rem; display: inline-block; margin-bottom: 10px; }
        .game-title { font-size: 1.6rem; font-weight: 900; color: var(--cor-escura); margin-bottom: 10px; text-transform: uppercase; }
        .game-desc { color: var(--text-grey); font-weight: 700; font-size: 0.9rem; margin-bottom: 25px; }
        .info-row { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .info-box { font-size: 0.75rem; font-weight: 800; color: #5d7082; display: flex; align-items: center; gap: 8px; text-align: left; }
        .info-box i { color: #fbc02d; font-size: 1.2rem; }

        .btn-jogar-grande {
            background: var(--cor-primaria); color: white; border: none; padding: 18px 60px;
            border-radius: 35px; font-weight: 900; font-size: 1.2rem; cursor: pointer;
            box-shadow: 0 8px 0 var(--cor-escura); transition: 0.2s;
        }
        .btn-jogar-grande:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--cor-escura); }

        /* ECRÃ 2: JOGO */
        .game-container { width: 100%; max-width: 800px; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .progress-bg { flex: 1; height: 14px; background: #eee; border-radius: 10px; margin: 0 15px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--cor-primaria); width: 0%; transition: 0.4s; }
        .label-ronda { font-weight: 900; color: var(--cor-primaria); font-size: 1rem; }

        .pergunta-texto { font-size: 1.5rem; font-weight: 900; color: #1a4a7a; margin-bottom: 20px; text-align: center; }
        .target-card { 
            background: white; border-radius: 25px; padding: 15px; width: fit-content; 
            margin: 0 auto 30px; border: 3px dashed var(--cor-primaria);
        }
        .target-card span { font-size: 4rem; font-weight: 900; color: var(--cor-escura); line-height: 1; }

        .options-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: repeat(2, 1fr); } }

        .opt-btn {
            background: white; border-radius: 20px; aspect-ratio: 1/1; display: flex;
            align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 900;
            color: #5d7082; cursor: pointer; border: 2px solid transparent;
            box-shadow: 0 6px 0 #f0f0f0; transition: 0.2s;
        }
        .opt-btn.correct { background: #e8f5e9; border-color: #4caf50; color: #4caf50; box-shadow: 0 6px 0 #388e3c; }
        .opt-btn.wrong { background: #ffebee; border-color: #f44336; color: #f44336; box-shadow: 0 6px 0 #d32f2f; }

        /* ECRÃ 3: FEEDBACK */
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 25px 0; }
        .stat-item { background: #f8f9fa; padding: 15px; border-radius: 20px; }
        .stat-val { display: block; font-size: 1.6rem; font-weight: 900; }
        .stat-label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: var(--text-grey); }

        .footer-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-secundario { 
            background: white; border: 2px solid #f0f0f0; padding: 12px; border-radius: 25px;
            font-weight: 800; color: var(--text-grey); cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* FOOTER */
        footer { height: 45px; background: white; border-radius: 35px 35px 0 0; display: flex; align-items: center; justify-content: center; margin-top: auto; }
        .footer-text { color: var(--text-grey); font-size: 0.8rem; font-weight: 700; }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn"><i class="fas fa-bars"></i></button>
        <div class="header-center">
            <img id="header-icon" src="" alt="">
            <div class="title-group">
                <div id="txt-titulo1"></div>
                <div id="txt-titulo2"></div>
                <div id="txt-subtitulo-header"></div>
            </div>
        </div>
        <img id="icon-voltar-top" src="" alt="Voltar" onclick="window.history.back()">
    </header>

    <main id="game-stage">
        <!-- O jogo.js vai injetar o conteúdo aqui -->
    </main>

    <footer><span class="footer-text" id="txt-rodape"></span></footer>

    <script src="dados.js"></script>
    <script src="jogo.js"></script>
</body>
</html>

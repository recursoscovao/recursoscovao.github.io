<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carregando...</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --header-bg: #fbfdff;    
            --sub-header-bg: #ffffff; 
            --body-bg: #e9f1f8;       
            --primary-blue: #5ba4e5;
            --primary-dark: #3d7db8; 
            --text-grey: #7a8b9a;
            --sub-titulo-cor: #7A8B9A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100vh; 
            height: -webkit-fill-available;
            overflow: hidden; /* Tranca completamente o scroll global da página */
        }

        body { 
            background-color: var(--body-bg); 
            display: flex; 
            flex-direction: column; 
        }

        /* --- HEADER --- */
        header { 
            background: var(--header-bg);
            display: grid;
            grid-template-columns: 60px 1fr auto;
            align-items: center; 
            padding: 0 15px;
            min-height: 85px; 
            flex-shrink: 0;
            z-index: 2500;
            box-shadow: 0px 4px 15px rgba(176, 196, 217, 0.4);
            position: relative;
        }

        .hamburger-btn { 
            font-size: 32px; 
            color: var(--primary-blue); 
            cursor: pointer; 
            background: none; border: none;
            padding: 5px; display: flex; align-items: center;
        }

        .header-center { display: flex; align-items: center; justify-content: center; gap: 8px; }
        #header-icon { height: 50px; width: auto; object-fit: contain; }
        
        .title-group { display: flex; flex-direction: column; justify-content: center; }
        
        .title-main { 
            font-weight: 900; 
            font-size: 1.15rem; 
            text-transform: uppercase; 
            display: flex; 
            flex-direction: column; 
            line-height: 0.9; 
        }
        .title-sub { 
            color: var(--sub-titulo-cor); 
            font-weight: 700; 
            font-size: 9px; 
            text-transform: uppercase; 
            margin-top: 4px; 
        }

        /* --- BOTÃO VOLTAR --- */
        .btn-voltar-mobile { 
            display: flex; 
            align-items: center; 
            cursor: pointer; 
            text-decoration: none;
            transition: transform 0.2s ease;
        }
        .btn-voltar-mobile:hover { transform: scale(1.1); }
        .btn-voltar-mobile img { height: 45px; width: auto; }

        /* --- MENU DROPDOWN (BLINDADO CONTRA CORTES) --- */
        .menu-dropdown { 
            position: absolute; 
            top: 75px; 
            left: 15px; 
            display: none; 
            flex-direction: column; 
            gap: 8px; 
            z-index: 3000; 
            max-height: calc(100vh - 90px); /* Garante que o menu nunca ultrapassa o ecrã */
            overflow-y: auto; /* Ativa scroll interno se houver muitos itens */
            padding-right: 5px;
        }
        
        /* Scrollbar discreta para o menu dropdown */
        .menu-dropdown::-webkit-scrollbar { width: 6px; }
        .menu-dropdown::-webkit-scrollbar-track { background: transparent; }
        .menu-dropdown::-webkit-scrollbar-thumb { background: rgba(91, 164, 229, 0.4); border-radius: 10px; }

        .menu-item { 
            display: flex; align-items: center; gap: 12px; padding: 12px 18px; 
            background: white; border-radius: 15px; box-shadow: 2px 4px 10px rgba(0,0,0,0.1);
            text-decoration: none; color: #5d7082; font-weight: 700; font-size: 0.9rem; min-width: 200px;
            flex-shrink: 0;
        }
        .menu-item:hover { background: var(--primary-blue); color: white; }
        .menu-item img { height: 22px; width: 22px; object-fit: contain; }
        .menu-item.btn-voltar-menu { background: var(--primary-blue); color: white; }
        .menu-item.btn-voltar-menu img { filter: brightness(0) invert(1); }

        /* --- SUB-HEADER --- */
        .sub-header {
            background: var(--sub-header-bg); text-align: center; padding: 12px;
            border-bottom-left-radius: 50% 20px; border-bottom-right-radius: 50% 20px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.03); flex-shrink: 0;
            z-index: 5;
        }
        .intro-text { color: #5d7082; font-size: 0.9rem; font-weight: 700; }

        /* --- ÁREA CENTRAL --- */
        main { 
            flex: 1; 
            padding: 10px 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }
        
        .game-wrapper { 
            display: flex; 
            width: 100%; 
            margin: 0 auto;
        }

        .game-card { 
            background: white; border-radius: 35px; border: 4px solid #e0eaf2; 
            text-decoration: none; padding: 16px; display: flex; flex-direction: column; 
            align-items: center; box-shadow: 0 10px 20px rgba(176, 196, 217, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        
        .card-img-container { 
            width: 100%; display: flex; align-items: center; justify-content: center; 
            border-radius: 24px; margin-bottom: 12px; min-height: 0;
        }
        .card-img-container img { max-height: 85%; max-width: 85%; object-fit: contain; }
        
        .game-card h2 { font-weight: 900; text-transform: uppercase; text-align: center; }

        /* FOOTER */
        footer { 
            padding: 10px; 
            text-align: center; 
            color: var(--text-grey); 
            font-size: 0.7rem; 
            font-weight: 700; 
            flex-shrink: 0; 
        }

        /* ========================================================= */
        /* RESPONSIVIDADE CALIBRADA E BLINDADA                       */
        /* ========================================================= */
        
        /* 1. MOBILE VERTICAL (Retrato) */
        @media (orientation: portrait) {
            header { grid-template-columns: 50px 1fr auto; padding: 0 10px; min-height: 70px; }
            #header-icon { height: 40px; }
            .title-main { font-size: 0.95rem; }
            .btn-voltar-mobile img { height: 32px; }
            .sub-header { padding: 6px; }
            .intro-text { font-size: 0.8rem; }
            .menu-dropdown { top: 62px; max-height: calc(100vh - 75px); }

            main { 
                align-items: flex-start;  
                padding: 10px 10px; 
            }

            .game-wrapper { 
                flex-direction: column; 
                justify-content: flex-start;
                align-items: center;
                gap: 10px; 
                width: calc(100vw - 20px); 
                max-width: 420px;
                flex: 1; 
                height: 100%;
                overflow: hidden;
            }
            
            .game-card {
                flex: 1; 
                width: 100%;
                min-height: 0; 
                flex-direction: column; 
                justify-content: space-between;
                padding: 10px 14px;
                border-radius: 24px;
                border-width: 3.5px;
            }
            
            .card-img-container {
                width: 100%;
                height: 68%; 
                margin-bottom: 0;
                border-radius: 18px;
                flex-shrink: 0;
            }
            
            .card-img-container img {
                max-height: 85%;
                max-width: 85%;
            }
            
            .game-card h2 { 
                font-size: 1.15rem; 
                text-align: center;
                margin-top: 2px;
                letter-spacing: 0.4px;
            }
            
            footer { padding: 5px; font-size: 0.65rem; }
        }

        /* 2. MOBILE HORIZONTAL (Landscape Otimizado e com Dropdown com Scroll) */
        @media (orientation: landscape) and (max-height: 500px) {
            header { 
                min-height: 55px; 
                padding: 0 15px; 
                grid-template-columns: 45px 1fr auto;
            }
            #header-icon { height: 32px; }
            .title-main { font-size: 0.95rem; }
            .title-sub { font-size: 8px; margin-top: 1px; }
            .btn-voltar-mobile img { height: 32px; }
            .hamburger-btn { font-size: 24px; }

            /* Ajuste dinâmico do dropdown em modo deitado para nunca cortar */
            .menu-dropdown { 
                top: 48px; 
                max-height: calc(100vh - 55px); 
                gap: 5px;
            }
            .menu-item { padding: 8px 14px; font-size: 0.85rem; min-width: 180px; }

            .sub-header { display: none !important; }

            main { 
                padding: 8px 15px; 
                align-items: center;
            }

            .game-wrapper { 
                flex-direction: row; 
                justify-content: center;
                align-items: stretch; 
                gap: 15px; 
                max-width: 680px; 
                height: 100%;
                flex: 1;
            }
            
            .game-card {
                flex: 1;
                max-width: 180px;
                flex-direction: column;
                justify-content: space-between;
                padding: 8px;
                border-radius: 20px;
                border-width: 3px;
                box-shadow: 0 4px 10px rgba(176, 196, 217, 0.3);
            }
            
            .card-img-container { 
                flex: 1;
                width: 100%;
                margin-bottom: 4px;
                border-radius: 14px;
            }
            .card-img-container img { max-height: 75%; max-width: 75%; }
            
            .game-card h2 { 
                font-size: 0.85rem; 
                line-height: 1.1;
                padding-bottom: 2px;
            }
            
            footer { padding: 3px; font-size: 0.6rem; }
        }

        /* 3. DESKTOP OU TABLETS GRANDES */
        @media (min-width: 768px) and (min-height: 501px) {
            header { min-height: 95px; padding: 0 30px; }
            #header-icon { height: 58px; }
            .title-main { font-size: 1.45rem; }
            .menu-dropdown { top: 85px; }

            .game-wrapper { 
                flex-direction: row; 
                justify-content: center;
                align-items: center;
                gap: 25px; 
                max-width: 1000px; 
                height: auto;
            }
            .game-card {
                aspect-ratio: 1 / 1.15; 
                max-width: 220px;       
                justify-content: space-between;
                flex: 1;
            }
            .game-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(176, 196, 217, 0.6); }
            .game-card h2 { font-size: 1.15rem; }
            .card-img-container { flex: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="hamburger-btn" onclick="toggleMenu(event)">
                <i class="fas fa-bars"></i>
            </button>
            <div id="dropdownMenu" class="menu-dropdown"></div>
        </div>

        <div class="header-center">
            <img id="header-icon" src="" alt="Logo">
            <div class="title-group">
                <div class="title-main">
                    <span id="txt-titulo1" style="color: var(--primary-blue);"></span> 
                    <span id="txt-titulo2" style="color: #a5b4c4;"></span>
                </div>
                <span id="txt-subtitulo" class="title-sub"></span>
            </div>
        </div>

        <div class="header-right">
            <a href="javascript:voltarUmNivel()" class="btn-voltar-mobile">
                <img id="icon-voltar-mobile" src="" alt="Voltar">
            </a>
        </div>
    </header>

    <div class="sub-header">
        <div id="txt-intro" class="intro-text"></div>
    </div>

    <main>
        <div class="game-wrapper" id="gamesGrid"></div>
    </main>

    <footer id="txt-rodape"></footer>

    <script src="dadosmenusanos.js"></script>
    <script>
        function voltarUmNivel() { window.location.href = "index.html"; }

        function toggleMenu(e) {
            if(e) e.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }
        
        window.onclick = () => document.getElementById('dropdownMenu').style.display = 'none';

        window.onload = () => {
            if (typeof MENUS_CONFIG !== 'undefined') {
                
                const urlParams = new URLSearchParams(window.location.search);
                const anoAtivo = urlParams.get('ano') || "1";
                
                const config = MENUS_CONFIG[anoAtivo];

                if (!config) {
                    console.error("Configuração não encontrada para o ano: " + anoAtivo);
                    return;
                }
                
                document.getElementById('txt-titulo1').innerText = config.textos.tituloLinha1;
                document.getElementById('txt-titulo2').innerText = config.textos.tituloLinha2;
                document.getElementById('txt-subtitulo').innerText = config.textos.subtitulo;
                document.getElementById('txt-intro').innerText = config.textos.intro;
                document.getElementById('txt-rodape').innerHTML = config.textos.rodape;
                document.title = config.textos.tituloLinha1 + " " + config.textos.tituloLinha2;
                
                const staticKey = (anoAtivo === "pre") ? "pre" : "ano" + anoAtivo;
                document.getElementById('header-icon').src = config.caminhoIconsMenu + config.iconesMenu[staticKey];
                document.getElementById('icon-voltar-mobile').src = config.caminhoIconsMenu + config.iconesMenu.voltarMobile;

                const menuBox = document.getElementById('dropdownMenu');
                
                // Mapeamento e criação estrita de TODOS os anos no menu hambúrguer
                const ordemMenus = [
                    { key: "home", label: "Início" },
                    { key: "pre", label: "Pré-Escolar" },
                    { key: "ano1", label: "1º Ano" },
                    { key: "ano2", label: "2º Ano" },
                    { key: "ano3", label: "3º Ano" },
                    { key: "ano4", label: "4º Ano" }
                ];

                ordemMenus.forEach(item => {
                    // Garante que o link é resolvido (usa a propriedade configurada ou reconstrói dinamicamente caso o ficheiro o oculte por ser o ano atual)
                    let linkDestino = config.links[item.key];
                    if (!linkDestino) {
                        if (item.key === "home") linkDestino = "index.html";
                        else if (item.key === "pre") linkDestino = "menu.html?ano=pre";
                        else linkDestino = `menu.html?ano=${item.key.replace("ano", "")}`;
                    }

                    const a = document.createElement('a');
                    a.className = 'menu-item';
                    a.href = linkDestino;
                    a.innerHTML = `<img src="${config.caminhoIconsMenu}${config.iconesMenu[item.key]}"> <span>${item.label}</span>`;
                    menuBox.appendChild(a);
                });

                // Botão voltar no final do menu dropdown
                const btnVoltarMenu = document.createElement('a');
                btnVoltarMenu.className = 'menu-item btn-voltar-menu';
                btnVoltarMenu.href = "javascript:voltarUmNivel()";
                btnVoltarMenu.innerHTML = `<img src="${config.caminhoIconsMenu}${config.iconesMenu.voltar}"> <span>VOLTAR</span>`;
                menuBox.appendChild(btnVoltarMenu);

                // Construção dinâmica da grelha de jogos
                const grid = document.getElementById('gamesGrid');
                config.listaJogos.forEach(jogo => {
                    const tema = config.temaCores[jogo.tema] || { borda: "#e0eaf2", fundo: "#f8fbff" };
                    const card = document.createElement('a');
                    card.className = 'game-card';
                    card.href = jogo.link;
                    card.style.borderColor = tema.borda;
                    
                    card.innerHTML = `
                        <div class="card-img-container" style="background-color: ${tema.fundo};">
                            <img src="${config.caminhoIconsJogos}${jogo.icon}" alt="${jogo.nome}">
                        </div>
                        <h2 style="color: ${tema.borda};">${jogo.nome}</h2>
                    `;
                    grid.appendChild(card);
                });
            }
        };
    </script>
</body>
</html>

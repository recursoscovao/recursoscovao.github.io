<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Jogo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #5EA2E6; --bg-color: #EAF4FE; --text-grey: #8792a1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body, html { height: 100vh; width: 100vw; background-color: var(--bg-color); display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: white; border-radius: 0 0 35px 35px; display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; padding: 0 15px; height: 80px; z-index: 1000; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 50px; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.85; text-transform: uppercase; }
        #txt-titulo1 { color: var(--primary-color); font-weight: 900; font-size: 1.2rem; }
        #txt-titulo2 { color: var(--text-grey); font-weight: 800; font-size: 1.1rem; }
        
        main { flex: 1; display: flex; justify-content: center; padding: 10px; overflow: hidden; }
        .game-shell { background: white; width: min(1100px, 100%); height: 100%; border-radius: 40px; border: 1.5px solid var(--primary-color); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        /* ÁREA DO TOPO REDUZIDA */
        .shell-header { padding: 5px 15px; text-align: center; border-bottom: 2px dashed #f5f5f5; min-height: 65px; display: flex; align-items: center; justify-content: center; }
        .shell-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; position: relative; overflow: hidden; }
        .shell-footer { padding: 15px 30px; display: flex; align-items: center; gap: 15px; background: #fafafa; min-height: 90px; }

        footer { padding: 8px; text-align: center; background: white; border-radius: 25px 25px 0 0; }
        .footer-text { color: var(--text-grey); font-size: 0.7rem; font-weight: 700; }
        .hamburger-btn { background: none; border: none; color: var(--primary-color); font-size: 24px; cursor: pointer; }
        .menu-dropdown { position: absolute; top: 75px; left: 15px; display: none; flex-direction: column; gap: 5px; z-index: 2000; }
        .menu-item { display: flex; align-items: center; gap: 10px; height: 45px; padding: 0 15px; text-decoration: none; color: var(--text-grey); font-weight: 800; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-width: 220px; }
        .menu-item img { width: 28px; height: 28px; }
    </style>
</head>
<body>
    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="menu-dropdown"></div>
        <div class="header-center">
            <img id="header-icon" src="" alt="">
            <div class="title-group">
                <div id="txt-titulo1">---</div>
                <div id="txt-titulo2">---</div>
            </div>
        </div>
        <img id="icon-voltar-top" src="" onclick="location.reload()" style="height: 35px; cursor: pointer;">
    </header>

    <main><div class="game-shell"><div id="shell-header-content" class="shell-header"></div><div id="game-content" class="shell-body"></div><div id="shell-footer-content" class="shell-footer"></div></div></main>

    <footer><span class="footer-text" id="txt-rodape"></span></footer>

    <script src="dados.js"></script>
    <script>
        const Engine = {
            init() {
                const config = JOGO_CONFIG;
                const tema = BIBLIOTECA_TEMAS[config.areaAtiva];
                const conteudo = BIBLIOTECA_CONTEUDO[config.anoAtivo][config.areaAtiva];
                document.documentElement.style.setProperty('--primary-color', tema.corPrimaria);
                document.documentElement.style.setProperty('--bg-color', tema.corPagina);
                document.getElementById('txt-titulo1').innerText = conteudo.t1;
                document.getElementById('txt-titulo2').innerText = conteudo.t2;
                document.getElementById('txt-rodape').innerHTML = conteudo.rodape;
                document.getElementById('icon-voltar-top').src = config.caminhoIconsMenu + tema.voltarMobile;
                const itemAtivo = (config.menuItens || config.menu_itens).find(i => i.id === config.anoAtivo);
                if(itemAtivo) document.getElementById('header-icon').src = config.caminhoIconsMenu + itemAtivo.icon;
                
                const menuBox = document.getElementById('dropdownMenu');
                (config.menuItens || config.menu_itens).forEach(item => {
                    const a = document.createElement('a'); a.className = 'menu-item'; a.href = item.link;
                    a.innerHTML = `<img src="${config.caminhoIconsMenu + item.icon}"> <span>${item.label}</span>`;
                    menuBox.appendChild(a);
                });

                if(typeof mostrarCapa === "function") mostrarCapa();
            }
        };
        function toggleMenu(e) { e.stopPropagation(); const m = document.getElementById('dropdownMenu'); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
        window.onclick = () => { document.getElementById('dropdownMenu').style.display = 'none'; }
        window.onload = () => Engine.init();
    </script>
    <script src="jogo.js"></script>
</body>
</html>

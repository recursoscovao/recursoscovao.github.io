<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Jogo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5EA2E6;
            --bg-color: #EAF4FE;
            --text-grey: #8792a1;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body, html { height: 100vh; width: 100vw; background-color: var(--bg-color); display: flex; flex-direction: column; overflow: hidden; }

        header { background: white; border-radius: 0 0 30px 30px; display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; padding: 0 15px; height: 70px; z-index: 1000; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 8px; }
        #header-icon { height: 45px; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.9; text-transform: uppercase; }
        #txt-titulo1 { color: var(--primary-color); font-weight: 900; font-size: 1.1rem; }
        #txt-titulo2 { color: var(--text-grey); font-weight: 800; font-size: 0.9rem; }
        #txt-subtitulo-header { color: var(--text-grey); font-weight: 600; font-size: 0.6rem; opacity: 0.8; }

        main { flex: 1; display: flex; justify-content: center; padding: 10px; overflow: hidden; position: relative; }
        .game-shell {
            background: white; width: min(1100px, 100%); height: 100%; border-radius: 35px; 
            box-shadow: 0 0 25px 5px var(--shadow-color);
            border: 1.5px solid var(--primary-color);
            display: flex; flex-direction: column; overflow: hidden; 
        }

        .shell-header { padding: 10px; text-align: center; border-bottom: 2px dashed #f5f5f5; min-height: 50px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .shell-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; position: relative; }
        .shell-footer { padding: 15px 30px; display: flex; align-items: center; gap: 15px; background: #fafafa; min-height: 80px; }

        /* BARRA DE STATUS (COMPACTA) */
        .status-bar { width: 100%; display: flex; align-items: center; justify-content: space-between; }
        .status-left, .status-right { display: flex; align-items: center; gap: 8px; }
        .status-pill { background: #6c757d; color: white; padding: 4px 15px; border-radius: 15px; font-weight: 900; font-size: 0.9rem; }
        .lamp-icon { height: 35px; cursor: pointer; object-fit: contain; }
        .score-box { padding: 4px 12px; border-radius: 10px; color: white; font-weight: 900; display: flex; align-items: center; gap: 5px; font-size: 0.8rem; }
        .score-certo { background: #8cc63f; }
        .score-erro { background: #ff5a5f; }

        .btn-play-rect { flex: 1; height: 55px; border-radius: 30px; background: var(--primary-color); color: white; border: none; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        .btn-info-circle { width: 50px; height: 50px; cursor: pointer; }
        .btn-info-circle img { width: 100%; height: 100%; }

        .menu-dropdown { position: absolute; top: 65px; left: 15px; display: none; flex-direction: column; gap: 6px; z-index: 2000; }
        .menu-item { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; text-decoration: none; color: var(--text-grey); font-weight: 800; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-width: 220px; font-size: 0.9rem; }
        
        .info-dropdown { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 5000; display: none; flex-direction: column; padding: 30px 20px; overflow-y: auto; }
        
        footer { padding: 8px; text-align: center; background: white; border-radius: 20px 20px 0 0; }
        .footer-text { color: var(--text-grey); font-size: 0.65rem; font-weight: 700; }
        .hamburger-btn { background: none; border: none; color: var(--primary-color); font-size: 22px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="menu-dropdown"></div>
        <div class="header-center">
            <img id="header-icon" src="" alt="">
            <div class="title-group">
                <div id="txt-titulo1">---</div>
                <div id="txt-titulo2">---</div>
                <div id="txt-subtitulo-header">---</div>
            </div>
        </div>
        <img id="icon-voltar-top" src="" alt="Voltar" onclick="location.reload()" style="height: 30px; cursor: pointer; justify-self: end;">
    </header>

    <main>
        <div class="game-shell">
            <div class="shell-header" id="shell-header-content"></div> 
            <div class="shell-body" id="game-content"></div>           
            <div class="shell-footer" id="shell-footer-content"></div> 
        </div>
    </main>

    <div id="infoDropdown" class="info-dropdown"></div>
    <footer><span class="footer-text" id="txt-rodape"></span></footer>

    <script src="dados.js"></script>
    <script>
        const Engine = {
            init() { this.loadConfig(); window.addEventListener('resize', () => this.updateScale()); },
            loadConfig() {
                const config = JOGO_CONFIG;
                const tema = BIBLIOTECA_TEMAS[config.areaAtiva];
                const conteudo = BIBLIOTECA_CONTEUDO[config.anoAtivo][config.areaAtiva];
                document.documentElement.style.setProperty('--primary-color', tema.corPrimaria);
                document.documentElement.style.setProperty('--bg-color', tema.corPagina);
                document.getElementById('txt-titulo1').innerText = conteudo.t1;
                document.getElementById('txt-titulo2').innerText = conteudo.t2;
                document.getElementById('txt-subtitulo-header').innerText = conteudo.sub;
                document.getElementById('txt-rodape').innerHTML = conteudo.rodape;
                document.getElementById('icon-voltar-top').src = config.caminhoIconsMenu + tema.voltarMobile;
                const itemAtivo = (config.menuItens || config.menu_itens).find(i => i.id === config.anoAtivo);
                if(itemAtivo) document.getElementById('header-icon').src = config.caminhoIconsMenu + itemAtivo.icon;
                this.renderMenu(); this.renderInfoPanel(); this.showCapa();
                if(typeof mostrarCapa === "function") mostrarCapa();
            },
            showCapa() {
                document.getElementById('shell-header-content').innerHTML = `<h2 style="font-weight: 900; font-size: 1.2rem; color: var(--primary-color);">${JOGO_CONFIG.nomeDoJogo}</h2>`;
                const footer = document.getElementById('shell-footer-content');
                footer.style.display = 'flex';
                footer.innerHTML = `<div class="btn-info-circle" onclick="toggleInfo(event)"><img src="${JOGO_CONFIG.caminhoIconsMenu}inform.png"></div>
                                    <button class="btn-play-rect" onclick="if(typeof iniciarJogo === 'function') iniciarJogo()"><i class="fas fa-play"></i> JOGAR</button>`;
            },
            showStatusBar(ronda, total, certos, erros) {
                const lampPath = JOGO_CONFIG.caminhoIconsMenu + "lampada.png";
                document.getElementById('shell-header-content').innerHTML = `
                    <div class="status-bar">
                        <div class="status-left"><img src="${lampPath}" class="lamp-icon" onclick="if(typeof darAjuda==='function') darAjuda()">
                        <div class="status-pill">${ronda} / ${total}</div></div>
                        <div class="status-right">
                            <div class="score-box score-certo"><i class="fas fa-check"></i> ${certos}</div>
                            <div class="score-box score-erro"><i class="fas fa-times"></i> ${erros}</div>
                        </div>
                    </div>`;
                document.getElementById('shell-footer-content').style.display = 'none'; 
            },
            showResults(certos, erros) {
                if(typeof finalizarJogo === 'function') finalizarJogo();
            },
            renderMenu() {
                const menuBox = document.getElementById('dropdownMenu');
                const itens = JOGO_CONFIG.menuItens || JOGO_CONFIG.menu_itens;
                itens.forEach(item => {
                    const a = document.createElement('a'); a.className = 'menu-item'; a.href = item.link;
                    let iconPath = JOGO_CONFIG.caminhoIconsMenu + item.icon;
                    if(item.icon === "AUTO") iconPath = JOGO_CONFIG.caminhoIconsMenu + BIBLIOTECA_TEMAS[JOGO_CONFIG.areaAtiva].voltarMobile;
                    a.innerHTML = `<img src="${iconPath}" style="width:24px;"> <span>${item.label}</span>`;
                    menuBox.appendChild(a);
                });
            },
            renderInfoPanel() {
                const inst = JOGO_CONFIG.instrucoes;
                document.getElementById('infoDropdown').innerHTML = `<div style="max-width:600px; margin: 0 auto;">
                    <h2 style="color:var(--primary-color); text-align:center;">INSTRUÇÕES</h2>
                    <p style="margin:20px 0;">${inst.objetivo}</p>
                    <button onclick="toggleInfo(event)" style="width:100%; padding:15px; border-radius:15px; background:var(--primary-color); color:white; border:none; font-weight:bold;">VOLTAR</button>
                </div>`;
            },
            updateScale() { if(typeof onResizeGame === "function") onResizeGame(); }
        };
        function toggleMenu(e) { e.stopPropagation(); const m = document.getElementById('dropdownMenu'); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
        function toggleInfo(e) { e.stopPropagation(); const i = document.getElementById('infoDropdown'); i.style.display = (i.style.display === 'flex') ? 'none' : 'flex'; }
        window.onclick = () => { document.getElementById('dropdownMenu').style.display = 'none'; }
        window.onload = () => Engine.init();
    </script>
    <script src="jogo.js"></script>
</body>
</html>

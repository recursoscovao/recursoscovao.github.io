<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mundo dos Jogos</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --header-bg: #ffffff;    
            --body-bg: #f0f4f8;       
            --text-main: #2d3436;
            --text-grey: #636e72;
        }

        /* Reset e Base */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        body { 
            background: var(--body-bg);
            background-image: radial-gradient(#d1d8e0 1px, transparent 1px);
            background-size: 30px 30px;
            height: 100vh; /* Força a altura exata do ecrã do dispositivo */
            width: 100%; 
            display: flex; 
            flex-direction: column;
            overflow: hidden; /* Tranca completamente qualquer scroll no ecrã */
            -webkit-font-smoothing: antialiased;
            
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }

        body::-webkit-scrollbar {
            display: none;
        }

        /* HEADER */
        header { 
            background: var(--header-bg); 
            padding: 12px 20px; 
            flex-shrink: 0; /* Impede o header de encolher */
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            z-index: 10;
        }
        
        .header-center { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px; 
            max-width: 1200px;
            margin: 0 auto;
        }

        #header-icon { 
            height: clamp(40px, 6vw, 55px); 
            width: auto; 
            object-fit: contain;
        }
        
        .title-group { display: flex; flex-direction: column; }
        .title-main { font-weight: 900; font-size: clamp(1.2rem, 4.5vw, 1.7rem); text-transform: uppercase; line-height: 1; }
        #txt-titulo1 { color: #d63031; } 
        #txt-titulo2 { color: #b2bec3; } 
        .title-sub { color: var(--text-grey); font-weight: 700; font-size: clamp(0.65rem, 2.5vw, 0.85rem); margin-top: 3px; }

        /* SUB-HEADER / INTRO */
        .sub-header { 
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            text-align: center; 
            padding: 10px 20px; 
            border-bottom: 1px solid rgba(0,0,0,0.02);
            flex-shrink: 0; /* Impede a introdução de encolher */
        }
        .intro-text { color: var(--text-grey); font-size: clamp(0.85rem, 3.5vw, 1rem); font-weight: 800; }

        /* CONTENT CONTAINER */
        main { 
            flex: 1; /* Ocupa dinamicamente todo o espaço restante do ecrã */
            display: flex;
            align-items: center; 
            justify-content: center;
            padding: 15px;
            width: 100%;
            overflow: hidden;
        }

        .game-wrapper { 
            display: grid;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* CARD STYLE BASE */
        .game-card { 
            position: relative;
            border-radius: 24px; 
            background: white;
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            border: 4px solid #fff;
            width: 100%;
        }

        /* Container Interno da Imagem */
        .card-img-container { 
            width: 100%;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 18px; 
            background: rgba(255, 255, 255, 0.3);
            overflow: hidden;
        }
        
        .card-img-container img { 
            max-height: 82%; 
            max-width: 82%; 
            object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.08));
        }

        .game-card h2 { 
            color: white; 
            font-weight: 900; 
            text-align: center;
            text-transform: uppercase;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ========================================================= */
        /* ORIENTAÇÕES E RESPONSIVIDADE ASSEGURADA                  */
        /* ========================================================= */

        /* 1. MOBILES EM VERTICAL (Portrait) */
        @media (orientation: portrait) {
            main {
                align-items: center; /* Centraliza a grid verticalmente no espaço livre */
            }
            .game-wrapper {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
            .game-card {
                aspect-ratio: 1 / 1.12; 
                padding: 12px;
            }
            .card-img-container {
                height: 72%;
                margin-bottom: 8px;
            }
            .game-card h2 { 
                font-size: clamp(0.85rem, 3.8vw, 1.05rem);
                margin-bottom: 2px;
            }
            .game-card:last-child:nth-child(odd) {
                grid-column: span 2;
                width: calc(50% - 8px);
                justify-self: center;
            }
        }

        /* 2. MOBILES EM HORIZONTAL (Landscape) */
        @media (orientation: landscape) {
            header

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mundo dos Jogos</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --header-bg: #ffffff;    
            --body-bg: #f0f4f8;       
            --text-main: #2d3436;
            --text-grey: #636e72;
        }

        /* Reset e Base Responsiva */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        body { 
            background: var(--body-bg);
            background-image: radial-gradient(#d1d8e0 1px, transparent 1px);
            background-size: 30px 30px; /* Textura de pontos subtil */
            min-height: 100vh;
            width: 100%; 
            display: flex; 
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER */
        header { 
            background: var(--header-bg); 
            padding: 15px 20px; 
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            z-index: 10;
        }
        
        .header-center { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px; 
            max-width: 1200px;
            margin: 0 auto;
        }

        #header-icon { 
            height: clamp(45px, 7vw, 60px); 
            width: auto; 
            object-fit: contain;
        }
        
        .title-group { display: flex; flex-direction: column; }
        .title-main { font-weight: 900; font-size: clamp(1.2rem, 4.5vw, 1.8rem); text-transform: uppercase; line-height: 1; }
        #txt-titulo1 { color: #d63031; } /* Vermelho Mundo */
        #txt-titulo2 { color: #b2bec3; } /* Cinza Jogos */
        .title-sub { color: var(--text-grey); font-weight: 700; font-size: clamp(0.65rem, 2.5vw, 0.9rem); margin-top: 4px; }

        /* SUB-HEADER / INTRO */
        .sub-header { 
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            text-align: center; 
            padding: 12px 20px; 
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(0,0,0,0.02);
        }
        .intro-text { color: var(--text-grey); font-size: clamp(0.85rem, 3.5vw, 1.1rem); font-weight: 800; }

        /* CONTENT CONTAINER */
        main { 
            flex: 1; 
            display: flex;
            align-items: center; 
            justify-content: center;
            padding: 20px;
            width: 100%;
        }

        .game-wrapper { 
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Mobile Padrão: 2 colunas */
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* CARD STYLE (RESPONSIVO COM ASPECT-RATIO) */
        .game-card { 
            position: relative;
            border-radius: 24px; 
            background: white;
            text-decoration: none; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            border: 4px solid #fff;
            aspect-ratio: 1 / 1.15;
            width: 100%;
        }

        /* Correção para o último card no Mobile se o número total for ímpar */
        .game-card:last-child:nth-child(odd) {
            grid-column: span 2;
            width: calc(50% - 7.5px);
            justify-self: center;
        }

        /* Container Interno da Imagem */
        .card-img-container { 
            width: 100%;
            height: 72%;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 18px; 
            background: rgba(255, 255, 255, 0.3);
            margin-bottom: 8px;
            overflow: hidden;
        }
        
        .card-img-container img { 
            max-height: 80%; 
            max-width: 80%; 
            object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.08));
        }

        .game-card h2 { 
            color: white; 
            font-size: clamp(0.8rem, 3.5vw, 1.15rem); 
            font-weight: 900; 
            margin-bottom: 4px;
            text-align: center;
            text-transform: uppercase;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Evita que títulos longos quebrem o card */
        }

        /* Efeitos Interativos */
        .game-card:hover {
            transform: scale(1.04) translateY(-4px);
        }

        .game-card:active {
            transform: scale(0.98);
        }

        /* FOOTER */
        footer { 
            padding: 15px 20px; 
            text-align: center; 
            color: var(--text-grey); 
            font-size: 0.75rem; 
            font-weight: 700; 
            flex-shrink: 0;
        }

        /* === MEDIA QUERIES PARA RESPONSIVIDADE FLUIDA === */

        /* Tablets Horizontais / Ecrãs Pequenos (3 colunas) */
        @media (min-width: 550px) {
            .game-wrapper { 
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
            .game-card { padding: 15px; border-radius: 28px; }
            .game-card:last-child:nth-child(odd) {
                grid-column: span 1;
                width: 100%;
            }
        }

        /* Laptops e Tablets Grandes (4 colunas) */
        @media (min-width: 850px) {
            .game-wrapper { 
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
        }

        /* Desktop Computadores de Secretária (5 colunas) */
        @media (min-width: 1100px) {
            .game-wrapper { 
                grid-template-columns: repeat(5, 1fr); 
                gap: 25px;
            }
            .game-card h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-center">
            <img id="header-icon" src="" alt="Logo">
            <div class="title-group">
                <div class="title-main">
                    <span id="txt-titulo1"></span> 
                    <span id="txt-titulo2"></span>
                </div>
                <span id="txt-subtitulo" class="title-sub"></span>
            </div>
        </div>
    </header>

    <div class="sub-header">
        <div id="txt-intro" class="intro-text"></div>
    </div>

    <main>
        <div class="game-wrapper" id="gamesGrid"></div>
    </main>

    <footer id="txt-rodape"></footer>

    <script src="dados.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof JOGO_CONFIG !== 'undefined') {
                const config = JOGO_CONFIG;

                document.getElementById('txt-titulo1').textContent = config.textos.tituloLinha1;
                document.getElementById('txt-titulo2').textContent = config.textos.tituloLinha2;
                document.getElementById('txt-subtitulo').textContent = config.textos.subtitulo;
                document.getElementById('txt-intro').textContent = config.textos.intro;
                document.getElementById('txt-rodape').innerHTML = config.textos.rodape;
                document.getElementById('header-icon').src = config.caminhoIconsMenu + config.iconesMenu.logo;

                const grid = document.getElementById('gamesGrid');
                config.listaJogos.forEach(jogo => {
                    const tema = config.temaCores[jogo.tema];
                    const card = document.createElement('a');
                    card.className = 'game-card';
                    card.href = jogo.link;
                    
                    // Aplica cores e sombra dinâmica (Glow)
                    card.style.backgroundColor = tema.fundo;
                    card.style.boxShadow = `0 12px 28px -8px ${tema.fundo}aa`; // Sombra calibrada

                    card.innerHTML = `
                        <div class="card-img-container" style="background-color: rgba(255,255,255,0.25)">
                            <img src="${config.caminhoIconsJogos}${jogo.icon}" alt="${jogo.nome}">
                        </div>
                        <h2>${jogo.nome}</h2>
                    `;
                    grid.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carregando...</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --text-grey: #8792a1; 
            --menu-item-h: clamp(40px, 5dvh, 50px); 
            --cor-dinamica: #E691A7; 
            --cor-certo: #8CC63F; 
            --cor-errado: #FF5A5F;
            --cor-ajuda: #FFB041;
            
            /* Alturas responsivas */
            --header-h: clamp(65px, 10dvh, 95px);
            --footer-h: clamp(35px, 5dvh, 45px);
            --icon-status-size: clamp(30px, 4.2dvh, 38px); /* Tamanho igual para Lâmpada e Info */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        /* 1. LAYOUT OCUPA 100% DA ALTURA - SCROLL APENAS NA PÁGINA */
        html, body { 
            width: 100%;
            min-height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            background: #f0f2f5; 
            overflow-x: hidden;
            overflow-y: auto; /* Único local com scroll permitido */
            transition: background 0.3s ease;
        }
        
        /* 2. HEADER */
        header { 
            height: var(--header-h);
            background: white; 
            border-radius: 0 0 clamp(20px, 3vw, 35px) clamp(20px, 3vw, 35px); 
            display: grid; 
            grid-template-columns: clamp(45px, 7vw, 60px) 1fr clamp(45px, 7vw, 60px); 
            align-items: center; 
            padding: 0 clamp(10px, 2vw, 20px); 
            flex-shrink: 0; 
            z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
        }

        .header-center { display: flex; align-items: center; justify-content: center; gap: 10px; }
        #header-icon { height: clamp(40px, 7dvh, 60px); width: auto; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.9; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: clamp(1rem, 2.2dvh, 1.5rem); color: var(--cor-dinamica); }
        #txt-titulo2 { font-weight: 800; font-size: clamp(0.85rem, 1.8dvh, 1.3rem); color: #8792a1; }
        #txt-subtitulo-header { color: var(--text-grey); font-weight: 700; font-size: clamp(0.55rem, 1dvh, 0.65rem); margin-top: 3px; }

        .hamburger-btn { background: none; border: none; font-size: clamp(22px, 3.5dvh, 28px); cursor: pointer; color: var(--cor-dinamica); }
        #icon-voltar-top { height: clamp(30px, 4.5dvh, 42px); width: auto; object-fit: contain; cursor: pointer; justify-self: end; }

        /* 3. MAIN E CONTENTOR (EXPANDE PARA OCUPAR O ESPAÇO DISPONÍVEL) */
        main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: clamp(10px, 2dvh, 20px) clamp(10px, 3vw, 30px); 
            width: 100%; 
            max-width: min(1100px, 100vw); 
            margin: 0 auto; 
        }

        .game-container {
            width: 100%;
            flex: 1; 
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: clamp(20px, 3.5dvh, 35px);
            border: 2px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: clamp(15px, 3dvh, 30px);
            position: relative;
            min-height: 450px; 
        }

        .view-container { display: none; flex-direction: column; width: 100%; flex: 1; }
        .view-active { display: flex; }
        
        .card-topo { flex-shrink: 0; padding-bottom: 12px; border-bottom: 2px solid #f8f9fa; margin-bottom: 15px; text-align: center; }
        .card-topo h2 { color: var(--cor-dinamica); text-transform: uppercase; font-weight: 900; font-size: clamp(1.2rem, 3dvh, 1.4rem); }
        
        .card-meio { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border-radius: 20px; 
            background: #fdfdfd; 
            padding: 10px; 
            width: 100%;
        }
        
        .card-fundo { flex-shrink: 0; display: flex; align-items: center; gap: 15px; padding-top: 20px; justify-content: center; }

        /* 4. STATUS BAR (LINHA ÚNICA) */
        .game-status-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: nowrap; gap: 4px; }
        .status-group { display: flex; align-items: center; gap: clamp(6px, 1.5vw, 10px); }
        
        .stat-pill { 
            height: var(--icon-status-size); 
            padding: 0 clamp(8px, 1.5vw, 15px); 
            border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; 
            color: white; font-weight: 800; font-size: clamp(0.75rem, 1.4dvh, 0.95rem); 
            min-width: clamp(55px, 9vw, 75px); 
            white-space: nowrap;
        }
        .pill-ronda { background-color: var(--cor-dinamica); }
        .pill-certo { background-color: var(--cor-certo); }
        .pill-errado { background-color: var(--cor-errado); }

        #img-lampada { height: var(--icon-status-size); width: auto; cursor: pointer; transition: 0.2s; }
        .btn-inform-img { height: clamp(45px, 6dvh, 60px); cursor: pointer; transition: 0.2s; }
        .btn-inform-img-mini { height: var(--icon-status-size); width: auto; cursor: pointer; transition: 0.2s; }

        /* 5. GRELHA DE JOGO RESPONSIVA (PARA O FUTURO JOGO.JS) */
        .game-grid {
            display: grid;
            gap: clamp(10px, 2dvh, 15px);
            width: 100%;
            max-width: 650px;
            /* Default: 4 colunas */
            grid-template-columns: repeat(4, 1fr);
        }

        /* Telemóvel Vertical: Passa para 2 colunas */
        @media (max-width: 500px) and (orientation: portrait) {
            .game-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .card-animal {
            background: white; border: 2px solid #eee; border-radius: 15px;
            aspect-ratio: 1 / 1; /* Garante que sejam sempre quadrados */
            display: flex; align-items: center; justify-content: center; padding: 10px;
            cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.02);
        }

        /* 6. FOOTER E MENU */
        footer { 
            height: var(--footer-h); 
            display: flex; align-items: center; justify-content: center; 
            background: white; border-radius: clamp(20px, 3vw, 35px) clamp(20px, 3vw, 35px) 0 0; 
            flex-shrink: 0; margin-top: auto;
        }
        .footer-text { color: var(--text-grey); font-size: clamp(0.7rem, 1.4dvh, 0.85rem); font-weight: 700; }

        .menu-dropdown { position: absolute; top: calc(var(--header-h) - 5px); left: 15px; display: none; flex-direction: column; gap: 8px; z-index: 2000; width: 230px; }
        .menu-item { display: flex; align-items: center; gap: 12px; height: var(--menu-item-h); padding: 0 15px; text-decoration: none; color: #7b899b; font-weight: 800; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: 0.2s; }
        .menu-item:hover { background-color: var(--cor-dinamica) !important; color: white !important; }

        #info-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: white; z-index: 3000; display: none; flex-direction: column; padding: 30px; overflow-y: auto; }
        
        .btn-jogar { flex: 1; background: var(--cor-dinamica); color: white; padding: clamp(12px, 2.2dvh, 18px); border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 900; font-size: 1.1rem; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-secundario { background: #8792a1; }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="menu-dropdown"></div>
        <div class="header-center">
            <img id="header-icon" src="" alt="">
            <div class="title-group">
                <div id="txt-titulo1"></div>
                <div id="txt-titulo2"></div>
                <div id="txt-subtitulo-header"></div>
            </div>
        </div>
        <img id="icon-voltar-top" src="" alt="Voltar" onclick="voltarPagina()">
    </header>

    <main>
        <div class="game-container">
            
            <!-- APRESENTAÇÃO -->
            <div id="view-apresentacao" class="view-container view-active">
                <div class="card-topo"><h2 id="jogo-titulo"></h2></div>
                <div class="card-meio" id="area-jogo-conteudo"></div>
                <div class="card-fundo">
                    <img id="btn-inform-apres" class="btn-inform-img" alt="Info" onclick="toggleInfoScreen(true)">
                    <button class="btn-jogar" onclick="mudarEcra('jogo')"><i class="fas fa-play"></i> JOGAR</button>
                </div>
            </div>

            <!-- JOGO -->
            <div id="view-jogo" class="view-container">
                <div class="card-topo">
                    <div class="game-status-bar">
                        <div class="status-left">
                            <img id="img-lampada" src="" alt="Ajuda" onclick="if(typeof pedirAjuda === 'function') pedirAjuda()">
                            <div class="stat-pill pill-ronda"><span id="ronda-atual">1</span> / 10</div>
                        </div>
                        <div class="status-right">
                            <div class="stat-pill pill-certo"><i class="fas fa-check"></i> <span id="cont-certos-jogo">0</span></div>
                            <div class="stat-pill pill-errado"><i class="fas fa-times"></i> <span id="cont-errados-jogo">0</span></div>
                            <img id="btn-inform-jogo" class="btn-inform-img-mini" alt="Info" onclick="toggleInfoScreen(true)">
                        </div>
                    </div>
                </div>
                <div class="card-meio">
                    <div id="game-injection-point" style="width:100%; height:100%; display: flex; align-items: center; justify-content: center;"></div>
                </div>
            </div>

            <!-- RESULTADOS -->
            <div id="view-resultados" class="view-container">
                <div class="card-topo"><h2>RESULTADOS</h2></div>
                <div class="card-meio">
                    <img id="res-img" src="" style="height: clamp(85px, 15dvh, 110px); object-fit: contain; margin-bottom: 10px;">
                    <div id="res-titulo" style="font-weight: 900; font-size: 1.6rem; color: var(--cor-dinamica); text-align: center;"></div>
                    <p style="color: #8792a1; font-weight: 700; margin-bottom: 10px;">Desafio concluído com sucesso!</p>
                    <div style="display:flex; gap:10px;">
                        <div style="text-align:center; padding:10px; background:#fff; border:1px solid #eee; border-radius:15px; width:85px;">
                            <span id="res-certos" style="font-size:1.6rem; font-weight:900; color:var(--cor-certo)">0</span><br><small style="font-weight:800; color:#8792a1; text-transform:uppercase; font-size:0.6rem;">Certos</small>
                        </div>
                        <div style="text-align:center; padding:10px; background:#fff; border:1px solid #eee; border-radius:15px; width:85px;">
                            <span id="res-errados" style="font-size:1.6rem; font-weight:900; color:var(--cor-errado)">0</span><br><small style="font-weight:800; color:#8792a1; text-transform:uppercase; font-size:0.6rem;">Errados</small>
                        </div>
                        <div style="text-align:center; padding:10px; background:#fff; border:1px solid #eee; border-radius:15px; width:85px;">
                            <span id="res-ajudas" style="font-size:1.6rem; font-weight:900; color:var(--cor-ajuda)">0</span><br><small style="font-weight:800; color:#8792a1; text-transform:uppercase; font-size:0.6rem;">Ajudas</small>
                        </div>
                    </div>
                </div>
                <div class="card-fundo">
                    <button class="btn-jogar btn-secundario" onclick="voltarPagina()">Sair</button>
                    <button class="btn-jogar" onclick="mudarEcra('apresentacao')">Repetir</button>
                </div>
            </div>

        </div>
    </main>

    <footer><span class="footer-text" id="txt-rodape"></span></footer>

    <div id="info-screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-weight: 900; color: var(--cor-dinamica); font-size: 1.6rem;">Instruções</h2>
            <i class="fas fa-times" style="font-size:2rem;cursor:pointer" onclick="toggleInfoScreen(false)"></i>
        </div>
        <div class="info-content" id="info-texto"></div>
    </div>

    <script src="dados.js"></script>
    <!-- O script jogo.js será adicionado aqui futuramente -->

    <script>
        let certosGlobal = 0, erradosGlobal = 0, ajudasGlobal = 0;

        function mudarEcra(id) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('view-active'));
            document.getElementById('view-' + id).classList.add('view-active');
            if(id === 'jogo') { 
                document.querySelector('footer').style.display = 'none'; 
                if(typeof initJogo === "function") initJogo(); 
            } else { document.querySelector('footer').style.display = 'flex'; }
            if(id === 'resultados') {
                document.getElementById('res-certos').innerText = certosGlobal;
                document.getElementById('res-errados').innerText = erradosGlobal;
                document.getElementById('res-ajudas').innerText = ajudasGlobal;
                const rel = JOGO_CONFIG.relatorios.find(r => certosGlobal >= r.min && certosGlobal <= r.max);
                if(rel) { 
                    document.getElementById('res-titulo').innerText = rel.titulo; 
                    document.getElementById('res-img').src = JOGO_CONFIG.caminhoIconsMenu + rel.img; 
                }
            }
        }

        function voltarPagina() { window.history.back(); }
        function toggleMenu(e) { if(e) e.stopPropagation(); const m = document.getElementById('dropdownMenu'); m.style.display = (m.style.display==='flex')?'none':'flex'; }
        function toggleInfoScreen(s) { document.getElementById('info-screen').style.display = s?'flex':'none'; }
        window.onclick = () => document.getElementById('dropdownMenu').style.display = 'none';

        window.onload = () => {
            const config = JOGO_CONFIG;
            document.title = config.nomeDoJogo;
            const tema = BIBLIOTECA_TEMAS[config.areaAtiva];
            const conteudo = BIBLIOTECA_CONTEUDO[config.anoAtivo][config.areaAtiva];
            const pathIcons = config.caminhoIconsMenu;

            document.documentElement.style.setProperty('--cor-dinamica', tema.corPrimaria);
            document.body.style.backgroundColor = tema.corPagina;

            document.getElementById('txt-titulo1').innerText = conteudo.t1;
            document.getElementById('txt-titulo2').innerText = conteudo.t2;
            document.getElementById('txt-subtitulo-header').innerText = conteudo.sub;
            document.getElementById('txt-rodape').innerHTML = conteudo.rodape;
            document.getElementById('icon-voltar-top').src = pathIcons + tema.voltarMobile;
            document.getElementById('img-lampada').src = pathIcons + "lampada.png";
            document.getElementById('btn-inform-apres').src = pathIcons + "inform.png";
            document.getElementById('btn-inform-jogo').src = pathIcons + "inform.png";

            const dadosAno = config.menuItens.find(item => item.id === config.anoAtivo);
            if(dadosAno) document.getElementById('header-icon').src = pathIcons + dadosAno.icon;

            const menuBox = document.getElementById('dropdownMenu');
            config.menuItens.forEach(item => {
                const a = document.createElement('a');
                a.className = 'menu-item'; a.href = item.link;
                const icon = (item.icon === "AUTO") ? tema.voltarMobile : item.icon;
                a.innerHTML = `<img src="${pathIcons}${icon}"><span>${item.label}</span>`;
                menuBox.appendChild(a);
            });

            document.getElementById('jogo-titulo').innerText = config.nomeDoJogo;
            if(DADOS_JOGO.itens && DADOS_JOGO.itens.length > 0) {
                document.getElementById('area-jogo-conteudo').innerHTML = `<img src="${DADOS_JOGO.caminhoImagens}${DADOS_JOGO.itens[0].img}" style="max-width: 80%; max-height: 100%; object-fit: contain;">`;
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carregando...</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --text-grey: #8792a1; 
            --menu-item-h: 50px; 
            --cor-dinamica: #E691A7; 
            --cor-certo: #8CC63F; 
            --cor-errado: #FF5A5F;
            --cor-ajuda: #FFB041;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        /* Ajuste de Scroll no Body */
        body { 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            background: #f0f2f5; 
            transition: background 0.3s ease;
            overflow-x: hidden; /* Evita scroll lateral */
            overflow-y: auto;   /* Permite scroll vertical se o conteúdo for grande */
        }
        
        header { background: white; border-radius: 0 0 35px 35px; display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; padding: 0 15px; height: 95px; z-index: 1000; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 60px; width: 60px; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.9; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: 1.5rem; color: var(--cor-dinamica); }
        #txt-titulo2 { font-weight: 800; font-size: 1.3rem; color: #8792a1; }
        #txt-subtitulo-header { color: var(--text-grey); font-weight: 700; font-size: 0.65rem; margin-top: 4px; opacity: 0.9; }
        .hamburger-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--cor-dinamica); }
        #icon-voltar-top { height: 42px; width: 42px; object-fit: contain; cursor: pointer; justify-self: end; }

        .menu-dropdown { position: absolute; top: 85px; left: 15px; display: none; flex-direction: column; gap: 8px; z-index: 2000; width: 230px; }
        .menu-item { display: flex; align-items: center; gap: 12px; height: var(--menu-item-h); padding: 0 15px; text-decoration: none; color: #7b899b; font-weight: 800; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); cursor: pointer; text-transform: uppercase; font-size: 0.85rem; transition: 0.2s; }
        .menu-item img { height: 28px; width: 28px; object-fit: contain; }
        .menu-item:hover { background-color: var(--cor-dinamica) !important; color: white !important; }
        .menu-item:hover span { color: white !important; }

        /* Ajuste de Scroll no Main */
        main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: white; 
            margin: 0 20px 20px 20px; 
            padding: 25px; 
            border-radius: 35px; 
            border: 2px solid #fff; 
            max-width: 950px; 
            align-self: center; 
            width: calc(100% - 40px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            overflow-y: auto; /* Permite scroll dentro do cartão se necessário */
            position: relative;
        }

        .view-container { display: none; flex-direction: column; min-height: 100%; flex: 1; }
        .view-active { display: flex; }
        
        .card-topo { flex-shrink: 0; padding-bottom: 12px; border-bottom: 2px solid #f8f9fa; margin-bottom: 15px; text-align: center; }
        .card-topo h2 { color: var(--cor-dinamica); text-transform: uppercase; font-weight: 900; font-size: 1.4rem; }
        
        /* Ajuste no Card Meio */
        .card-meio { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border-radius: 20px; 
            background: #fdfdfd; 
            position: relative; 
            padding: 10px;
            overflow-y: auto; /* Scroll para a grelha de jogo */
        }
        
        .card-fundo { flex-shrink: 0; display: flex; align-items: center; gap: 15px; padding-top: 20px; }

        .game-status-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 5px; }
        .status-left, .status-right { display: flex; align-items: center; gap: 8px; }
        .stat-pill { height: 32px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 0.9rem; min-width: 65px; }
        .pill-ronda { background-color: var(--cor-dinamica); }
        .pill-certo { background-color: var(--cor-certo); gap: 5px; }
        .pill-errado { background-color: var(--cor-errado); gap: 5px; }
        #img-lampada { height: 32px; width: auto; cursor: pointer; transition: 0.2s; }
        .btn-info-mini { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--cor-dinamica); color: var(--cor-dinamica); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: bold; cursor: pointer; font-family: 'Georgia', serif; font-style: italic; background: white; }

        .stats-container { display: flex; gap: 12px; margin: 15px 0; width: 100%; justify-content: center; flex-wrap: wrap; }
        .stat-card { background: white; border-radius: 20px; padding: 15px; width: 100px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; }
        .stat-card .num { font-size: 2.2rem; font-weight: 900; line-height: 1; margin-bottom: 8px; }
        .stat-card .label { font-size: 0.7rem; font-weight: 800; color: #8792a1; text-transform: uppercase; letter-spacing: 1px; }
        .c-certo { color: var(--cor-certo); }
        .c-errado { color: var(--cor-errado); }
        .c-ajuda { color: var(--cor-ajuda); }

        .btn-jogar { flex: 1; background: var(--cor-dinamica); color: white; padding: 16px; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 900; font-size: 1.1rem; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-secundario { background: #8792a1; }
        
        /* Ajuste de Scroll no Overlay de Informações */
        #info-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 3000; display: none; 
            flex-direction: column; padding: 30px; 
            overflow-y: auto; /* Importante para as instruções longas */
        }
        
        footer { height: 45px; display: flex; align-items: center; justify-content: center; background: white; border-radius: 35px 35px 0 0; flex-shrink: 0; margin-top: auto; }
        .footer-text { color: var(--text-grey); font-size: 0.85rem; font-weight: 700; }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="menu-dropdown"></div>
        <div class="header-center">
            <img id="header-icon" src="" alt="">
            <div class="title-group">
                <div id="txt-titulo1"></div>
                <div id="txt-titulo2"></div>
                <div id="txt-subtitulo-header"></div>
            </div>
        </div>
        <img id="icon-voltar-top" src="" alt="Voltar" onclick="voltarPagina()">
    </header>

    <main>
        <!-- ECRÃ 1: APRESENTAÇÃO -->
        <div id="view-apresentacao" class="view-container view-active">
            <div class="card-topo"><h2 id="jogo-titulo"></h2></div>
            <div class="card-meio" id="area-jogo-conteudo"></div>
            <div class="card-fundo">
                <div class="btn-info" onclick="toggleInfoScreen(true)" style="width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--cor-dinamica); color: var(--cor-dinamica); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; background: white; cursor: pointer; font-family: 'Georgia', serif; font-style: italic; font-weight: bold;"><i>i</i></div>
                <button class="btn-jogar" onclick="mudarEcra('jogo')"><i class="fas fa-play"></i> JOGAR</button>
            </div>
        </div>

        <!-- ECRÃ 2: O JOGO -->
        <div id="view-jogo" class="view-container">
            <div class="card-topo">
                <div class="game-status-bar">
                    <div class="status-left">
                        <img id="img-lampada" src="" alt="Ajuda" onclick="if(typeof pedirAjuda === 'function') pedirAjuda()">
                        <div class="stat-pill pill-ronda"><span id="ronda-atual">1</span> / 10</div>
                    </div>
                    <div class="status-right">
                        <div class="stat-pill pill-certo"><i class="fas fa-check"></i> <span id="cont-certos-jogo">0</span></div>
                        <div class="stat-pill pill-errado"><i class="fas fa-times"></i> <span id="cont-errados-jogo">0</span></div>
                        <div class="btn-info-mini" onclick="toggleInfoScreen(true)">i</div>
                    </div>
                </div>
            </div>
            <div class="card-meio">
                <div id="game-injection-point" style="width:100%; height:auto; min-height: 100%;">
                    <!-- O jogo será injetado aqui -->
                </div>
            </div>
        </div>

        <!-- ECRÃ 3: RESULTADOS -->
        <div id="view-resultados" class="view-container">
            <div class="card-topo"><h2>RESULTADOS</h2></div>
            <div class="card-meio">
                <img id="res-img" src="" style="width: 120px; height: 120px; object-fit: contain; margin-bottom: 10px;">
                <div id="res-titulo" style="font-weight: 900; font-size: 1.8rem; color: var(--cor-dinamica); margin-bottom: 5px;"></div>
                <p style="color: #8792a1; font-weight: 700; margin-bottom: 15px; text-align: center;">Concluíste o desafio com sucesso!</p>
                <div class="stats-container">
                    <div class="stat-card"><span id="res-certos" class="num c-certo">0</span><span class="label">Certos</span></div>
                    <div class="stat-card"><span id="res-errados" class="num c-errado">0</span><span class="label">Errados</span></div>
                    <div class="stat-card"><span id="res-ajudas" class="num c-ajuda">0</span><span class="label">Ajudas</span></div>
                </div>
            </div>
            <div class="card-fundo">
                <button class="btn-jogar btn-secundario" onclick="voltarPagina()">Outro Jogo</button>
                <button class="btn-jogar" onclick="mudarEcra('apresentacao')">Jogar de novo</button>
            </div>
        </div>
    </main>

    <footer><span class="footer-text" id="txt-rodape"></span></footer>

    <div id="info-screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="font-weight: 900; color: var(--cor-dinamica); font-size: 1.8rem;">Instruções</h2>
            <i class="fas fa-times" style="font-size:2rem;cursor:pointer" onclick="toggleInfoScreen(false)"></i>
        </div>
        <div class="info-content" id="info-texto"></div>
    </div>

    <script src="dados.js"></script>
    <script src="jogo.js"></script>

    <script>
        let certosGlobal = 0;
        let erradosGlobal = 0;
        let ajudasGlobal = 0;

        function mudarEcra(id) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('view-active'));
            document.getElementById('view-' + id).classList.add('view-active');
            
            if(id === 'jogo') { 
                document.querySelector('footer').style.display = 'none'; 
                if(typeof initJogo === "function") initJogo(); 
            } else { document.querySelector('footer').style.display = 'flex'; }

            if(id === 'resultados') {
                document.getElementById('res-certos').innerText = certosGlobal;
                document.getElementById('res-errados').innerText = erradosGlobal;
                document.getElementById('res-ajudas').innerText = ajudasGlobal;
                const rel = JOGO_CONFIG.relatorios.find(r => certosGlobal >= r.min && certosGlobal <= r.max);
                if(rel) { 
                    document.getElementById('res-titulo').innerText = rel.titulo; 
                    document.getElementById('res-img').src = JOGO_CONFIG.caminhoIconsMenu + rel.img; 
                }
            }
        }

        function voltarPagina() { window.history.back(); }
        function toggleMenu(e) { if(e) e.stopPropagation(); const m = document.getElementById('dropdownMenu'); m.style.display = (m.style.display==='flex')?'none':'flex'; }
        function toggleInfoScreen(s) { document.getElementById('info-screen').style.display = s?'flex':'none'; }
        window.onclick = () => document.getElementById('dropdownMenu').style.display = 'none';

        window.onload = () => {
            const config = JOGO_CONFIG;
            document.title = config.nomeDoJogo;

            const tema = BIBLIOTECA_TEMAS[config.areaAtiva];
            const conteudo = BIBLIOTECA_CONTEUDO[config.anoAtivo][config.areaAtiva];
            const pathIcons = config.caminhoIconsMenu;

            document.documentElement.style.setProperty('--cor-dinamica', tema.corPrimaria);
            document.body.style.backgroundColor = tema.corPagina;

            document.getElementById('txt-titulo1').innerText = conteudo.t1;
            document.getElementById('txt-titulo2').innerText = conteudo.t2;
            document.getElementById('txt-subtitulo-header').innerText = conteudo.sub;
            document.getElementById('txt-rodape').innerHTML = conteudo.rodape;
            document.getElementById('icon-voltar-top').src = pathIcons + tema.voltarMobile;
            document.getElementById('img-lampada').src = pathIcons + "lampada.png";

            const dadosAno = config.menuItens.find(item => item.id === config.anoAtivo);
            if(dadosAno) document.getElementById('header-icon').src = pathIcons + dadosAno.icon;

            const menuBox = document.getElementById('dropdownMenu');
            config.menuItens.forEach(item => {
                const a = document.createElement('a');
                a.className = 'menu-item'; a.href = item.link;
                const icon = (item.icon === "AUTO") ? tema.voltarMobile : item.icon;
                a.innerHTML = `<img src="${pathIcons}${icon}"><span>${item.label}</span>`;
                menuBox.appendChild(a);
            });

            document.getElementById('jogo-titulo').innerText = config.nomeDoJogo;
            if(DADOS_JOGO.itens && DADOS_JOGO.itens.length > 0) {
                document.getElementById('area-jogo-conteudo').innerHTML = `<img src="${DADOS_JOGO.caminhoImagens}${DADOS_JOGO.itens[0].img}" style="max-width: 80%; max-height: 80%; object-fit: contain;">`;
            }
        };
    </script>
</body>
</html>

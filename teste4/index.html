<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando...</title>

    <!-- Fonte Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           1. VARIÁVEIS E BASE
           ========================================== */
        :root {
            --cor-pagina: #f0f0f0; --cor-primaria: #333; --cor-primaria-alpha: rgba(0,0,0,0.4); 
            --cor-escura: #000; --cor-texto: #5d7082; --text-grey: #8792a1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; }
        body { display: flex; flex-direction: column; font-family: 'Fredoka', sans-serif; background-color: var(--cor-pagina); overflow: hidden; }

        /* ==========================================
           2. HEADER (85px)
           ========================================== */
        header {
            height: 85px; background: white; display: flex; align-items: center; padding: 0 20px;
            border-bottom-left-radius: 35px; border-bottom-right-radius: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); z-index: 1100; flex-shrink: 0; position: relative;
        }
        .header-flex { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 60px; width: 60px; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.85; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: 1.5rem; color: var(--cor-primaria); }
        #txt-titulo2 { font-weight: 800; font-size: 1.2rem; color: var(--text-grey); }
        #txt-subtitulo-header { color: var(--text-grey); font-weight: 600; font-size: 0.6rem; margin-top: 4px; opacity: 0.9; }
        .btn-menu { background: none; border: none; cursor: pointer; width: 45px; display: flex; flex-direction: column; gap: 5px; }
        .btn-menu div { width: 28px; height: 4px; background-color: var(--cor-primaria); border-radius: 10px; }
        .btn-voltar-topo img { height: 45px; }

        /* ==========================================
           3. MENUS (HAMBURGUER E INFO)
           ========================================== */
        .menu-dropdown { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            padding: 100px 20px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
            transform: translateY(-120%); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent !important;
        }
        .menu-dropdown.active { transform: translateY(0); }
        .menu-btn-item { width: 270px; background: white; display: flex; align-items: center; gap: 12px; padding: 10px 18px; text-decoration: none; color: var(--cor-texto); border-radius: 18px; font-weight: 600; font-size: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #f2f2f2; transition: 0.3s; }
        .menu-btn-item img { width: 34px; height: 34px; object-fit: contain; }
        .menu-btn-item:hover { background: var(--cor-primaria); color: white; transform: translateX(5px); }

        .info-full-page { position: fixed; bottom: -100%; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; transition: bottom 0.5s ease-in-out; display: flex; flex-direction: column; }
        .info-full-page.active { bottom: 0; }
        .info-header { height: 85px; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; border-bottom: 2px solid #f9f9f9; flex-shrink: 0; }
        .info-header span { font-weight: 900; font-size: 1.5rem; color: var(--cor-primaria); text-transform: uppercase; }
        .btn-close-info { background: #eee; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 1.5rem; font-weight: 900; color: #555; cursor: pointer; }
        .info-body { flex: 1; padding: 30px 25px; overflow-y: auto; color: var(--cor-texto); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); display: none; z-index: 900; backdrop-filter: blur(2px); }

        /* ==========================================
           4. MAIN E ECRÃS
           ========================================== */
        main { flex: 1; padding: 15px; display: flex; flex-direction: column; overflow: hidden; }
        .tela {
            display: none; width: 100%; height: 100%; flex-direction: column; 
            background: white; border-radius: 40px; 
            border: 3px solid var(--cor-primaria-alpha); box-shadow: 0 0 30px var(--cor-primaria-alpha);
            margin: 0 auto; max-width: 1100px; animation: fadeIn 0.4s ease; overflow: hidden;
        }
        .active-tela { display: flex !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Ecrã 1: Apresentação */
        .intro-wrapper { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .intro-topo { height: 85px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .intro-meio { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: hidden; }
        .intro-fundo { height: 85px; display: flex; align-items: center; padding: 0 30px; gap: 20px; flex-shrink: 0; border-top: 1px solid #f9f9f9; }
        #ui-nome-jogo-intro { font-size: clamp(1.1rem, 4vw, 1.6rem); font-weight: 900; color: var(--cor-primaria); text-align: center; text-transform: uppercase; }

        /* ==========================================
           ECRÃ 2: JOGO (GRELHA INTELIGENTE)
           ========================================== */
        .game-container { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .game-topo { height: 85px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #f2f2f2; flex-shrink: 0; }
        .round-pill { background: #6c757d; color: white; padding: 5px 15px; border-radius: 50px; font-weight: 900; font-size: 1rem; }
        .stat-box { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 10px; color: white; font-weight: 900; font-size: 1rem; }
        .box-success { background: #8cc63f; } .box-error { background: #ff5a5f; }
        
        .game-meio { flex: 1; display: flex; align-items: center; justify-content: center; padding: 15px; overflow-y: auto; }

        /* Contentor Injetado pelo JS */
        #container-jogo-injetado {
            display: grid;
            gap: 12px;
            width: 100%;
            height: 100%;
            align-content: center; 
            justify-content: center;
        }

        /* CONFIGURAÇÃO PC / TABLET LANDSCAPE (3 linhas totais) */
        @media (min-width: 768px) or (orientation: landscape) {
            #container-jogo-injetado { grid-template-columns: repeat(4, 1fr); }
            /* 1ª Linha: O Destaque ocupa 4 colunas */
            #container-jogo-injetado div:first-child { 
                grid-column: span 4; 
                justify-self: center; 
                height: 120px; /* Tamanho controlado */
            }
        }

        /* CONFIGURAÇÃO TELEMÓVEL PORTRAIT (5 linhas totais) */
        @media (max-width: 767px) and (orientation: portrait) {
            #container-jogo-injetado { grid-template-columns: repeat(2, 1fr); }
            /* 1ª Linha: O Destaque ocupa 2 colunas */
            #container-jogo-injetado div:first-child { 
                grid-column: span 2; 
                justify-self: center; 
                height: 100px;
            }
        }

        /* Cartões Internos */
        .card-jogo-base { background: white; border-radius: 15px; border: 2px solid #eee; display: flex; align-items: center; justify-content: center; padding: 10px; transition: 0.2s; }
        .card-jogo-base img { height: 60%; width: auto; object-fit: contain; } /* Imagens 10% menores */
        .card-destaque { border: 4px solid var(--cor-primaria); aspect-ratio: 1/1; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        /* ==========================================
           5. FOOTER (BRANCO)
           ========================================== */
        footer { height: 40px; background: white; color: var(--text-grey); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; border-top-left-radius: 30px; border-top-right-radius: 30px; box-shadow: 0 -4px 15px rgba(0,0,0,0.06); flex-shrink: 0; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay"></div>
    <nav id="menu-dropdown" class="menu-dropdown"></nav>

    <!-- Página de Informação Full Screen -->
    <div id="page-info" class="info-full-page">
        <header class="info-header">
            <span>Informação</span>
            <button class="btn-close-info">X</button>
        </header>
        <div class="info-body" id="ui-area-instrucoes"></div>
    </div>

    <!-- Header Principal -->
    <header>
        <div class="header-flex">
            <button class="btn-menu" id="btn-abrir-menu"><div></div><div></div><div></div></button>
            <div class="header-center">
                <img id="header-icon" src="" alt="">
                <div class="title-group">
                    <span id="txt-titulo1"></span><span id="txt-titulo2"></span><span id="txt-subtitulo-header"></span>
                </div>
            </div>
            <a href="javascript:history.back()" class="btn-voltar-topo"><img id="ui-seta-voltar" src="" alt=""></a>
        </div>
    </header>

    <main>
        <!-- ECRÃ 1: APRESENTAÇÃO -->
        <section id="tela-apresentacao" class="tela active-tela">
            <div class="intro-wrapper">
                <div class="intro-topo"><h1 id="ui-nome-jogo-intro"></h1></div>
                <div class="intro-meio"><div id="container-animacao-tutorial" style="width:100%; height:100%;"></div></div>
                <div class="intro-fundo">
                    <img class="img-info-src btn-trigger-info" src="" width="50" style="cursor:pointer; flex-shrink: 0;">
                    <button id="btn-jogar-main" style="flex:1; background:var(--cor-primaria); color:white; border:none; padding:15px; border-radius:50px; font-weight:900; font-size:1.5rem; cursor:pointer; text-transform:uppercase;">JOGAR</button>
                </div>
            </div>
        </section>

        <!-- ECRÃ 2: JOGO -->
        <section id="tela-jogo" class="tela">
            <div class="game-container">
                <div class="game-topo">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <!-- Icon da Lâmpada -->
                        <img id="ui-help-lamp" src="" height="50" style="cursor:pointer;">
                        <div class="round-pill" id="ui-ronda">1/10</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <div class="stat-box box-success">✓ <span id="ui-certos">0</span></div>
                        <div class="stat-box box-error">X <span id="ui-errados">0</span></div>
                        <img class="img-info-src btn-trigger-info" src="" width="35" style="cursor:pointer;">
                    </div>
                </div>
                <div class="game-meio">
                    <div id="container-jogo-injetado">
                        <!-- O JS vai injetar aqui 9 DIVS (1 destaque + 8 opções) -->
                    </div>
                </div>
            </div>
        </section>

        <!-- ECRÃ 3: RESULTADOS -->
        <section id="tela-resultados" class="tela">
            <div id="container-resultados-injetado" style="flex:1; display:flex; align-items:center; justify-content:center; width:100%;"></div>
        </section>
    </main>

    <footer><div id="ui-rodape"></div></footer>

    <script src="dados.js"></script>
    <script src="jogo.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const config = JOGO_CONFIG;
            const tema = BIBLIOTECA_TEMAS[config.areaAtiva];
            const conteudo = BIBLIOTECA_CONTEUDO[config.anoAtivo][config.areaAtiva];

            document.title = config.nomeDoJogo;
            const root = document.documentElement;
            root.style.setProperty('--cor-pagina', tema.corPagina);
            root.style.setProperty('--cor-primaria', tema.corPrimaria);
            root.style.setProperty('--cor-primaria-alpha', tema.corPrimaria + '66');

            // Preenchimento de UI
            document.getElementById("txt-titulo1").innerText = conteudo.t1;
            document.getElementById("txt-titulo2").innerText = conteudo.t2;
            document.getElementById("txt-subtitulo-header").innerText = conteudo.sub;
            document.getElementById("ui-rodape").innerHTML = conteudo.rodape;
            document.getElementById("ui-nome-jogo-intro").innerText = config.nomeDoJogo;
            document.getElementById("ui-seta-voltar").src = config.caminhoIconsMenu + tema.voltarMobile;
            document.querySelectorAll(".img-info-src").forEach(img => img.src = config.caminhoIconsJogos + "inform.png");
            document.getElementById("ui-help-lamp").src = config.caminhoIconsJogos + "lampada.png";
            
            const itemAno = config.menuItens.find(item => item.id === config.anoAtivo);
            if (itemAno) document.getElementById("header-icon").src = config.caminhoIconsMenu + itemAno.icon;

            // Menu Hambúrguer
            const menuDiv = document.getElementById("menu-dropdown");
            config.menuItens.forEach(item => {
                const link = document.createElement("a");
                link.href = item.link; link.className = "menu-btn-item";
                const icon = (item.icon === "AUTO") ? tema.voltarMobile : item.icon;
                link.innerHTML = `<img src="${config.caminhoIconsMenu}${icon}"><span>${item.label}</span>`;
                menuDiv.appendChild(link);
            });

            // Instruções
            const areaInstrucoes = document.getElementById("ui-area-instrucoes");
            const ins = config.instrucoes;
            areaInstrucoes.innerHTML = `
                <div style="border-left: 6px solid var(--cor-primaria); padding-left: 15px; margin-bottom: 30px;">
                    <h2 style="margin:0;">Objetivo</h2><p>${ins.objetivo}</p>
                </div>
                <h2>Como Jogar</h2><ul>${ins.comoJogar.map(s => `<li>${s}</li>`).join('')}</ul>
                <h2>Regras</h2><ul>${ins.regras.map(r => `<li>${r}</li>`).join('')}</ul>
                <h2>Dicas</h2><p>${ins.dicas}</p>
                <div style="background:#f9f9f9; padding:20px; border-radius:20px; margin-top:20px;">
                    <h2 style="margin:0;">O que vais desenvolver?</h2><ul>${ins.desenvolvimento.map(d => `<li>${d}</li>`).join('')}</ul>
                </div>
            `;

            // Botão Jogar
            document.getElementById("btn-jogar-main").onclick = () => {
                trocarEcra('tela-jogo');
                if (typeof irParaJogo === 'function') irParaJogo();
            };

            // Abrir Info
            document.querySelectorAll(".btn-trigger-info").forEach(btn => {
                btn.onclick = () => document.getElementById("page-info").classList.add("active");
            });

            // Lógica de menus fechar
            const menuDropdown = document.getElementById("menu-dropdown");
            const overlay = document.getElementById("overlay");
            document.getElementById("btn-abrir-menu").onclick = () => {
                const act = menuDropdown.classList.toggle("active");
                overlay.style.display = act ? "block" : "none";
            };
            document.querySelector(".btn-close-info").onclick = () => document.getElementById("page-info").classList.remove("active");
            overlay.onclick = () => { menuDropdown.classList.remove("active"); overlay.style.display = "none"; };
            menuDropdown.onclick = (e) => { if (e.target === menuDropdown) { menuDropdown.classList.remove("active"); overlay.style.display = "none"; } };

            if(typeof iniciarTutorialVisual === 'function') iniciarTutorialVisual();
        });

        function trocarEcra(id) {
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('active-tela'));
            const alvo = document.getElementById(id);
            if(alvo) alvo.classList.add('active-tela');
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Educativa</title>

    <style>
        :root {
            --cor-pagina: #f0f0f0;
            --cor-primaria: #333;
            --cor-escura: #000;
            --cor-texto: #555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* SCROLL NA PÁGINA TODA */
        body, html {
            min-height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cor-pagina);
            color: var(--cor-texto);
            display: flex;
            flex-direction: column;
        }

        /* ==========================================
           HEADER (BRANCO, ARREDONDADO, 85px)
           ========================================== */
        header {
            height: 85px;
            background-color: white;
            display: flex;
            align-items: center;
            z-index: 100;
            border-bottom-left-radius: 35px; 
            border-bottom-right-radius: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            
            /* Sticky opcional: se quiseres que o header fique fixo no topo ao fazer scroll */
            position: sticky;
            top: 0;
            
            /* PADDING DE 20PX NAS EXTREMIDADES */
            padding: 0 20px;
        }

        .header-flex {
            display: flex;
            justify-content: space-between; /* Encosta os itens nos lados */
            align-items: center;
            width: 100%;
            max-width: 100%; /* Ocupa a largura total */
        }

        /* Hambúrguer à esquerda */
        .btn-menu {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 45px; /* Área de clique */
        }

        .btn-menu div {
            width: 28px;
            height: 3px;
            background-color: var(--cor-primaria);
            border-radius: 3px;
        }

        /* Títulos centrados */
        .titulos {
            flex-grow: 1;
            text-align: center;
        }
        .titulos h1 { font-size: 1.3rem; text-transform: uppercase; color: var(--cor-primaria); line-height: 1; }
        .titulos h2 { font-size: 0.9rem; font-weight: normal; color: var(--cor-texto); }

        /* Seta Voltar à direita */
        .btn-voltar-topo {
            width: 45px;
            display: flex;
            justify-content: flex-end;
            text-decoration: none;
        }

        .btn-voltar-topo img {
            height: 45px;
            transition: transform 0.2s;
        }

        /* ==========================================
           SIDE MENU (ESTRUTURA)
           ========================================== */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 150;
        }
        .side-menu {
            position: fixed;
            top: 0; left: -280px; width: 280px; height: 100%;
            background: white; z-index: 200;
            transition: 0.3s ease; padding: 25px;
        }
        .side-menu.active { left: 0; }
        .menu-links-list { list-style: none; margin-top: 20px; }
        .menu-links-list li { margin-bottom: 15px; }
        .menu-links-list a { 
            display: flex; align-items: center; gap: 15px; 
            text-decoration: none; color: var(--cor-texto); font-weight: bold; 
        }
        .menu-links-list img { width: 35px; }

        /* ==========================================
           CORPO PRINCIPAL (SCROLL LIVRE)
           ========================================== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .card-jogo {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
        }

        .card-jogo h3 { font-size: 2.2rem; color: var(--cor-primaria); margin-bottom: 15px; }
        .btn-jogar {
            background-color: var(--cor-primaria);
            color: white; border: none;
            padding: 20px 60px; font-size: 1.5rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; text-decoration: none;
            display: inline-block; margin-top: 20px;
        }

        /* FOOTER (40px) */
        footer {
            height: 40px;
            background-color: var(--cor-escura);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            margin-top: auto; /* Garante que fica no fim se o conteúdo for pouco */
        }
    </style>
</head>
<body>

    <div id="overlay" class="overlay"></div>
    <nav id="side-menu" class="side-menu">
        <h2 id="ui-menu-titulo" style="color: var(--cor-primaria)">Menu</h2>
        <ul id="ui-lista-menu" class="menu-links-list"></ul>
    </nav>

    <header>
        <div class="header-flex">
            <!-- ÍCONE ESQUERDA -->
            <button class="btn-menu" id="btn-abrir-menu">
                <div></div><div></div><div></div>
            </button>

            <!-- TÍTULOS CENTRO -->
            <div class="titulos">
                <h1 id="ui-t1"></h1>
                <h2 id="ui-t2"></h2>
            </div>

            <!-- ÍCONE DIREITA -->
            <a href="javascript:history.back()" class="btn-voltar-topo">
                <img id="ui-seta-voltar" src="" alt="Voltar">
            </a>
        </div>
    </header>

    <main>
        <section class="card-jogo">
            <h3 id="ui-nome-jogo"></h3>
            <p id="ui-descricao"></p>
            <a href="jogo.html" class="btn-jogar">JOGAR</a>
        </section>
        
        <!-- Espaço extra apenas para testar o scroll se necessário -->
        <div style="height: 200px;"></div>
    </main>

    <footer>
        <div id="ui-rodape"></div>
    </footer>

    <script src="dados.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const area = JOGO_CONFIG.areaAtiva;
            const ano = JOGO_CONFIG.anoAtivo;
            const tema = BIBLIOTECA_TEMAS[area];
            const conteudo = BIBLIOTECA_CONTEUDO[ano][area];

            // Cores
            const root = document.documentElement;
            root.style.setProperty('--cor-pagina', tema.corPagina);
            root.style.setProperty('--cor-primaria', tema.corPrimaria);
            root.style.setProperty('--cor-escura', tema.corEscura);
            root.style.setProperty('--cor-texto', tema.corTexto);

            // Conteúdo
            document.getElementById("ui-t1").innerText = conteudo.t1;
            document.getElementById("ui-t2").innerText = conteudo.t2;
            document.getElementById("ui-rodape").innerHTML = conteudo.rodape;
            document.getElementById("ui-seta-voltar").src = JOGO_CONFIG.caminhoIconsMenu + tema.voltarMobile;
            document.getElementById("ui-nome-jogo").innerText = JOGO_CONFIG.nomeDoJogo;
            document.getElementById("ui-descricao").innerText = JOGO_CONFIG.descricao;

            // Menu Lateral
            const listaMenu = document.getElementById("ui-lista-menu");
            JOGO_CONFIG.menuItens.forEach(item => {
                if(item.id === "voltar") return;
                const li = document.createElement("li");
                const imgFinal = (item.icon === "AUTO") ? tema.voltarMobile : item.icon;
                li.innerHTML = `<a href="${item.link}"><img src="${JOGO_CONFIG.caminhoIconsMenu}${imgFinal}"><span>${item.label}</span></a>`;
                listaMenu.appendChild(li);
            });

            // Toggle Menu
            const btnAbrir = document.getElementById("btn-abrir-menu");
            const sideMenu = document.getElementById("side-menu");
            const overlay = document.getElementById("overlay");
            const toggle = () => {
                sideMenu.classList.toggle("active");
                overlay.style.display = sideMenu.classList.contains("active") ? "block" : "none";
            };
            btnAbrir.addEventListener("click", toggle);
            overlay.addEventListener("click", toggle);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plataforma Educativa</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           1. BASE E LAYOUT RÍGIDO (SEM SCROLL)
           ========================================== */
        :root {
            --cor-pagina: #f0f0f0; --cor-primaria: #333; --cor-primaria-alpha: rgba(0,0,0,0.4); 
            --cor-escura: #000; --cor-texto: #5d7082; --text-grey: #8792a1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100vh; width: 100vw; overflow: hidden; position: fixed; }
        body { display: flex; flex-direction: column; font-family: 'Fredoka', sans-serif; background-color: var(--cor-pagina); }

        /* ==========================================
           2. HEADER (85px)
           ========================================== */
        header {
            height: 85px; background: white; display: flex; align-items: center; padding: 0 20px;
            border-bottom-left-radius: 35px; border-bottom-right-radius: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); z-index: 1100; flex-shrink: 0;
        }
        .header-flex { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 60px; width: 60px; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.85; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: 1.5rem; color: var(--cor-primaria); }
        #txt-titulo2 { font-weight: 800; font-size: 1.2rem; color: var(--text-grey); }
        #txt-subtitulo-header { color: var(--text-grey); font-weight: 600; font-size: 0.6rem; margin-top: 4px; }

        .btn-menu { background: none; border: none; cursor: pointer; width: 45px; }
        .btn-menu div { width: 28px; height: 4px; background-color: var(--cor-primaria); border-radius: 10px; margin: 4px 0; }

        /* ==========================================
           3. MENUS (TRANSPARENTE)
           ========================================== */
        .menu-dropdown { 
            position: fixed; top: 0; left: 0; width: 100%; height: auto;
            padding: 100px 20px 30px 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px;
            transform: translateY(-120%); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent !important;
        }
        .menu-dropdown.active { transform: translateY(0); }
        .menu-btn-item { width: 270px; background: white; display: flex; align-items: center; gap: 12px; padding: 10px 18px; text-decoration: none; color: var(--cor-texto); border-radius: 18px; font-weight: 600; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #f2f2f2; }
        .menu-btn-item img { width: 34px; height: 34px; object-fit: contain; }

        .info-full-page { position: fixed; bottom: -100%; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; transition: bottom 0.5s ease-in-out; display: flex; flex-direction: column; }
        .info-full-page.active { bottom: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); display: none; z-index: 900; backdrop-filter: blur(2px); }

        /* ==========================================
           4. MAIN E AS 3 TELAS (OCUPA 100%)
           ========================================== */
        main { flex: 1; padding: 15px; display: flex; flex-direction: column; min-height: 0; }
        
        .tela { 
            display: none; width: 100%; height: 100%; background: white; border-radius: 40px; 
            border: 3px solid var(--cor-primaria-alpha); box-shadow: 0 0 25px var(--cor-primaria-alpha);
            margin: 0 auto; max-width: 1100px; overflow: hidden;
        }
        .active-tela { display: flex !important; flex-direction: column; }

        /* Ecrã 1: Apresentação */
        .intro-wrapper { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .intro-topo { height: 85px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .intro-meio { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 10px; }
        .intro-fundo { height: 85px; display: flex; align-items: center; padding: 0 30px; gap: 20px; flex-shrink: 0; border-top: 1px solid #f2f2f2; }

        /* Ecrã 2: Jogo */
        .game-container { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .game-topo { height: 85px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #f2f2f2; flex-shrink: 0; }
        .game-meio { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 15px; }

        /* FOOTER (40px) */
        footer { height: 40px; background: white; color: var(--text-grey); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; border-top-left-radius: 30px; border-top-right-radius: 30px; box-shadow: 0 -4px 15px rgba(0,0,0,0.06); flex-shrink: 0; }
        
        /* Stats Styles */
        .round-pill { background: #6c757d; color: white; padding: 5px 15px; border-radius: 50px; font-weight: 900; }
        .stat-box { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 10px; color: white; font-weight: 900; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay"></div>
    <nav id="menu-dropdown" class="menu-dropdown"></nav>

    <div id="page-info" class="info-full-page">
        <header style="height:85px; display:flex; align-items:center; justify-content:space-between; padding:0 25px; border-bottom:1px solid #eee;">
            <span style="font-weight:900; color:var(--cor-primaria);">INFORMAÇÃO</span>
            <button class="btn-close-info" style="width:45px; height:45px; border-radius:50%; border:none; background:#eee; font-weight:900; cursor:pointer;">X</button>
        </header>
        <div id="ui-area-instrucoes" style="flex:1; padding:30px; overflow-y:auto;"></div>
    </div>

    <header>
        <div class="header-flex">
            <button class="btn-menu" id="btn-abrir-menu"><div></div><div></div><div></div></button>
            <div class="header-center">
                <img id="header-icon" src="">
                <div class="title-group">
                    <span id="txt-titulo1"></span><span id="txt-titulo2"></span><span id="txt-subtitulo-header"></span>
                </div>
            </div>
            <a href="javascript:history.back()" class="btn-voltar-topo"><img id="ui-seta-voltar" src="" height="45"></a>
        </div>
    </header>

    <main>
        <section id="tela-apresentacao" class="tela active-tela">
            <div class="intro-wrapper">
                <div class="intro-topo">
                    <h1 id="ui-nome-jogo-intro" style="font-size:1.2rem; font-weight:900; color:var(--cor-primaria); text-transform:uppercase;"></h1>
                </div>
                <div class="intro-meio" id="container-animacao-tutorial">
                    <!-- Tutorial injetado -->
                </div>
                <div class="intro-fundo">
                    <img class="img-info-src btn-trigger-info" src="" width="50" style="cursor:pointer;">
                    <button id="btn-jogar-main" style="flex:1; background:var(--cor-primaria); color:white; border:none; padding:15px; border-radius:50px; font-weight:900; font-size:1.5rem; cursor:pointer; text-transform:uppercase;">JOGAR</button>
                </div>
            </div>
        </section>

        <section id="tela-jogo" class="tela">
            <div class="game-container">
                <div class="game-topo">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img id="ui-help-lamp" src="" height="50" style="cursor:pointer;">
                        <div class="round-pill" id="ui-ronda">1/10</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <div class="stat-box" style="background:#8cc63f;">✓ <span id="ui-certos">0</span></div>
                        <div class="stat-box" style="background:#ff5a5f;">X <span id="ui-errados">0</span></div>
                        <img class="img-info-src btn-trigger-info" src="" width="35" style="cursor:pointer;">
                    </div>
                </div>
                <div class="game-meio" id="container-jogo-injetado"></div>
            </div>
        </section>

        <section id="tela-resultados" class="tela">
            <div id="container-resultados-injetado" style="flex:1; display:flex; align-items:center; justify-content:center;"></div>
        </section>
    </main>

    <footer><div id="ui-rodape"></div></footer>

    <script src="dados.js"></script>
    <script src="jogo.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const config = JOGO_CONFIG; const tema = BIBLIOTECA_TEMAS[config.areaAtiva]; const conteudo = BIBLIOTECA_CONTEUDO[config.anoAtivo][config.areaAtiva];
            document.title = config.nomeDoJogo;
            const root = document.documentElement;
            root.style.setProperty('--cor-pagina', tema.corPagina); root.style.setProperty('--cor-primaria', tema.corPrimaria); root.style.setProperty('--cor-primaria-alpha', tema.corPrimaria + '66');

            document.getElementById("txt-titulo1").innerText = conteudo.t1;
            document.getElementById("txt-titulo2").innerText = conteudo.t2;
            document.getElementById("txt-subtitulo-header").innerText = conteudo.sub;
            document.getElementById("ui-rodape").innerHTML = conteudo.rodape;
            document.getElementById("ui-nome-jogo-intro").innerText = config.nomeDoJogo;
            document.getElementById("ui-seta-voltar").src = config.caminhoIconsMenu + tema.voltarMobile;
            document.querySelectorAll(".img-info-src").forEach(img => img.src = config.caminhoIconsJogos + "inform.png");
            
            const itemAno = config.menuItens.find(item => item.id === config.anoAtivo);
            if (itemAno) document.getElementById("header-icon").src = config.caminhoIconsMenu + itemAno.icon;

            const menuDiv = document.getElementById("menu-dropdown");
            config.menuItens.forEach(item => {
                const link = document.createElement("a"); link.href = item.link; link.className = "menu-btn-item";
                const icon = (item.icon === "AUTO") ? tema.voltarMobile : item.icon;
                link.innerHTML = `<img src="${config.caminhoIconsMenu}${icon}"><span>${item.label}</span>`;
                menuDiv.appendChild(link);
            });

            document.getElementById("btn-jogar-main").onclick = () => { trocarEcra('tela-jogo'); if (typeof irParaJogo === 'function') irParaJogo(); };
            document.querySelectorAll(".btn-trigger-info").forEach(btn => btn.onclick = () => document.getElementById("page-info").classList.add("active"));
            document.querySelector(".btn-close-info").onclick = () => document.getElementById("page-info").classList.remove("active");
            document.getElementById("overlay").onclick = () => { menuDiv.classList.remove("active"); document.getElementById("overlay").style.display="none"; };
            document.getElementById("btn-abrir-menu").onclick = () => { const act = menuDiv.classList.toggle("active"); document.getElementById("overlay").style.display = act ? "block" : "none"; };
            menuDiv.onclick = (e) => { if (e.target === menuDiv) { menuDiv.classList.remove("active"); document.getElementById("overlay").style.display = "none"; } };

            if(typeof carregarInstrucoes === 'function') carregarInstrucoes();
            if(typeof iniciarTutorialVisual === 'function') iniciarTutorialVisual();
        });

        function trocarEcra(id) {
            document.querySelectorAll('.tela').forEach(t => t.classList.remove('active-tela'));
            document.getElementById(id).classList.add('active-tela');
        }
    </script>
</body>
</html>

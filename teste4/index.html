<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carregando...</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --text-grey: #8792a1; 
            --menu-item-h: clamp(40px, 6dvh, 50px); 
            --cor-dinamica: #E691A7; 
            --cor-certo: #8CC63F; 
            --cor-errado: #FF5A5F;
            --cor-ajuda: #FFB041;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        /* LAYOUT FULL VIEWPORT SEM SCROLL DA PÁGINA */
        html, body { 
            width: 100%;
            height: 100vh; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            background: #f0f2f5; 
            overflow: hidden; 
            transition: background 0.3s ease;
        }
        
        /* HEADER (ALURA CONTROLADA VIA CLAMP) */
        header { 
            flex: 0 0 auto;
            height: clamp(60px, 10dvh, 90px);
            background: white; 
            border-radius: 0 0 clamp(15px, 3vw, 35px) clamp(15px, 3vw, 35px); 
            display: grid; 
            grid-template-columns: clamp(40px, 8vw, 50px) 1fr clamp(40px, 8vw, 50px); 
            align-items: center; 
            padding: 0 clamp(10px, 2vw, 20px); 
            z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
        }

        .header-center { display: flex; align-items: center; justify-content: center; gap: clamp(6px, 1.5vw, 12px); }
        #header-icon { height: clamp(35px, 6dvh, 60px); width: clamp(35px, 6dvh, 60px); object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.9; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: clamp(1rem, 2dvh + 0.5vw, 1.5rem); color: var(--cor-dinamica); }
        #txt-titulo2 { font-weight: 800; font-size: clamp(0.85rem, 1.6dvh + 0.4vw, 1.3rem); color: #8792a1; }
        #txt-subtitulo-header { color: var(--text-grey); font-weight: 700; font-size: clamp(0.55rem, 1dvh, 0.65rem); margin-top: 2px; opacity: 0.9; }

        .hamburger-btn { background: none; border: none; font-size: clamp(20px, 3.5dvh, 28px); cursor: pointer; color: var(--cor-dinamica); }
        #icon-voltar-top { height: clamp(30px, 5dvh, 42px); width: auto; object-fit: contain; cursor: pointer; justify-self: end; }

        /* MENU HAMBÚRGUER DROPDOWN */
        .menu-dropdown { 
            position: absolute; 
            top: clamp(65px, 10dvh, 85px); 
            left: 15px; 
            display: none; 
            flex-direction: column; 
            gap: 8px; 
            z-index: 2000; 
            width: clamp(180px, 30vw, 230px); 
        }
        .menu-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            height: var(--menu-item-h); 
            padding: 0 15px; 
            text-decoration: none; 
            color: #7b899b; 
            font-weight: 800; 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            cursor: pointer; 
            text-transform: uppercase; 
            font-size: clamp(0.75rem, 1.2dvh, 0.85rem); 
            transition: 0.2s; 
        }
        .menu-item img { height: clamp(20px, 3dvh, 28px); width: clamp(20px, 3dvh, 28px); object-fit: contain; }
        .menu-item:hover { background-color: var(--cor-dinamica) !important; color: white !important; }

        /* MAIN (EXPANDE PARA OCUPAR O ESPAÇO RESTANTE) */
        main { 
            flex: 1 1 auto; 
            min-height: 0; /* IMPEDE QUE O FLEXBOX REBENTE O VIEWPORT */
            display: flex; 
            flex-direction: column; 
            background: white; 
            margin: clamp(6px, 1.5dvh, 20px) auto; 
            padding: clamp(10px, 2dvh, 25px); 
            border-radius: clamp(20px, 4vw, 35px); 
            border: 2px solid #fff; 
            max-width: min(950px, 96vw); 
            width: calc(100% - clamp(16px, 4vw, 40px)); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            overflow: hidden; 
            position: relative;
        }

        /* GAME CONTAINER (Ocupa a área total do main sem provocar scroll) */
        .game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        .view-container { 
            display: none; 
            flex-direction: column; 
            flex: 1 1 auto; 
            min-height: 0; 
            width: 100%; 
            height: 100%;
            overflow: hidden;
        }
        .view-active { display: flex; }
        
        .card-topo { 
            flex: 0 0 auto; 
            padding-bottom: clamp(6px, 1dvh, 12px); 
            border-bottom: 2px solid #f8f9fa; 
            margin-bottom: clamp(6px, 1dvh, 12px); 
            text-align: center; 
        }
        .card-topo h2 { color: var(--cor-dinamica); text-transform: uppercase; font-weight: 900; font-size: clamp(1.1rem, 2dvh + 0.2vw, 1.4rem); }
        
        .card-meio { 
            flex: 1 1 auto; 
            min-height: 0; /* PERMITE MAXIMIZAR IMAGENS E GRELHAS */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border-radius: 20px; 
            background: #fdfdfd; 
            position: relative; 
            padding: clamp(5px, 1dvh, 10px); 
            width: 100%;
            overflow: hidden;
        }
        
        .card-fundo { 
            flex: 0 0 auto; 
            display: flex; 
            align-items: center; 
            gap: clamp(8px, 2vw, 15px); 
            padding-top: clamp(8px, 1.5dvh, 15px); 
        }

        /* PAINEL DE STATUS DE JOGO */
        .game-status-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 5px; }
        .status-left, .status-right { display: flex; align-items: center; gap: clamp(4px, 1vw, 8px); }
        .stat-pill { 
            height: clamp(26px, 4dvh, 32px); 
            padding: 0 clamp(8px, 1.5vw, 12px); 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-weight: 800; 
            font-size: clamp(0.75rem, 1.2dvh, 0.9rem); 
            min-width: clamp(50px, 10vw, 65px); 
        }
        .pill-ronda { background-color: var(--cor-dinamica); }
        .pill-certo { background-color: var(--cor-certo); gap: 4px; }
        .pill-errado { background-color: var(--cor-errado); gap: 4px; }
        #img-lampada { height: clamp(26px, 4dvh, 32px); width: auto; cursor: pointer; transition: 0.2s; }
        .btn-info-mini { 
            width: clamp(24px, 3.8dvh, 28px); 
            height: clamp(24px, 3.8dvh, 28px); 
            border-radius: 50%; 
            border: 2px solid var(--cor-dinamica); 
            color: var(--cor-dinamica); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: clamp(0.75rem, 1.2dvh, 0.85rem); 
            font-weight: bold; 
            cursor: pointer; 
            font-family: 'Georgia', serif; 
            font-style: italic; 
            background: white; 
        }

        /* ECRÃ DE RESULTADOS */
        .stats-container { display: flex; gap: clamp(8px, 1.5vw, 12px); margin: clamp(8px, 1.5dvh, 15px) 0; width: 100%; justify-content: center; flex-wrap: wrap; }
        .stat-card { 
            background: white; 
            border-radius: 20px; 
            padding: clamp(8px, 1.5dvh, 15px); 
            width: clamp(80px, 20vw, 100px); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); 
            border: 1px solid #f0f0f0; 
        }
        .stat-card .num { font-size: clamp(1.5rem, 3dvh, 2.2rem); font-weight: 900; line-height: 1; margin-bottom: 4px; }
        .stat-card .label { font-size: clamp(0.6rem, 1dvh, 0.7rem); font-weight: 800; color: #8792a1; text-transform: uppercase; }
        .c-certo { color: var(--cor-certo); }
        .c-errado { color: var(--cor-errado); }
        .c-ajuda { color: var(--cor-ajuda); }

        /* BOTÕES */
        .btn-jogar { 
            flex: 1 1 auto; 
            background: var(--cor-dinamica); 
            color: white; 
            padding: clamp(10px, 2dvh, 16px); 
            border-radius: clamp(14px, 2vw, 20px); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            font-weight: 900; 
            font-size: clamp(0.85rem, 1.5dvh, 1.1rem); 
            border: none; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
        }
        .btn-secundario { background: #8792a1; }
        .btn-jogar:active { transform: scale(0.98); }

        /* MODAL INFORMAÇÕES (ÚNICA ÁREA COM SCROLL INTERNO QUANDO NECESSÁRIO) */
        #info-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; display: none; flex-direction: column; padding: clamp(15px, 3vw, 30px); overflow-y: auto; }
        
        /* FOOTER */
        footer { 
            flex: 0 0 auto;
            height: clamp(30px, 5dvh, 45px); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: white; 
            border-radius: clamp(15px, 3vw, 35px) clamp(15px, 3vw, 35px) 0 0; 
        }
        .footer-text { color: var(--text-grey); font-size: clamp(0.7rem, 1.2dvh, 0.85rem); font-weight: 700; }

        /* OTIMIZAÇÕES DE PAISAGEM EM SMARTPHONES E TABLETS PEQUENOS */
        @media (max-height: 500px) {
            header { height: clamp(45px, 12dvh, 55px); }
            #txt-subtitulo-header { display: none; }
            main { margin: 4px auto; padding: 8px 12px; border-radius: 18px; }
            .card-topo { padding-bottom: 4px; margin-bottom: 4px; }
            .card-fundo { padding-top: 6px; }
            footer { height: clamp(22px, 5dvh, 30px); }
        }
    </style>
</head>
<body>

        <button class="hamburger-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="menu-dropdown"></div>
        <div class="header-center">
            <img id="header-icon" src="" alt="">
            <div class="title-group">
                <div id="txt-titulo1"></div>
                <div id="txt-titulo2"></div>
                <div id="txt-subtitulo-header"></div>
            </div>
        </div>
        <img id="icon-voltar-top" src="" alt="Voltar" onclick="voltarPagina()">
    </header>

    <main>
        <!-- CONTENTOR .game-container QUE PREENCHE 100% DO MAIN SEM PERMITIR SCROLL DA PÁGINA -->
        <div class="game-container">
            
            <!-- ECRÃ 1: APRESENTAÇÃO -->
            <div id="view-apresentacao" class="view-container view-active">
                <div class="card-topo"><h2 id="jogo-titulo"></h2></div>
                <div class="card-meio" id="area-jogo-conteudo"></div>
                <div class="card-fundo">

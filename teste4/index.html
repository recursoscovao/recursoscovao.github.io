<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carregando...</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --text-grey: #8792a1; 
            --cor-dinamica: #E691A7; 
            --cor-certo: #8CC63F; 
            --cor-errado: #FF5A5F;
            --cor-ajuda: #FFB041;
            
            /* Alturas responsivas */
            --header-h: clamp(65px, 10dvh, 95px);
            --footer-h: clamp(35px, 5dvh, 45px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        /* 1. LAYOUT BASE (App-Like com Scroll Global) */
        html, body { 
            min-height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            background: #f0f2f5; 
            overflow-x: hidden;
            overflow-y: auto; 
        }
        
        header { 
            height: var(--header-h);
            background: white; 
            border-radius: 0 0 clamp(20px, 3vw, 35px) clamp(20px, 3vw, 35px); 
            display: grid; 
            grid-template-columns: 50px 1fr 50px; 
            align-items: center; 
            padding: 0 clamp(10px, 3vw, 25px); 
            flex-shrink: 0; 
            z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
        }

        .header-center { display: flex; align-items: center; justify-content: center; gap: 10px; }
        #header-icon { height: clamp(40px, 7dvh, 60px); width: auto; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.9; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: clamp(1rem, 2.2dvh, 1.5rem); color: var(--cor-dinamica); }
        #txt-titulo2 { font-weight: 800; font-size: clamp(0.8rem, 1.8dvh, 1.3rem); color: #8792a1; }
        #txt-subtitulo-header { color: var(--text-grey); font-weight: 700; font-size: clamp(0.55rem, 1dvh, 0.65rem); margin-top: 3px; }

        .hamburger-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--cor-dinamica); }
        #icon-voltar-top { height: clamp(30px, 5dvh, 42px); cursor: pointer; justify-self: end; }

        /* 2. MAIN E CONTENTOR DO JOGO */
        main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: clamp(10px, 2.5dvh, 25px) clamp(10px, 3vw, 30px); 
            width: 100%; 
            max-width: 1100px; 
            margin: 0 auto; 
        }

        .game-container {
            width: 100%;
            flex: 1; 
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: clamp(20px, 4dvh, 35px);
            border: 2px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: clamp(12px, 2.5dvh, 25px);
            position: relative;
            min-height: 400px;
        }

        .view-container { display: none; flex-direction: column; height: 100%; flex: 1; }
        .view-active { display: flex; }
        
        .card-topo { flex-shrink: 0; padding-bottom: 12px; border-bottom: 2px solid #f8f9fa; margin-bottom: 12px; text-align: center; }
        .card-topo h2 { color: var(--cor-dinamica); text-transform: uppercase; font-weight: 900; font-size: clamp(1.1rem, 2.8dvh, 1.4rem); }
        
        .card-meio { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border-radius: 20px; 
            background: #fdfdfd; 
            padding: 8px; 
            width: 100%;
        }
        
        .card-fundo { flex-shrink: 0; display: flex; align-items: center; gap: 15px; padding-top: 15px; }

        /* 3. BARRA DE STATUS (TUDO NUMA LINHA SÓ) */
        .game-status-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%; 
            gap: 4px; /* Gap pequeno para caber tudo em ecrãs pequenos */
            flex-wrap: nowrap; /* Força a manter na mesma linha */
        }
        
        .status-group { display: flex; align-items: center; gap: clamp(4px, 1vw, 8px); }

        .stat-pill { 
            height: clamp(28px, 4dvh, 34px); 
            padding: 0 clamp(6px, 1.5vw, 12px); 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-weight: 800; 
            font-size: clamp(0.7rem, 1.3dvh, 0.9rem); 
            min-width: clamp(50px, 8vw, 70px); 
            white-space: nowrap;
        }
        .pill-ronda { background-color: var(--cor-dinamica); }
        .pill-certo { background-color: var(--cor-certo); }
        .pill-errado { background-color: var(--cor-errado); }

        #img-lampada { height: clamp(28px, 4dvh, 34px); width: auto; cursor: pointer; transition: 0.2s; }
        
        .btn-info-mini { 
            width: clamp(26px, 3.8dvh, 32px); 
            height: clamp(26px, 3.8dvh, 32px); 
            border-radius: 50%; border: 2px solid var(--cor-dinamica); 
            color: var(--cor-dinamica); display: flex; align-items: center; justify-content: center; 
            font-size: 0.85rem; font-weight: bold; font-family: serif; font-style: italic; background: white; cursor: pointer; 
        }

        /* RESULTADOS */
        .stats-container { display: flex; gap: 10px; margin: 15px 0; justify-content: center; flex-wrap: wrap; }
        .stat-card { background: white; border-radius: 20px; padding: 15px; width: 95px; display: flex; flex-direction: column; align-items: center; border: 1px solid #f0f0f0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .stat-card .num { font-size: 2.2rem; font-weight: 900; line-height: 1; margin-bottom: 5px; }
        .stat-card .label { font-size: 0.7rem; font-weight: 800; color: #8792a1; text-transform: uppercase; }

        /* BOTÕES */
        .btn-jogar { flex: 1; background: var(--cor-dinamica); color: white; padding: 15px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 900; font-size: 1.1rem; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-secundario { background: #8792a1; }

        /* MENU DROP */
        .menu-dropdown { position: absolute; top: calc(var(--header-h) - 10px); left: 15px; display: none; flex-direction: column; gap: 8px; z-index: 2000; width: 230px; }
        .menu-item { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 15px; text-decoration: none; color: #7b899b; font-weight: 800; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); font-size: 0.85rem; transition: 0.2s; }
        .menu-item:hover { background-color: var(--cor-dinamica) !important; color: white !important; }

        /* FOOTER */
        footer { 
            height: var(--footer-h); 
            display: flex; align-items: center; justify-content: center; 
            background: white; border-radius: clamp(20px, 3vw, 35px) clamp(20px, 3vw, 35px) 0 0; 
            flex-shrink: 0; margin-top: auto;
        }
        .footer-text { color: var(--text-grey); font-size: clamp(0.7rem, 1.4dvh, 0.85rem); font-weight: 700; }

        #info-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; display: none; flex-direction: column; padding: 30px; overflow-y: auto; }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="menu-dropdown"></div>
        <div class="header-center">
            <img id="header-icon" src="" alt="">
            <div class="title-group">
                <div id="txt-titulo1"></div>
                <div id="txt-titulo2"></div>
                <div id="txt-subtitulo-header"></div>
            </div>
        </div>
        <img id="icon-voltar-top" src="" alt="Voltar" onclick="voltarPagina()">
    </header>

    <main>
        <div class="game-container">
            
            <!-- APRESENTAÇÃO -->
            <div id="view-apresentacao" class="view-container view-active">
                <div class="card-topo"><h2 id="jogo-titulo"></h2></div>
                <div class="card-meio" id="area-jogo-conteudo"></div>
                <div class="card-fundo">
                    <div class="btn-info" onclick="toggleInfoScreen(true)" style="width: clamp(45px, 6dvh, 60px); height: clamp(45px, 6dvh, 60px); border-radius: 50%; border: 3px solid var(--cor-dinamica); color: var(--cor-dinamica); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; background: white; cursor: pointer; font-weight: bold; font-family: serif; font-style: italic;">i</div>
                    <button class="btn-jogar" onclick="mudarEcra('jogo')"><i class="fas fa-play"></i> JOGAR</button>
                </div>
            </div>

            <!-- JOGO (BARRA DE STATUS NUMA LINHA) -->
            <div id="view-jogo" class="view-container">
                <div class="card-topo">
                    <div class="game-status-bar">
                        <!-- Esquerda: Lâmpada + Rondas -->
                        <div class="status-group">
                            <img id="img-lampada" src="" alt="Ajuda" onclick="if(typeof pedirAjuda === 'function') pedirAjuda()">
                            <div class="stat-pill pill-ronda"><span id="ronda-atual">1</span> / 10</div>
                        </div>
                        
                        <!-- Direita: Certos + Errados + Info -->
                        <div class="status-group">
                            <div class="stat-pill pill-certo"><i class="fas fa-check"></i> <span id="cont-certos-jogo">0</span></div>
                            <div class="stat-pill pill-errado"><i class="fas fa-times"></i> <span id="cont-errados-jogo">0</span></div>
                            <div class="btn-info-mini" onclick="toggleInfoScreen(true)">i</div>
                        </div>
                    </div>
                </div>
                <div class="card-meio">
                    <div id="game-injection-point" style="width:100%; height:100%;"></div>
                </div>
            </div>

            <!-- RESULTADOS -->
            <div id="view-resultados" class="view-container">
                <div class="card-topo"><h2>RESULTADOS</h2></div>
                <div class="card-meio">
                    <img id="res-img" src="" style="height: clamp(80px, 15dvh, 110px); object-fit: contain; margin-bottom: 10px;">
                    <div id="res-titulo" style="font-weight: 900; font-size: 1.8rem; color: var(--cor-dinamica); text-align: center;"></div>
                    <p style="color: #8792a1; font-weight: 700; margin-bottom: 10px;">Desafio concluído com sucesso!</p>
                    <div class="stats-container">
                        <div class="stat-card"><span id="res-certos" class="num" style="color:var(--cor-certo)">0</span><span class="label">Certos</span></div>
                        <div class="stat-card"><span id="res-errados" class="num" style="color:var(--cor-errado)">0</span><span class="label">Errados</span></div>
                        <div class="stat-card"><span id="res-ajudas" class="num" style="color:var(--cor-ajuda)">0</span><span class="label">Ajudas</span></div>
                    </div>
                </div>
                <div class="card-fundo">
                    <button class="btn-jogar btn-secundario" onclick="voltarPagina()">Sair</button>
                    <button class="btn-jogar" onclick="mudarEcra('apresentacao')">Repetir</button>
                </div>
            </div>

        </div>
    </main>

    <footer><span class="footer-text" id="txt-rodape"></span></footer>

    <div id="info-screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="font-weight: 900; color: var(--cor-dinamica); font-size: 1.8rem;">Instruções</h2>
            <i class="fas fa-times" style="font-size:2rem;cursor:pointer" onclick="toggleInfoScreen(false)"></i>
        </div>
        <div class="info-content" id="info-texto"></div>
    </div>

    <script src="dados.js"></script>
    <script src="jogo.js"></script>

    <script>
        let certosGlobal = 0, erradosGlobal = 0, ajudasGlobal = 0;

        function mudarEcra(id) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('view-active'));
            document.getElementById('view-' + id).classList.add('view-active');
            
            if(id === 'jogo') { 
                document.querySelector('footer').style.display = 'none'; 
                if(typeof initJogo === "function") initJogo(); 
            } else { 
                document.querySelector('footer').style.display = 'flex'; 
            }

            if(id === 'resultados') {
                document.getElementById('res-certos').innerText = certosGlobal;
                document.getElementById('res-errados').innerText = erradosGlobal;
                document.getElementById('res-ajudas').innerText = ajudasGlobal;
                const rel = JOGO_CONFIG.relatorios.find(r => certosGlobal >= r.min && certosGlobal <= r.max);
                if(rel) { 
                    document.getElementById('res-titulo').innerText = rel.titulo; 
                    document.getElementById('res-img').src = JOGO_CONFIG.caminhoIconsMenu + rel.img; 
                }
            }
        }

        function voltarPagina() { window.history.back(); }
        function toggleMenu(e) { if(e) e.stopPropagation(); const m = document.getElementById('dropdownMenu'); m.style.display = (m.style.display==='flex')?'none':'flex'; }
        function toggleInfoScreen(s) { document.getElementById('info-screen').style.display = s?'flex':'none'; }
        window.onclick = () => document.getElementById('dropdownMenu').style.display = 'none';

        window.onload = () => {
            const config = JOGO_CONFIG;
            document.title = config.nomeDoJogo;
            const tema = BIBLIOTECA_TEMAS[config.areaAtiva];
            const conteudo = BIBLIOTECA_CONTEUDO[config.anoAtivo][config.areaAtiva];
            const pathIcons = config.caminhoIconsMenu;

            document.documentElement.style.setProperty('--cor-dinamica', tema.corPrimaria);
            document.body.style.backgroundColor = tema.corPagina;

            document.getElementById('txt-titulo1').innerText = conteudo.t1;
            document.getElementById('txt-titulo2').innerText = conteudo.t2;
            document.getElementById('txt-subtitulo-header').innerText = conteudo.sub;
            document.getElementById('txt-rodape').innerHTML = conteudo.rodape;
            document.getElementById('icon-voltar-top').src = pathIcons + tema.voltarMobile;
            document.getElementById('img-lampada').src = pathIcons + "lampada.png";

            const dadosAno = config.menuItens.find(item => item.id === config.anoAtivo);
            if(dadosAno) document.getElementById('header-icon').src = pathIcons + dadosAno.icon;

            const menuBox = document.getElementById('dropdownMenu');
            config.menuItens.forEach(item => {
                const a = document.createElement('a');
                a.className = 'menu-item'; a.href = item.link;
                const icon = (item.icon === "AUTO") ? tema.voltarMobile : item.icon;
                a.innerHTML = `<img src="${pathIcons}${icon}" style="height:25px;width:25px;object-fit:contain"><span style="margin-left:12px">${item.label}</span>`;
                menuBox.appendChild(a);
            });

            document.getElementById('jogo-titulo').innerText = config.nomeDoJogo;
            if(DADOS_JOGO.itens && DADOS_JOGO.itens.length > 0) {
                document.getElementById('area-jogo-conteudo').innerHTML = `<img src="${DADOS_JOGO.caminhoImagens}${DADOS_JOGO.itens[0].img}" style="max-width: 80%; max-height: 250px; object-fit: contain;">`;
            }
        };
    </script>
</body>
</html>

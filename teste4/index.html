<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="aba-navegador">Jogo Educativo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --text-grey: #8792a1; --menu-item-h: 50px; --cor-dinamica: #E691A7; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #f0f2f5; }
        
        header { background: white; border-radius: 0 0 35px 35px; display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; padding: 0 15px; height: 95px; z-index: 1000; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 70px; width: 70px; object-fit: contain; }
        
        .title-group { display: flex; flex-direction: column; line-height: 0.85; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: 1.65rem; }
        #txt-titulo2 { font-weight: 800; font-size: 1.4rem; color: #8792a1; }
        #txt-subtitulo-header { color: var(--text-grey); font-weight: 600; font-size: 0.65rem; margin-top: 4px; opacity: 0.9; }
        
        .hamburger-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--cor-dinamica); }
        #icon-voltar-top { height: 42px; width: 42px; object-fit: contain; cursor: pointer; justify-self: end; }
        
        /* Ajuste do Dropdown */
        .menu-dropdown { position: absolute; top: 85px; left: 15px; display: none; flex-direction: column; gap: 8px; z-index: 2000; width: 230px; }
        .menu-item { display: flex; align-items: center; gap: 12px; height: var(--menu-item-h); padding: 0 15px; text-decoration: none; color: #7b899b; font-weight: 800; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); cursor: pointer; text-transform: uppercase; font-size: 0.85rem; transition: 0.2s; }
        .menu-item img { height: 30px; width: 30px; object-fit: contain; }
        .menu-item:hover { background-color: var(--cor-dinamica) !important; color: white !important; }
        
        main { flex: 1; display: flex; flex-direction: column; background: white; margin: 0 20px 10px 20px; padding: 25px; border-radius: 35px; border: 2px solid #fff; max-width: 950px; align-self: center; width: calc(100% - 40px); box-shadow: 0 0 20px 2px color-mix(in srgb, var(--cor-dinamica), transparent 85%); overflow: hidden; position: relative; }
        
        .view-container { display: none; flex-direction: column; height: 100%; flex: 1; overflow: hidden; }
        .view-active { display: flex; }
        
        /* Títulos com Cores Dinâmicas */
        .card-topo { flex-shrink: 0; text-align: center; padding-bottom: 15px; border-bottom: 1px dashed #eee; margin-bottom: 15px; }
        .card-topo h2 { font-size: 1.4rem; font-weight: 900; color: var(--cor-dinamica); text-transform: uppercase; }
        
        .card-meio { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 20px; background: #fdfdfd; position: relative; }
        #game-injection-point { width: 100%; height: 100%; overflow-y: auto; padding: 10px; }
        
        .card-fundo { flex-shrink: 0; display: flex; align-items: center; gap: 15px; padding-top: 20px; }
        .btn-info { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--cor-dinamica); color: var(--cor-dinamica); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; background: white; cursor: pointer; transition: 0.3s; flex-shrink: 0; }
        .btn-jogar { flex: 1; background: var(--cor-dinamica); color: white; padding: 18px; border-radius: 25px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 900; font-size: 1.2rem; border: none; cursor: pointer; text-transform: uppercase; }
        
        #info-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; display: none; flex-direction: column; padding: 30px; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        footer { height: 40px; display: flex; align-items: center; justify-content: center; background: white; border-radius: 35px 35px 0 0; flex-shrink: 0; }
        .footer-text { color: var(--text-grey); font-size: 0.85rem; font-weight: 700; }
    </style>
</head>
<body>
    <header>
        <!-- Importante: onclick corrigido -->
        <button class="hamburger-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="menu-dropdown"></div>
        
        <div class="header-center">
            <img id="header-icon" src="" alt="">
            <div class="title-group">
                <div id="txt-titulo1"></div>
                <div id="txt-titulo2"></div>
                <div id="txt-subtitulo-header"></div>
            </div>
        </div>
        
        <img id="icon-voltar-top" src="" alt="Voltar" onclick="voltarPagina()">
    </header>

    <main>
        <div id="view-apresentacao" class="view-container view-active">
            <div class="card-topo"><h2 id="jogo-titulo">---</h2></div>
            <div class="card-meio" id="area-jogo-intro"></div>
            <div class="card-fundo">
                <div class="btn-info" onclick="toggleInfoScreen(true)"><i>i</i></div>
                <button class="btn-jogar" onclick="mudarEcra('jogo')"><i class="fas fa-play"></i> JOGAR</button>
            </div>
        </div>

        <div id="view-jogo" class="view-container">
            <div class="card-topo"><h2 id="jogo-titulo-exec">---</h2></div>
            <div class="card-meio"><div id="game-injection-point"></div></div>
            <div class="card-fundo">
                <button class="btn-jogar" onclick="mudarEcra('resultados')">TERMINAR</button>
            </div>
        </div>

        <div id="view-resultados" class="view-container">
            <!-- Título Resultados também com cor dinâmica via CSS -->
            <div class="card-topo"><h2>RESULTADOS</h2></div>
            <div class="card-meio">
                <div style="text-align:center">
                    <img id="res-img" src="" style="width:150px; margin-bottom:15px; object-fit:contain;">
                    <div id="res-titulo" style="font-weight:900; font-size:1.8rem; color:var(--cor-dinamica); text-transform:uppercase;"></div>
                    <p style="font-weight:700; color:#8792a1;">Desafio Concluído!</p>
                </div>
            </div>
            <div class="card-fundo">
                <button class="btn-jogar" onclick="mudarEcra('apresentacao')">VOLTAR AO INÍCIO</button>
            </div>
        </div>
    </main>

    <footer><span class="footer-text" id="txt-rodape"></span></footer>

    <div id="info-screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 id="info-titulo" style="font-weight:900; color:var(--cor-dinamica);">Instruções</h2>
            <i class="fas fa-times" style="font-size:2rem; cursor:pointer; color:#8792a1;" onclick="toggleInfoScreen(false)"></i>
        </div>
        <div id="info-texto" style="flex:1; overflow-y:auto; font-size:1.1rem; line-height:1.6;"></div>
    </div>

    <script src="dados.js"></script>
    <script src="jogos.js"></script>

    <script>
        // FUNÇÃO TOGGLE MENU CORRIGIDA
        function toggleMenu(e) {
            if(e) e.stopPropagation();
            const m = document.getElementById('dropdownMenu');
            // Verifica o estado real computado para garantir que abre no primeiro clique
            const currentDisplay = window.getComputedStyle(m).display;
            m.style.display = (currentDisplay === 'none') ? 'flex' : 'none';
        }

        function mudarEcra(id) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('view-active'));
            document.getElementById('view-' + id).classList.add('view-active');
            document.querySelector('footer').style.visibility = (id === 'jogo') ? 'hidden' : 'visible';

            if(id === 'resultados') {
                const pontos = window.pontuacaoFinal || 0;
                const rel = JOGO_CONFIG.relatorios.find(r => pontos >= r.min && pontos <= r.max);
                if(rel) {
                    document.getElementById('res-titulo').innerText = rel.titulo;
                    document.getElementById('res-img').src = JOGO_CONFIG.caminhoIconsMenu + rel.img;
                }
            }
        }

        function voltarPagina() { window.location.href = JOGO_CONFIG.links.home; }
        function toggleInfoScreen(show) { document.getElementById('info-screen').style.display = show ? 'flex' : 'none'; }

        // Fechar menu ao clicar fora
        window.onclick = function(event) {
            const m = document.getElementById('dropdownMenu');
            if (m.style.display === 'flex') {
                m.style.display = 'none';
            }
        }

        window.onload = () => {
            const config = JOGO_CONFIG;
            const tema = BIBLIOTECA_TEMAS[config.areaAtiva];
            const conteudo = BIBLIOTECA_CONTEUDO[config.anoAtivo][config.areaAtiva];
            const pathIcons = config.caminhoIconsMenu;

            // Cores Dinâmicas
            document.documentElement.style.setProperty('--cor-dinamica', tema.corPrimaria);
            document.getElementById('txt-titulo1').style.color = tema.corPrimaria;
            
            // Textos
            document.getElementById('txt-titulo1').innerText = conteudo.t1;
            document.getElementById('txt-titulo2').innerText = conteudo.t2;
            document.getElementById('txt-subtitulo-header').innerText = conteudo.sub;
            document.getElementById('txt-rodape').innerHTML = conteudo.rodape;
            
            // Ícones de Topo
            document.getElementById('header-icon').src = pathIcons + config.iconesMenu[config.anoAtivo];
            document.getElementById('icon-voltar-top').src = pathIcons + tema.voltarMobile;

            // Menu Hambúrguer Dinâmico
            const menuBox = document.getElementById('dropdownMenu');
            const ordem = ['home', 'pre', 'ano1', 'ano2', 'ano3', 'ano4'];
            const labels = { home: "Início", pre: "Pré-Escolar", ano1: "1º Ano", ano2: "2º Ano", ano3: "3º Ano", ano4: "4º Ano" };

            ordem.forEach(key => {
                if(config.links[key]) {
                    const a = document.createElement('a');
                    a.className = 'menu-item';
                    a.href = config.links[key];
                    a.innerHTML = `<img src="${pathIcons}${config.iconesMenu[key]}"><span>${labels[key]}</span>`;
                    menuBox.appendChild(a);
                }
            });

            const btnV = document.createElement('a');
            btnV.className = 'menu-item';
            btnV.href = "javascript:history.back()";
            btnV.innerHTML = `<img src="${pathIcons}${tema.voltarMobile}"><span>VOLTAR</span>`;
            menuBox.appendChild(btnV);

            // Jogo Inicial
            const jogo = config.listaFases[0].jogos[0];
            document.getElementById('aba-navegador').innerText = jogo.nome;
            document.getElementById('jogo-titulo').innerText = jogo.nome;
            document.getElementById('jogo-titulo-exec').innerText = jogo.nome;
            document.getElementById('area-jogo-intro').innerHTML = `<img src="${config.caminhoIconsJogos}${jogo.icon}" style="max-height:80%; max-width:80%; object-fit:contain;">`;
            document.getElementById('info-texto').innerHTML = `<p>${jogo.desc}</p>`;
        };
    </script>
</body>
</html>

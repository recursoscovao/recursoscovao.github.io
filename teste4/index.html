<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo Educativo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --text-grey: #8792a1; --menu-item-h: 50px; --cor-dinamica: #E691A7; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #f0f2f5; transition: background 0.3s ease; }
        
        /* HEADER PRINCIPAL */
        header { background: white; border-radius: 0 0 35px 35px; display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; padding: 0 15px; height: 95px; z-index: 1000; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 60px; width: 60px; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.9; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: 1.5rem; color: var(--cor-dinamica); }
        #txt-titulo2 { font-weight: 800; font-size: 1.3rem; color: #8792a1; }
        #txt-subtitulo-header { color: var(--text-grey); font-weight: 700; font-size: 0.65rem; margin-top: 4px; opacity: 0.9; }
        .hamburger-btn { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--cor-dinamica); }
        #icon-voltar-top { height: 42px; width: 42px; object-fit: contain; cursor: pointer; justify-self: end; }

        /* MENU */
        .menu-dropdown { position: absolute; top: 85px; left: 15px; display: none; flex-direction: column; gap: 8px; z-index: 2000; width: 230px; }
        .menu-item { display: flex; align-items: center; gap: 12px; height: var(--menu-item-h); padding: 0 15px; text-decoration: none; color: #7b899b; font-weight: 800; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); cursor: pointer; text-transform: uppercase; font-size: 0.85rem; }

        /* MAIN */
        main { flex: 1; display: flex; flex-direction: column; background: white; margin: 0 20px 20px 20px; padding: 25px; border-radius: 35px; border: 2px solid #fff; max-width: 950px; align-self: center; width: calc(100% - 40px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
        .view-container { display: none; flex-direction: column; height: 100%; flex: 1; }
        .view-active { display: flex; }
        
        .card-topo { flex-shrink: 0; text-align: center; padding-bottom: 15px; border-bottom: 1px dashed #eee; margin-bottom: 15px; }
        .card-meio { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 20px; background: #fdfdfd; position: relative; }
        .card-fundo { flex-shrink: 0; display: flex; align-items: center; gap: 15px; padding-top: 20px; }

        /* PAINEL DE JOGO (NOVO) */
        .game-status-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .status-group { display: flex; align-items: center; gap: 20px; flex: 1; justify-content: center; }
        .status-item { font-weight: 900; font-size: 1.1rem; color: #5d7082; display: flex; align-items: center; gap: 8px; }
        
        .btn-ajuda { font-size: 1.8rem; color: #FFC107; cursor: pointer; transition: 0.2s; }
        .btn-ajuda:hover { transform: scale(1.1); }
        
        .btn-info-mini { 
            width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--cor-dinamica); 
            color: var(--cor-dinamica); display: flex; align-items: center; justify-content: center; 
            font-size: 1.1rem; font-weight: bold; cursor: pointer; font-family: 'Georgia', serif; font-style: italic;
        }

        .count-box { padding: 4px 12px; border-radius: 12px; color: white; min-width: 45px; text-align: center; }
        .bg-certos { background: #45cfa8; }
        .bg-errados { background: #ff6b6b; }

        /* GERAL */
        .btn-jogar { flex: 1; background: var(--cor-dinamica); color: white; padding: 18px; border-radius: 25px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 900; font-size: 1.2rem; border: none; cursor: pointer; }
        #info-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; display: none; flex-direction: column; padding: 30px; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
        footer { height: 45px; display: flex; align-items: center; justify-content: center; background: white; border-radius: 35px 35px 0 0; flex-shrink: 0; }
        .footer-text { color: var(--text-grey); font-size: 0.85rem; font-weight: 700; }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="menu-dropdown"></div>
        <div class="header-center">
            <img id="header-icon" src="" alt="">
            <div class="title-group">
                <div id="txt-titulo1"></div>
                <div id="txt-titulo2"></div>
                <div id="txt-subtitulo-header"></div>
            </div>
        </div>
        <img id="icon-voltar-top" src="" alt="Voltar" onclick="voltarPagina()">
    </header>

    <main>
        <!-- ECRÃ 1: APRESENTAÇÃO -->
        <div id="view-apresentacao" class="view-container view-active">
            <div class="card-topo"><h2 id="jogo-titulo" style="color: var(--cor-dinamica); text-transform: uppercase; font-weight: 900;"></h2></div>
            <div class="card-meio" id="area-jogo-conteudo"></div>
            <div class="card-fundo">
                <div class="btn-info" onclick="toggleInfoScreen(true)" style="width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--cor-dinamica); color: var(--cor-dinamica); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; background: white; cursor: pointer; font-family: 'Georgia', serif; font-style: italic; font-weight: bold;"><i>i</i></div>
                <button class="btn-jogar" onclick="mudarEcra('jogo')"><i class="fas fa-play"></i> JOGAR</button>
            </div>
        </div>

        <!-- ECRÃ 2: O JOGO (PAINEL DE CONTROLO ATUALIZADO) -->
        <div id="view-jogo" class="view-container">
            <div class="card-topo">
                <div class="game-status-bar">
                    <!-- Ajuda (Lâmpada) -->
                    <div class="btn-ajuda" onclick="if(typeof pedirAjuda === 'function') pedirAjuda()">
                        <i class="fas fa-lightbulb"></i>
                    </div>

                    <!-- Info Central (Rondas e Placar) -->
                    <div class="status-group">
                        <div class="status-item">
                            RONDA <span id="ronda-atual">1</span>/10
                        </div>
                        <div class="status-item">
                            <i class="fas fa-check-circle" style="color: #45cfa8;"></i>
                            <span id="cont-certos" class="count-box bg-certos">0</span>
                        </div>
                        <div class="status-item">
                            <i class="fas fa-times-circle" style="color: #ff6b6b;"></i>
                            <span id="cont-errados" class="count-box bg-errados">0</span>
                        </div>
                    </div>

                    <!-- Botão Info Mini -->
                    <div class="btn-info-mini" onclick="toggleInfoScreen(true)">i</div>
                </div>
            </div>

            <!-- Espaço total para o jogo -->
            <div class="card-meio">
                <div id="game-injection-point" style="width:100%; height:100%;"></div>
            </div>
            
            <!-- card-fundo removido aqui para o jogo ocupar o espaço todo -->
        </div>

        <!-- ECRÃ 3: RESULTADOS -->
        <div id="view-resultados" class="view-container">
            <div class="card-topo"><h2 style="color: var(--cor-dinamica); font-weight: 900;">RESULTADOS</h2></div>
            <div class="card-meio">
                <div style="text-align:center">
                    <img id="res-img" src="" style="width: 150px; height: 150px; object-fit: contain; margin-bottom: 15px;">
                    <div id="res-titulo" style="font-weight: 900; font-size: 1.8rem; color: var(--cor-dinamica); margin-bottom: 10px;"></div>
                    <p>Desafio concluído!</p>
                </div>
            </div>
            <div class="card-fundo"><button class="btn-jogar" onclick="mudarEcra('apresentacao')">RECOMEÇAR</button></div>
        </div>
    </main>

    <footer><span class="footer-text" id="txt-rodape"></span></footer>

    <!-- OVERLAY INFO -->
    <div id="info-screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="font-weight: 900; color: var(--cor-dinamica); font-size: 1.8rem;">Instruções</h2>
            <i class="fas fa-times" style="font-size:2rem;cursor:pointer" onclick="toggleInfoScreen(false)"></i>
        </div>
        <div class="info-content" id="info-texto"></div>
    </div>

    <script src="dados.js"></script>
    <script src="jogo.js"></script>

    <script>
        let pontuacaoFinal = 0;

        function mudarEcra(id) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('view-active'));
            document.getElementById('view-' + id).classList.add('view-active');
            
            // Gerir visibilidade do rodapé
            if(id === 'jogo') { 
                document.querySelector('footer').style.display = 'none'; 
                if(typeof initJogo === "function") initJogo(); 
            } else { 
                document.querySelector('footer').style.display = 'flex'; 
            }

            if(id === 'resultados') {
                const rel = JOGO_CONFIG.relatorios.find(r => pontuacaoFinal >= r.min && pontuacaoFinal <= r.max);
                if(rel) { 
                    document.getElementById('res-titulo').innerText = rel.titulo; 
                    document.getElementById('res-img').src = JOGO_CONFIG.caminhoIconsMenu + rel.img; 
                }
            }
        }

        function voltarPagina() { window.history.back(); }
        function toggleMenu(e) { if(e) e.stopPropagation(); const m = document.getElementById('dropdownMenu'); m.style.display = (m.style.display==='flex')?'none':'flex'; }
        function toggleInfoScreen(s) { document.getElementById('info-screen').style.display = s?'flex':'none'; }
        window.onclick = () => document.getElementById('dropdownMenu').style.display = 'none';

        window.onload = () => {
            const config = JOGO_CONFIG;
            const tema = BIBLIOTECA_TEMAS[config.areaAtiva];
            const conteudo = BIBLIOTECA_CONTEUDO[config.anoAtivo][config.areaAtiva];
            const pathIcons = config.caminhoIconsMenu;

            document.documentElement.style.setProperty('--cor-dinamica', tema.corPrimaria);
            document.body.style.backgroundColor = tema.corPagina;

            document.getElementById('txt-titulo1').innerText = conteudo.t1;
            document.getElementById('txt-titulo2').innerText = conteudo.t2;
            document.getElementById('txt-subtitulo-header').innerText = conteudo.sub;
            document.getElementById('txt-rodape').innerHTML = conteudo.rodape;
            document.getElementById('icon-voltar-top').src = pathIcons + tema.voltarMobile;

            const dadosAno = config.menuItens.find(item => item.id === config.anoAtivo);
            if(dadosAno) document.getElementById('header-icon').src = pathIcons + dadosAno.icon;

            const menuBox = document.getElementById('dropdownMenu');
            config.menuItens.forEach(item => {
                const a = document.createElement('a');
                a.className = 'menu-item'; a.href = item.link;
                const icon = (item.icon === "AUTO") ? tema.voltarMobile : item.icon;
                a.innerHTML = `<img src="${pathIcons}${icon}" style="height:28px; width:28px; object-fit:contain;"> <span style="margin-left:12px; font-weight:800; color:#7b899b; text-transform:uppercase; font-size:0.85rem;">${item.label}</span>`;
                menuBox.appendChild(a);
            });

            document.getElementById('jogo-titulo').innerText = config.nomeDoJogo;
            if(DADOS_JOGO.itens && DADOS_JOGO.itens.length > 0) {
                document.getElementById('area-jogo-conteudo').innerHTML = `<img src="${DADOS_JOGO.caminhoImagens}${DADOS_JOGO.itens[0].img}" style="max-width: 80%; max-height: 80%; object-fit: contain;">`;
            }
        };
    </script>
</body>
</html>

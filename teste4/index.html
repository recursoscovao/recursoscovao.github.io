<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Educativa</title>

    <!-- Fonte Fredoka para o aspeto arredondado e amigável -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           1. VARIÁVEIS E BASE
           ========================================== */
        :root {
            --cor-pagina: #f0f0f0;
            --cor-primaria: #333;
            --cor-escura: #000;
            --cor-texto: #5d7082;
            --text-grey: #8792a1; /* Variável para o cinza dos títulos */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Fredoka', sans-serif;
            background-color: var(--cor-pagina);
            color: var(--cor-texto);
            overflow-x: hidden;
        }

        /* ==========================================
           2. HEADER (ESTRUTURA SOLICITADA)
           ========================================== */
        header {
            height: 85px;
            background-color: white;
            display: flex;
            align-items: center;
            padding: 0 20px; 
            border-bottom-left-radius: 35px; 
            border-bottom-right-radius: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            z-index: 100;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Lado Esquerdo: Hambúrguer */
        .btn-menu {
            background: none;
            border: none;
            cursor: pointer;
            width: 45px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .btn-menu div { width: 28px; height: 4px; background-color: var(--cor-primaria); border-radius: 10px; }

        /* CENTRO: Configuração exata que enviaste */
        .header-center { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
        }

        #header-icon { 
            height: 70px; 
            object-fit: contain; 
        }

        .title-group { 
            display: flex; 
            flex-direction: column; 
            line-height: 0.85; 
            text-transform: uppercase; 
        }

        #txt-titulo1 { 
            font-weight: 900; 
            font-size: 1.65rem; 
            color: var(--cor-primaria); /* Dinâmico */
        }

        #txt-titulo2 { 
            font-weight: 800; 
            font-size: 1.4rem; 
            color: #8792a1; /* Cinza fixo conforme solicitado */
        }

        #txt-subtitulo-header { 
            color: var(--text-grey); 
            font-weight: 600; 
            font-size: 0.65rem; 
            margin-top: 4px; 
            opacity: 0.9; 
        }

        /* Lado Direito: Seta Voltar */
        .btn-voltar-topo {
            width: 45px;
            display: flex;
            justify-content: flex-end;
            text-decoration: none;
        }
        .btn-voltar-topo img { height: 45px; }

        /* ==========================================
           3. MENU LATERAL (DRAWER)
           ========================================== */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 150; }
        .side-menu { 
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%; 
            background: white; z-index: 200; transition: 0.3s ease; padding: 25px; 
        }
        .side-menu.active { left: 0; }
        .menu-links-list { list-style: none; margin-top: 20px; }
        .menu-links-list a { 
            display: flex; align-items: center; gap: 15px; text-decoration: none; 
            color: var(--cor-texto); font-weight: 600; margin-bottom: 15px;
        }
        .menu-links-list img { width: 35px; }

        /* ==========================================
           4. MAIN (CENTRO)
           ========================================== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card-jogo {
            background: white;
            padding: 40px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            max-width: 500px; width: 100%;
        }

        .btn-jogar {
            background-color: var(--cor-primaria);
            color: white; border: none; padding: 20px 60px; font-size: 1.6rem; 
            font-weight: 700; border-radius: 50px; cursor: pointer; text-decoration: none;
            display: inline-block; margin-top: 20px;
        }

        /* ==========================================
           5. FOOTER (40px)
           ========================================== */
        footer {
            height: 40px;
            background-color: var(--cor-escura);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            #txt-titulo1 { font-size: 1.3rem; }
            #txt-titulo2 { font-size: 1.1rem; }
            #header-icon { height: 50px; }
        }
    </style>
</head>
<body>

    <div id="overlay" class="overlay"></div>

    <nav id="side-menu" class="side-menu">
        <h2 style="color: var(--cor-primaria); margin-bottom: 20px;">Menu</h2>
        <ul id="ui-lista-menu" class="menu-links-list"></ul>
    </nav>

    <header>
        <div class="header-flex">
            <button class="btn-menu" id="btn-abrir-menu">
                <div></div><div></div><div></div>
            </button>

            <!-- CONTAINER CENTRALIZADO CONFORME PEDIDO -->
            <div class="header-center">
                <img id="header-icon" src="" alt="Logo">
                <div class="title-group">
                    <span id="txt-titulo1"></span>
                    <span id="txt-titulo2"></span>
                    <span id="txt-subtitulo-header"></span>
                </div>
            </div>

            <a href="javascript:history.back()" class="btn-voltar-topo">
                <img id="ui-seta-voltar" src="" alt="Voltar">
            </a>
        </div>
    </header>

    <main>
        <section class="card-jogo">
            <h3 id="ui-nome-jogo" style="font-size: 2rem; color: var(--cor-primaria); margin-bottom: 10px;"></h3>
            <p id="ui-descricao"></p>
            <a href="jogo.html" class="btn-jogar">JOGAR</a>
        </section>
    </main>

    <footer>
        <div id="ui-rodape"></div>
    </footer>

    <script src="dados.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const area = JOGO_CONFIG.areaAtiva;
            const ano = JOGO_CONFIG.anoAtivo;
            const tema = BIBLIOTECA_TEMAS[area];
            const conteudo = BIBLIOTECA_CONTEUDO[ano][area];

            // Aplicação de Cores
            const root = document.documentElement;
            root.style.setProperty('--cor-pagina', tema.corPagina);
            root.style.setProperty('--cor-primaria', tema.corPrimaria);
            root.style.setProperty('--cor-escura', tema.corEscura);
            root.style.setProperty('--cor-texto', tema.corTexto);

            // Preenchimento dos Títulos com os novos IDs
            document.getElementById("txt-titulo1").innerText = conteudo.t1;
            document.getElementById("txt-titulo2").innerText = conteudo.t2;
            document.getElementById("txt-subtitulo-header").innerText = conteudo.sub;
            document.getElementById("ui-rodape").innerHTML = conteudo.rodape;
            
            // Seta e Ícone Central
            document.getElementById("ui-seta-voltar").src = JOGO_CONFIG.caminhoIconsMenu + tema.voltarMobile;
            
            const itemAno = JOGO_CONFIG.menuItens.find(item => item.id === ano);
            if (itemAno) {
                document.getElementById("header-icon").src = JOGO_CONFIG.caminhoIconsMenu + itemAno.icon;
            }

            // Infos do Jogo
            document.getElementById("ui-nome-jogo").innerText = JOGO_CONFIG.nomeDoJogo;
            document.getElementById("ui-descricao").innerText = JOGO_CONFIG.descricao;

            // Menu Lateral
            const listaMenu = document.getElementById("ui-lista-menu");
            JOGO_CONFIG.menuItens.forEach(item => {
                if(item.id === "voltar") return;
                const li = document.createElement("li");
                const imgFinal = (item.icon === "AUTO") ? tema.voltarMobile : item.icon;
                li.innerHTML = `<a href="${item.link}"><img src="${JOGO_CONFIG.caminhoIconsMenu}${imgFinal}"><span>${item.label}</span></a>`;
                listaMenu.appendChild(li);
            });

            // Lógica de abertura do menu
            const btnAbrir = document.getElementById("btn-abrir-menu");
            const sideMenu = document.getElementById("side-menu");
            const overlay = document.getElementById("overlay");
            const toggle = () => {
                sideMenu.classList.toggle("active");
                overlay.style.display = sideMenu.classList.contains("active") ? "block" : "none";
            };
            btnAbrir.addEventListener("click", toggle);
            overlay.addEventListener("click", toggle);
        });
    </script>
</body>
</html>

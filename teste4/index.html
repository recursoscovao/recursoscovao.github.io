<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Educativa</title>

    <style>
        :root {
            --cor-pagina: #f0f0f0;
            --cor-primaria: #333;
            --cor-escura: #000;
            --cor-texto: #555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cor-pagina); /* O fundo da página aparece atrás das curvas */
            color: var(--cor-texto);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 25px;
        }

        /* ==========================================
           HEADER ATUALIZADO (FORMA BRANCA)
           ========================================== */
        header {
            height: 85px;
            background-color: white; /* Fundo branco solicitado */
            display: flex;
            align-items: center;
            z-index: 10;
            /* Arredondado nos cantos de baixo */
            border-bottom-left-radius: 40px; 
            border-bottom-right-radius: 40px;
            /* Sombra suave para dar profundidade sobre o fundo colorido */
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Ajuste das cores dos textos para ler bem no fundo branco */
        .titulos h1 { 
            font-size: 1.4rem; 
            line-height: 1.1; 
            text-transform: uppercase; 
            color: var(--cor-primaria); /* Cor do tema no título */
        }
        
        .titulos h2 { 
            font-size: 0.95rem; 
            font-weight: normal; 
            color: var(--cor-texto); 
        }

        .subtitulo-texto { 
            font-weight: 800; 
            font-size: 0.85rem; 
            text-align: right;
            color: var(--cor-primaria);
            background: var(--cor-pagina); /* Um pequeno destaque atrás do subtítulo */
            padding: 8px 15px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        /* ==========================================
           CORPO E MENU
           ========================================== */
        main {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-jogo {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            margin-bottom: 30px;
        }

        .card-jogo h3 { font-size: 2.2rem; color: var(--cor-primaria); margin-bottom: 10px; }
        .card-jogo p { font-size: 1.1rem; margin-bottom: 25px; }

        .btn-jogar {
            background-color: var(--cor-primaria);
            color: white;
            border: none;
            padding: 18px 60px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-jogar:hover { transform: scale(1.05); background-color: var(--cor-escura); }

        .menu-icones {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .item-menu {
            text-decoration: none;
            color: inherit;
            text-align: center;
            width: 80px;
            transition: 0.2s;
        }

        .item-menu img { width: 55px; height: 55px; object-fit: contain; margin-bottom: 5px; }
        .item-menu span { font-size: 0.7rem; font-weight: bold; display: block; }
        .item-menu:hover { transform: translateY(-5px); }

        /* FOOTER */
        footer {
            height: 40px;
            background-color: var(--cor-escura);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .subtitulo-texto { display: none; }
            header { height: 75px; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-flex">
            <div class="titulos">
                <h1 id="ui-t1"></h1>
                <h2 id="ui-t2"></h2>
            </div>
            <div id="ui-sub" class="subtitulo-texto"></div>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="card-jogo">
                <h3 id="ui-nome-jogo"></h3>
                <p id="ui-descricao"></p>
                <a href="jogo.html" class="btn-jogar">JOGAR</a>
            </section>

            <nav id="ui-menu" class="menu-icones"></nav>
        </div>
    </main>

    <footer>
        <div id="ui-rodape"></div>
    </footer>

    <!-- DADOS.JS -->
    <script src="dados.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const area = JOGO_CONFIG.areaAtiva;
            const ano = JOGO_CONFIG.anoAtivo;
            const tema = BIBLIOTECA_TEMAS[area];
            const conteudo = BIBLIOTECA_CONTEUDO[ano][area];

            const root = document.documentElement;
            root.style.setProperty('--cor-pagina', tema.corPagina);
            root.style.setProperty('--cor-primaria', tema.corPrimaria);
            root.style.setProperty('--cor-escura', tema.corEscura);
            root.style.setProperty('--cor-texto', tema.corTexto);

            document.getElementById("ui-t1").innerText = conteudo.t1;
            document.getElementById("ui-t2").innerText = conteudo.t2;
            document.getElementById("ui-sub").innerText = conteudo.sub;
            document.getElementById("ui-rodape").innerHTML = conteudo.rodape;
            document.getElementById("ui-nome-jogo").innerText = JOGO_CONFIG.nomeDoJogo;
            document.getElementById("ui-descricao").innerText = JOGO_CONFIG.descricao;

            const menuContainer = document.getElementById("ui-menu");
            JOGO_CONFIG.menuItens.forEach(item => {
                const link = document.createElement("a");
                link.href = item.link;
                link.className = "item-menu";
                let imgFinal = (item.icon === "AUTO") ? tema.voltarMobile : item.icon;

                link.innerHTML = `
                    <img src="${JOGO_CONFIG.caminhoIconsMenu}${imgFinal}" alt="${item.label}">
                    <span>${item.label}</span>
                `;
                menuContainer.appendChild(link);
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="aba-titulo">A carregar...</title>
    
    <style>
        /* CSS RESET E ESTRUTURA BASE */
        :root {
            --cor-primaria: #5ba4e5;
            --cor-pagina: #e9f0f8;
            --cor-texto: #5d7082;
            --cor-escura: #3d7db8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cor-pagina);
            color: var(--cor-texto);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Evita scroll no body */
        }

        /* MENU HAMBURGUER */
        #menu-container {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
        }

        #btn-hamburger {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .bar { width: 25px; height: 3px; background-color: white; border-radius: 2px; }

        #lista-menu {
            position: absolute;
            top: 55px;
            right: 0;
            background: white;
            list-style: none;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: none; /* Escondido por defeito */
            min-width: 180px;
        }

        #lista-menu.ativo { display: block; }

        #lista-menu li { border-bottom: 1px solid #eee; }
        #lista-menu li:last-child { border: none; }

        #lista-menu a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            text-decoration: none;
            color: var(--cor-texto);
            font-weight: 600;
            font-size: 14px;
        }

        /* CABEÇALHO */
        header {
            text-align: center;
            padding: 20px 10px;
            flex-shrink: 0; /* Não encolhe */
        }

        header h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); color: var(--cor-primaria); text-transform: uppercase; }
        header h1 strong { color: var(--cor-escura); }
        header p { font-size: 0.9rem; letter-spacing: 1px; opacity: 0.8; }

        /* ÁREA DO JOGO (CONTEÚDO PRINCIPAL) */
        main {
            flex-grow: 1; /* Ocupa o espaço restante */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-y: auto; /* Só aparece scroll aqui se o jogo for grande */
            width: 100%;
        }

        #nome-jogo-titulo {
            margin-bottom: 15px;
            color: var(--cor-escura);
            font-size: clamp(1.1rem, 4vw, 1.6rem);
            text-align: center;
        }

        #game-area {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            min-height: 300px; /* Altura mínima para o jogo */
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed var(--cor-primaria);
        }

        /* RODAPÉ */
        footer {
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        /* RESPONSIVIDADE PARA MOBILE */
        @media (max-width: 600px) {
            header { padding: 15px 5px; }
            #btn-hamburger { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <!-- Menu -->
    <nav id="menu-container">
        <div id="btn-hamburger" onclick="toggleMenu()">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <ul id="lista-menu">
            <!-- Gerado via dados.js -->
        </ul>
    </nav>

    <!-- Topo -->
    <header>
        <h1 id="site-t1">---</h1>
        <p id="site-sub">---</p>
    </header>

    <!-- Jogo -->
    <main>
        <h2 id="nome-jogo-titulo">---</h2>
        <div id="game-area">
            <!-- O conteúdo do jogo (cartas, perguntas, etc) entra aqui -->
            <p id="carregando">A carregar jogo...</p>
        </div>
    </main>

    <!-- Rodapé -->
    <footer id="site-rodape"></footer>

    <!-- Scripts -->
    <script src="dados.js"></script>
    <script src="jogos.js"></script>

    <script>
        // Lógica simples para abrir/fechar menu
        function toggleMenu() {
            document.getElementById('lista-menu').classList.toggle('ativo');
        }
        
        // Fechar menu ao clicar fora
        window.onclick = function(event) {
            if (!event.target.closest('#menu-container')) {
                document.getElementById('lista-menu').classList.remove('ativo');
            }
        }
    </script>
</body>
</html>

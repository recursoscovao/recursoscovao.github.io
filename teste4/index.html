<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Educativa</title>

    <!-- Fonte Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           1. VARIÁVEIS E BASE
           ========================================== */
        :root {
            --cor-pagina: #f0f0f0;
            --cor-primaria: #333;
            --cor-escura: #000;
            --cor-texto: #5d7082;
            --text-grey: #8792a1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Fredoka', sans-serif;
            background-color: var(--cor-pagina);
            color: var(--cor-texto);
            overflow-x: hidden;
        }

        /* ==========================================
           2. HEADER
           ========================================== */
        header {
            height: 85px;
            background-color: white;
            display: flex;
            align-items: center;
            padding: 0 20px; 
            border-bottom-left-radius: 35px; 
            border-bottom-right-radius: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            z-index: 1000; /* Garante que o header fique por cima do menu ao descer */
            position: relative;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Hambúrguer */
        .btn-menu {
            background: none;
            border: none;
            cursor: pointer;
            width: 45px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 1100;
        }
        .btn-menu div { width: 28px; height: 4px; background-color: var(--cor-primaria); border-radius: 10px; transition: 0.3s; }

        /* Centro */
        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 70px; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; line-height: 0.85; text-transform: uppercase; }
        #txt-titulo1 { font-weight: 900; font-size: 1.65rem; color: var(--cor-primaria); }
        #txt-titulo2 { font-weight: 800; font-size: 1.4rem; color: var(--text-grey); }
        #txt-subtitulo-header { color: var(--text-grey); font-weight: 600; font-size: 0.65rem; margin-top: 4px; opacity: 0.9; }

        /* Direita */
        .btn-voltar-topo { width: 45px; display: flex; justify-content: flex-end; text-decoration: none; }
        .btn-voltar-topo img { height: 45px; }

        /* ==========================================
           3. MENU DROPDOWN (DESCE DO TOPO)
           ========================================== */
        .menu-dropdown {
            position: fixed;
            top: -100%; /* Escondido acima */
            left: 0;
            width: 100%;
            background-color: white;
            padding: 100px 20px 30px 20px; /* Padding top maior para compensar o header */
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 900;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-dropdown.active {
            top: 0; /* Desce até ao topo da página */
        }

        /* Estilo dos Botões do Menu */
        .menu-btn-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 25px;
            background-color: #f8f9fa;
            text-decoration: none;
            color: var(--cor-texto);
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: 0.3s;
            border: 2px solid transparent;
        }

        /* Hover com a cor do Titulo 1 */
        .menu-btn-item:hover {
            background-color: var(--cor-primaria);
            color: white;
            transform: translateY(-2px);
        }

        .menu-btn-item img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            display: none;
            z-index: 800;
            backdrop-filter: blur(2px);
        }

        /* ==========================================
           4. MAIN E FOOTER
           ========================================== */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card-jogo {
            background: white;
            padding: 40px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            max-width: 500px; width: 100%;
        }

        .btn-jogar {
            background-color: var(--cor-primaria);
            color: white; border: none; padding: 20px 60px; font-size: 1.6rem; 
            font-weight: 700; border-radius: 50px; cursor: pointer; text-decoration: none;
            display: inline-block; margin-top: 20px;
        }

        footer {
            height: 40px; background-color: var(--cor-escura); color: white;
            display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
        }

        /* Animação do ícone hamburguer para "X" (opcional, mas fica bem) */
        .btn-menu.open div:nth-child(1) { transform: translateY(9px) rotate(45deg); }
        .btn-menu.open div:nth-child(2) { opacity: 0; }
        .btn-menu.open div:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }
    </style>
</head>
<body>

    <div id="overlay" class="overlay"></div>

    <!-- MENU DROPDOWN (QUE DESCE) -->
    <nav id="menu-dropdown" class="menu-dropdown">
        <!-- Itens injetados via JS -->
    </nav>

    <header>
        <div class="header-flex">
            <button class="btn-menu" id="btn-abrir-menu">
                <div></div><div></div><div></div>
            </button>

            <div class="header-center">
                <img id="header-icon" src="" alt="Logo">
                <div class="title-group">
                    <span id="txt-titulo1"></span>
                    <span id="txt-titulo2"></span>
                    <span id="txt-subtitulo-header"></span>
                </div>
            </div>

            <a href="javascript:history.back()" class="btn-voltar-topo">
                <img id="ui-seta-voltar" src="" alt="Voltar">
            </a>
        </div>
    </header>

    <main>
        <section class="card-jogo">
            <h1 id="ui-nome-jogo" style="font-size: 2.2rem; color: var(--cor-primaria); margin-bottom: 15px;"></h1>
            <p id="ui-descricao" style="font-size: 1.2rem; line-height: 1.4; color: #7a8b9a;"></p>
            <a href="jogo.html" class="btn-jogar">JOGAR</a>
        </section>
    </main>

    <footer>
        <div id="ui-rodape"></div>
    </footer>

    <script src="dados.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const area = JOGO_CONFIG.areaAtiva;
            const ano = JOGO_CONFIG.anoAtivo;
            const tema = BIBLIOTECA_TEMAS[area];
            const conteudo = BIBLIOTECA_CONTEUDO[ano][area];

            // 1. Cores Dinâmicas
            const root = document.documentElement;
            root.style.setProperty('--cor-pagina', tema.corPagina);
            root.style.setProperty('--cor-primaria', tema.corPrimaria);
            root.style.setProperty('--cor-escura', tema.corEscura);
            root.style.setProperty('--cor-texto', tema.corTexto);

            // 2. Preencher Header
            document.getElementById("txt-titulo1").innerText = conteudo.t1;
            document.getElementById("txt-titulo2").innerText = conteudo.t2;
            document.getElementById("txt-subtitulo-header").innerText = conteudo.sub;
            document.getElementById("ui-seta-voltar").src = JOGO_CONFIG.caminhoIconsMenu + tema.voltarMobile;
            
            const itemAno = JOGO_CONFIG.menuItens.find(item => item.id === ano);
            if (itemAno) {
                document.getElementById("header-icon").src = JOGO_CONFIG.caminhoIconsMenu + itemAno.icon;
            }

            // 3. Preencher Main e Footer
            document.getElementById("ui-nome-jogo").innerText = JOGO_CONFIG.nomeDoJogo;
            document.getElementById("ui-descricao").innerText = JOGO_CONFIG.descricao;
            document.getElementById("ui-rodape").innerHTML = conteudo.rodape;

            // 4. Gerar Menu Dropdown (Botões)
            const menuDropdown = document.getElementById("menu-dropdown");
            JOGO_CONFIG.menuItens.forEach(item => {
                if(item.id === "voltar") return;

                const link = document.createElement("a");
                link.href = item.link;
                link.className = "menu-btn-item";
                
                const imgFinal = (item.icon === "AUTO") ? tema.voltarMobile : item.icon;
                
                link.innerHTML = `
                    <img src="${JOGO_CONFIG.caminhoIconsMenu}${imgFinal}" alt="${item.label}">
                    <span>${item.label}</span>
                `;
                menuDropdown.appendChild(link);
            });

            // 5. Lógica de Abrir/Fechar Dropdown
            const btnMenu = document.getElementById("btn-abrir-menu");
            const dropdown = document.getElementById("menu-dropdown");
            const overlay = document.getElementById("overlay");

            const toggleMenu = () => {
                const isOpen = dropdown.classList.toggle("active");
                btnMenu.classList.toggle("open");
                overlay.style.display = isOpen ? "block" : "none";
            };

            btnMenu.addEventListener("click", toggleMenu);
            overlay.addEventListener("click", toggleMenu);
        });
    </script>
</body>
</html>

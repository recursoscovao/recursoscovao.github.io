<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Educativa</title>

    <!-- Importação da Fonte Fredoka (Arredondada e Bold - Igual à imagem) -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           1. VARIÁVEIS E BASE
           ========================================== */
        :root {
            --cor-pagina: #f0f0f0;
            --cor-primaria: #333;
            --cor-escura: #000;
            --cor-texto: #5d7082;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* Aplicar a fonte Fredoka globalmente */
            font-family: 'Fredoka', sans-serif;
            background-color: var(--cor-pagina);
            color: var(--cor-texto);
            overflow-x: hidden;
        }

        /* ==========================================
           2. HEADER (85px, BRANCO, ARREDONDADO)
           ========================================== */
        header {
            height: 85px;
            background-color: white;
            display: flex;
            align-items: center;
            padding: 0 20px; 
            border-bottom-left-radius: 35px; 
            border-bottom-right-radius: 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            z-index: 100;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Hambúrguer Esquerda */
        .btn-menu {
            background: none;
            border: none;
            cursor: pointer;
            width: 45px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .btn-menu div { width: 30px; height: 5px; background-color: var(--cor-primaria); border-radius: 10px; }

        /* CENTRO: Logótipo Ajustado */
        .centro-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .centro-header img {
            height: 60px; 
            width: auto;
            object-fit: contain;
        }

        .titulos-grupo {
            display: flex;
            flex-direction: column;
            line-height: 0.85; /* Aproximação das linhas conforme a imagem */
        }

        .titulos-grupo h1 { 
            font-size: 1.6rem; 
            font-weight: 700; /* Extra Bold */
            text-transform: uppercase; 
            color: var(--cor-primaria); /* Cor dinâmica */
            letter-spacing: -0.5px;
        }

        .titulos-grupo h2 { 
            font-size: 1.4rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            color: #8c9ba9; /* Cinza específico da imagem */
            letter-spacing: -0.5px;
        }

        .titulos-grupo .sub-titulo { 
            font-size: 0.86rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            color: #AAB0B7; /* Azul/Cinza claro fixo */
            margin-top: 6px;
            letter-spacing: 0.2px;
            line-height: 1;
        }

        /* Seta Voltar Direita */
        .btn-voltar-topo {
            width: 45px;
            display: flex;
            justify-content: flex-end;
            text-decoration: none;
        }
        .btn-voltar-topo img { height: 48px; width: auto; }

        /* ==========================================
           3. MENU LATERAL
           ========================================== */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 150; }
        .side-menu { 
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%; 
            background: white; z-index: 200; transition: 0.3s ease; padding: 25px; 
        }
        .side-menu.active { left: 0; }
        .menu-links-list { list-style: none; margin-top: 30px; }
        .menu-links-list a { 
            display: flex; align-items: center; gap: 15px; 
            text-decoration: none; color: #5d7082; font-weight: 600; 
            margin-bottom: 15px; font-size: 1.1rem; padding: 10px; border-radius: 15px;
        }
        .menu-links-list a:hover { background: var(--cor-pagina); }
        .menu-links-list img { width: 35px; }

        /* ==========================================
           4. CORPO (SCROLL LIVRE)
           ========================================== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card-jogo {
            background: white;
            padding: 45px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.04);
            max-width: 550px; 
            width: 100%;
        }

        .card-jogo h3 { 
            font-size: 2.2rem; 
            color: var(--cor-primaria); 
            margin-bottom: 15px; 
            font-weight: 700;
        }

        .btn-jogar {
            background-color: var(--cor-primaria);
            color: white; border: none; padding: 22px 70px; font-size: 1.8rem; 
            font-weight: 700; border-radius: 50px; cursor: pointer; text-decoration: none;
            display: inline-block; margin-top: 20px; transition: 0.2s;
        }
        .btn-jogar:hover { transform: scale(1.05); }

        /* ==========================================
           5. FOOTER (40px)
           ========================================== */
        footer {
            height: 40px;
            background-color: var(--cor-escura);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 400;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 600px) {
            .titulos-grupo h1, .titulos-grupo h2 { font-size: 1.3rem; }
            .titulos-grupo .sub-titulo { font-size: 0.7rem; }
            .centro-header img { height: 45px; }
            header { height: 80px; padding: 0 15px; }
        }
    </style>
</head>
<body>

    <div id="overlay" class="overlay"></div>

    <nav id="side-menu" class="side-menu">
        <h2 style="color: var(--cor-primaria); font-weight: 700; margin-bottom: 20px;">Menu</h2>
        <ul id="ui-lista-menu" class="menu-links-list"></ul>
    </nav>

    <header>
        <div class="header-flex">
            <!-- ESQUERDA -->
            <button class="btn-menu" id="btn-abrir-menu">
                <div></div><div></div><div></div>
            </button>

            <!-- CENTRO (FONTE FREDOKA) -->
            <div class="centro-header">
                <img id="ui-icon-centro" src="" alt="Ano">
                <div class="titulos-grupo">
                    <h1 id="ui-t1"></h1>
                    <h2 id="ui-t2"></h2>
                    <div id="ui-sub" class="sub-titulo"></div>
                </div>
            </div>

            <!-- DIREITA -->
            <a href="javascript:history.back()" class="btn-voltar-topo">
                <img id="ui-seta-voltar" src="" alt="Voltar">
            </a>
        </div>
    </header>

    <main>
        <section class="card-jogo">
            <h3 id="ui-nome-jogo"></h3>
            <p id="ui-descricao" style="font-size: 1.2rem; color: #7a8b9a; line-height: 1.4;"></p>
            <a href="jogo.html" class="btn-jogar">JOGAR</a>
        </section>
        <!-- Conteúdo extra se quiseres testar o scroll -->
        <div style="height: 50px;"></div>
    </main>

    <footer>
        <div id="ui-rodape"></div>
    </footer>

    <script src="dados.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const area = JOGO_CONFIG.areaAtiva;
            const ano = JOGO_CONFIG.anoAtivo;
            const tema = BIBLIOTECA_TEMAS[area];
            const conteudo = BIBLIOTECA_CONTEUDO[ano][area];

            const root = document.documentElement;
            root.style.setProperty('--cor-pagina', tema.corPagina);
            root.style.setProperty('--cor-primaria', tema.corPrimaria);
            root.style.setProperty('--cor-escura', tema.corEscura);
            root.style.setProperty('--cor-texto', tema.corTexto);

            document.getElementById("ui-t1").innerText = conteudo.t1;
            document.getElementById("ui-t2").innerText = conteudo.t2;
            document.getElementById("ui-sub").innerText = conteudo.sub;
            document.getElementById("ui-rodape").innerHTML = conteudo.rodape;
            document.getElementById("ui-seta-voltar").src = JOGO_CONFIG.caminhoIconsMenu + tema.voltarMobile;

            const itemAno = JOGO_CONFIG.menuItens.find(item => item.id === ano);
            if (itemAno) {
                document.getElementById("ui-icon-centro").src = JOGO_CONFIG.caminhoIconsMenu + itemAno.icon;
            }

            document.getElementById("ui-nome-jogo").innerText = JOGO_CONFIG.nomeDoJogo;
            document.getElementById("ui-descricao").innerText = JOGO_CONFIG.descricao;

            const listaMenu = document.getElementById("ui-lista-menu");
            JOGO_CONFIG.menuItens.forEach(item => {
                if(item.id === "voltar") return;
                const li = document.createElement("li");
                const imgFinal = (item.icon === "AUTO") ? tema.voltarMobile : item.icon;
                li.innerHTML = `<a href="${item.link}"><img src="${JOGO_CONFIG.caminhoIconsMenu}${imgFinal}"><span>${item.label}</span></a>`;
                listaMenu.appendChild(li);
            });

            const btnAbrir = document.getElementById("btn-abrir-menu");
            const sideMenu = document.getElementById("side-menu");
            const overlay = document.getElementById("overlay");
            const toggle = () => {
                sideMenu.classList.toggle("active");
                overlay.style.display = sideMenu.classList.contains("active") ? "block" : "none";
            };
            btnAbrir.addEventListener("click", toggle);
            overlay.addEventListener("click", toggle);
        });
    </script>
</body>
</html>

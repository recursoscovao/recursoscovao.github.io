<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pequenos Exploradores</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary-color: #5EA2E6; 
            --bg-color: #EAF4FE; 
            --text-color: #5d7082; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        body, html { 
            min-height: 100dvh; width: 100vw; background-color: var(--bg-color); 
            display: flex; flex-direction: column; overflow-x: hidden; 
        }

        /* HEADER */
        header { 
            background: white; border-radius: 0 0 35px 35px;
            display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; 
            padding: 0 15px; height: 95px; z-index: 1000; flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 65px; object-fit: contain; }
        
        .title-group { display: flex; flex-direction: column; line-height: 0.85; text-transform: uppercase; }
        #txt-titulo1 { color: var(--primary-color); font-weight: 900; font-size: 1.5rem; }
        #txt-titulo2 { color: #8792a1; font-weight: 800; font-size: 1.3rem; }
        #txt-subtitulo-header { color: #8792a1; font-weight: 600; font-size: 0.65rem; margin-top: 4px; opacity: 0.9; }

        .hamburger-btn { background: none; border: none; color: var(--primary-color); font-size: 28px; cursor: pointer; }
        #icon-voltar-top { height: 45px; width: 45px; object-fit: contain; cursor: pointer; justify-self: end;}

        /* MENU DROPDOWN (AJUSTADO PARA ICONS 40PX) */
        .menu-dropdown { 
            position: absolute; top: 85px; left: 15px; display: none; 
            flex-direction: column; gap: 8px; z-index: 2000; 
        }
        .menu-item { 
            display: flex; align-items: center; gap: 15px; 
            height: 65px; padding: 0 20px; /* Altura aumentada para acomodar icon maior */
            text-decoration: none; color: #5d7082; 
            font-weight: 800; background: white; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12); transition: 0.2s; min-width: 260px;
        }
        .menu-item:hover { background-color: var(--primary-color); color: white; }
        
        /* Ícones do Menu com 40px */
        .menu-item img { 
            width: 40px; 
            height: 40px; 
            object-fit: contain; 
            flex-shrink: 0;
        }

        .menu-item span { font-size: 1.1rem; }

        /* ÁREA PRINCIPAL */
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        #intro-screen { text-align: center; width: 100%; display: flex; justify-content: center; }
        .game-intro-card {
            background: white; padding: 35px 25px; border-radius: 40px;
            border: 4px solid var(--primary-color);
            max-width: 500px; width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        #game-nome { color: var(--primary-color); font-size: 1.8rem; font-weight: 900; margin-bottom: 10px; }
        #game-descricao { color: var(--text-color); font-size: 1.1rem; margin-bottom: 30px; line-height: 1.4; }

        .btn-jogar {
            background: var(--primary-color); color: white;
            padding: 18px 45px; border-radius: 50px;
            text-decoration: none; font-weight: 900; font-size: 1.3rem;
            display: inline-block; cursor: pointer; border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .btn-jogar:hover { transform: scale(1.05); }

        #game-container { display: none; width: 100%; height: 100%; }

        footer { background: white; padding: 15px; text-align: center; border-radius: 35px 35px 0 0; }
        .footer-text { color: #8792a1; font-size: 0.85rem; font-weight: 700; }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="menu-dropdown"></div>
        <div class="header-center">
            <img id="header-icon" src="" alt="Icone">
            <div class="title-group">
                <div id="txt-titulo1"></div>
                <div id="txt-titulo2"></div>
                <div id="txt-subtitulo-header"></div>
            </div>
        </div>
        <img id="icon-voltar-top" src="" alt="Voltar" onclick="location.reload()">
    </header>

    <main>
        <!-- Ecrã Inicial -->
        <div id="intro-screen">
            <div class="game-intro-card">
                <h1 id="game-nome"></h1>
                <p id="game-descricao"></p>
                <button class="btn-jogar" onclick="iniciarJogoTecnico()">COMEÇAR JOGO</button>
            </div>
        </div>

        <!-- Contentor do Jogo (preenchido pelo jogo.js) -->
        <div id="game-container"></div>
    </main>

    <footer><span class="footer-text" id="txt-rodape"></span></footer>

    <script src="dados.js"></script>
    <script>
        function toggleMenu(e) { 
            if(e) e.stopPropagation(); 
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex'; 
        }
        window.onclick = () => document.getElementById('dropdownMenu').style.display = 'none';

        window.onload = () => {
            const area = JOGO_CONFIG.areaAtiva;
            const ano = JOGO_CONFIG.anoAtivo;
            const tema = BIBLIOTECA_TEMAS[area];
            const conteudo = BIBLIOTECA_CONTEUDO[ano][area];

            // Cores
            document.documentElement.style.setProperty('--primary-color', tema.corPrimaria);
            document.documentElement.style.setProperty('--bg-color', tema.corPagina);
            document.documentElement.style.setProperty('--text-color', tema.corTexto);

            // Textos
            document.getElementById('txt-titulo1').innerText = conteudo.t1;
            document.getElementById('txt-titulo2').innerText = conteudo.t2;
            document.getElementById('txt-subtitulo-header').innerText = conteudo.sub;
            document.getElementById('txt-rodape').innerHTML = conteudo.rodape;
            
            // Ícone Header
            const itemAtivo = JOGO_CONFIG.menuItens.find(i => i.id === ano);
            if(itemAtivo) document.getElementById('header-icon').src = JOGO_CONFIG.caminhoIconsMenu + itemAtivo.icon;
            
            // Ícone Voltar Topo
            document.getElementById('icon-voltar-top').src = JOGO_CONFIG.caminhoIconsMenu + tema.voltarMobile;

            // Info Jogo
            document.getElementById('game-nome').innerText = JOGO_CONFIG.nomeDoJogo;
            document.getElementById('game-descricao').innerText = JOGO_CONFIG.descricao;

            // Construir Menu Hamburguer
            const menuBox = document.getElementById('dropdownMenu');
            JOGO_CONFIG.menuItens.forEach(item => {
                const a = document.createElement('a');
                a.className = 'menu-item';
                a.href = item.link;
                
                let iconPath = JOGO_CONFIG.caminhoIconsMenu + item.icon;
                if(item.icon === "AUTO") iconPath = JOGO_CONFIG.caminhoIconsMenu + tema.voltarMobile;

                a.innerHTML = `<img src="${iconPath}"> <span>${item.label}</span>`;
                menuBox.appendChild(a);
            });
        };

        function iniciarJogoTecnico() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            if(typeof inicializarLogicaJogo === "function") {
                inicializarLogicaJogo();
            }
        }
    </script>
    <script src="jogo.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pequenos Exploradores</title>
    
    <!-- Fonte Moderna e Arredondada -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #2563EB;
            --primary-green: #16A34A;
            --primary-orange: #EA8C00;
            --text-dark: #183153;
            --bg-sky: #F0F9FF;
            --radius-lg: 30px;
            --radius-md: 20px;
            --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100vh; width: 100vw;
            overflow: hidden; /* Zero Scroll */
            background-color: var(--bg-sky);
            color: var(--text-dark);
            display: flex; flex-direction: column;
        }

        /* ----- CENÁRIO DE FUNDO (SVG E CSS) ----- */
        .scenery { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
        .cloud { position: absolute; background: white; border-radius: 50px; opacity: 0.8; filter: blur(1px); }
        .cloud-1 { top: 15%; left: 5%; width: 120px; height: 40px; }
        .cloud-2 { top: 10%; right: 10%; width: 100px; height: 35px; }
        .star { position: absolute; color: #FFD700; opacity: 0.3; font-size: 10px; }
        
        .grass { 
            position: absolute; bottom: 0; width: 100%; height: 15vh; 
            background: linear-gradient(to top, #DCFCE7 0%, transparent 100%);
            z-index: 2;
        }

        /* ----- CABEÇALHO PREMIUM ----- */
        header { 
            background: white; height: 80px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px; z-index: 1000; box-shadow: 0 2px 15px rgba(0,0,0,0.03); flex-shrink: 0;
        }
        .nav-btn { 
            width: 48px; height: 48px; border-radius: 50%; border: none; background: #F8FAFC;
            color: var(--primary-blue); font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .nav-btn:hover { background: #F1F5F9; transform: scale(1.05); }
        
        .logo-center { display: flex; align-items: center; gap: 12px; }
        #header-icon { height: 55px; width: auto; }
        .logo-text { display: flex; flex-direction: column; line-height: 1; }
        .logo-text .t1 { font-weight: 700; color: var(--primary-blue); font-size: 1.4rem; letter-spacing: -0.5px; }
        .logo-text .t2 { color: #64748B; font-size: 0.75rem; font-weight: 600; margin-top: 4px; }

        /* ----- CONTEÚDO PRINCIPAL ----- */
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; position: relative; padding: 0 20px; }

        .title-section { text-align: center; margin-bottom: 2vh; opacity: 0; animation: fadeIn 0.8s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .intro-title { 
            font-size: clamp(1.2rem, 4vh, 2rem); font-weight: 700; color: var(--text-dark); 
            position: relative; display: inline-block; padding: 0 40px;
        }
        .intro-title::before, .intro-title::after {
            content: "///"; position: absolute; color: #FACC15; font-weight: 900; letter-spacing: 2px; top: 50%; transform: translateY(-50%);
        }
        .intro-title::before { left: 0; } .intro-title::after { right: 0; }

        /* GRELHA DE CARTÕES */
        .game-grid { 
            display: flex; gap: 25px; width: 100%; max-width: 1300px; 
            justify-content: center; align-items: stretch; height: 55vh; 
        }

        /* ESTILO DOS CARTÕES (DESKTOP/TABLET) */
        .card {
            background: white; border-radius: var(--radius-lg); border: 3px solid transparent;
            text-decoration: none; flex: 1; max-width: 380px; display: flex; flex-direction: column;
            padding: 15px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow-soft); cursor: pointer; overflow: hidden;
        }
        .card:hover { transform: translateY(-10px) scale(1.03); box-shadow: 0 20px 30px -10px rgba(0,0,0,0.08); }

        .card-inner { flex: 1; border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; }
        .card-img-wrap { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; }
        .card-img-wrap img { max-width: 90%; max-height: 90%; object-fit: contain; }
        
        .card h2 { font-size: 1.5rem; font-weight: 700; margin: 15px 0; }
        .action-btn { 
            width: 52px; height: 52px; border-radius: 50%; color: white;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            transition: 0.3s;
        }
        .card:hover .action-btn { transform: rotate(360deg); }

        /* ----- RESPONSIVIDADE MOBILE (<768px) ----- */
        @media (max-width: 767px) {
            header { height: 70px; padding: 0 15px; }
            #header-icon { height: 45px; }
            .logo-text .t1 { font-size: 1.1rem; }
            
            main { justify-content: flex-start; padding-top: 2vh; }
            .game-grid { flex-direction: column; height: auto; gap: 15px; padding-bottom: 100px; }
            
            /* Formato Pastilha Horizontal */
            .card { 
                flex-direction: row; height: 90px; width: 100%; border-radius: var(--radius-md);
                padding: 8px; flex: none; align-items: center;
            }
            .card-inner { flex-direction: row; padding: 0; background: transparent !important; }
            .card-img-wrap { width: 75px; height: 75px; border-radius: 15px; background: white; flex: none; margin-right: 15px; }
            .card h2 { font-size: 1.1rem; flex: 1; margin: 0; text-align: left; }
            .action-btn { width: 40px; height: 40px; font-size: 16px; flex-shrink: 0; }
            
            .scenery { display: none; }
        }

        /* ----- FOOTER ----- */
        footer { 
            height: 60px; display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; color: #94A3B8; font-weight: 500; z-index: 100;
        }

        /* ----- MENU DROPDOWN ----- */
        .dropdown {
            position: absolute; top: 85px; left: 30px; background: white;
            border-radius: var(--radius-md); box-shadow: var(--shadow-soft);
            display: none; flex-direction: column; min-width: 240px; padding: 10px; z-index: 2000;
        }
        .menu-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 15px;
            text-decoration: none; color: var(--text-dark); font-weight: 600;
            border-radius: 12px; transition: 0.2s;
        }
        .menu-item:hover { background: #F8FAFC; color: var(--primary-blue); }
        .menu-item img { width: 24px; }
    </style>
</head>
<body>

    <!-- Fundo Ilustrado -->
    <div class="scenery">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <i class="fas fa-star star" style="top:20%; left:15%"></i>
        <i class="fas fa-star star" style="top:10%; right:20%"></i>
        <div class="grass"></div>
    </div>

    <header>
        <button class="nav-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="dropdown"></div>
        
        <div class="logo-center">
            <img id="header-icon" src="" alt="Exploradores">
            <div class="logo-text">
                <span class="t1" id="txt-logo-1"></span>
                <span class="t2" id="txt-logo-2"></span>
            </div>
        </div>
        
        <button class="nav-btn" onclick="window.history.back()"><i class="fas fa-arrow-left"></i></button>
    </header>

    <main>
        <div class="title-section">
            <h1 class="intro-title" id="txt-intro"></h1>
        </div>
        <div class="game-grid" id="gameGrid"></div>
    </main>

    <footer id="txt-rodape"></footer>

    <script src="dados.js"></script>
    <script>
        function toggleMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }
        
        window.onclick = () => document.getElementById('dropdownMenu').style.display = 'none';

        window.onload = () => {
            const config = JOGO_CONFIG;
            
            // Textos
            document.getElementById('txt-logo-1').innerText = config.textos.tituloLinha1;
            document.getElementById('txt-logo-2').innerText = config.textos.subtitulo;
            document.getElementById('txt-intro').innerText = config.textos.intro;
            document.getElementById('txt-rodape').innerHTML = config.textos.rodape;
            
            // Ícones Cabeçalho
            document.getElementById('header-icon').src = config.caminhoIconsMenu + config.iconesMenu.ano1;

            // Gerar Menu
            const menu = document.getElementById('dropdownMenu');
            const labels = { home: "Início", pre: "Pré-Escolar", ano1: "1º Ano", ano2: "2º Ano", ano3: "3º Ano", ano4: "4º Ano" };
            Object.keys(config.links).forEach(key => {
                const a = document.createElement('a');
                a.className = 'menu-item'; a.href = config.links[key];
                a.innerHTML = `<img src="${config.caminhoIconsMenu}${config.iconesMenu[key] || 'icon1.png'}"> ${labels[key]}`;
                menu.appendChild(a);
            });

            // Gerar Cartões
            const grid = document.getElementById('gameGrid');
            config.listaJogos.forEach(jogo => {
                const tema = config.temaCores[jogo.tema];
                const card = document.createElement('a');
                card.className = 'card';
                card.href = jogo.link;
                card.style.borderColor = tema.border;
                
                card.innerHTML = `
                    <div class="card-inner" style="background-color: ${tema.fundo}">
                        <div class="card-img-wrap">
                            <img src="${config.caminhoIconsJogos}${jogo.icon}" alt="${jogo.nome}">
                        </div>
                        <h2 style="color: ${tema.principal}">${jogo.nome}</h2>
                        <div class="action-btn" style="background-color: ${tema.principal}">
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        };
    </script>
</body>
</html>

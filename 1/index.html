<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pequenos Exploradores</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --blue-primary: #007bff;
            --text-dark: #2d5a88;
            --text-grey: #a5b4c4;
            --bg-sky: #e1f0ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: linear-gradient(to bottom, var(--bg-sky) 0%, #ffffff 40%, #ffffff 100%);
            min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* NUVENS NO TOPO */
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 250px;
            background: url('https://i.imgur.com/vHQuI1v.png') top center repeat-x; /* Substituir por nuvens se tiver local */
            background-size: contain; opacity: 0.5; z-index: 0; pointer-events: none;
        }

        /* --- HEADER --- */
        header { 
            background: white; display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; 
            padding: 5px 20px; height: 80px; z-index: 1000;
        }

        .hamburger-btn { 
            background: none; border: none; color: var(--blue-primary); /* Cor igual à seta */
            font-size: 32px; cursor: pointer; display: flex; justify-content: flex-start;
        }

        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 55px; width: auto; }
        .title-group { display: flex; flex-direction: column; text-align: left; }
        .title-main { font-weight: 900; font-size: 1.3rem; text-transform: uppercase; color: var(--blue-primary); line-height: 1; }
        .title-main span { color: var(--text-grey); }
        .title-sub { color: var(--blue-primary); font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

        .btn-voltar-top { display: flex; justify-content: flex-end; }
        .btn-voltar-top img { height: 40px; cursor: pointer; transition: transform 0.2s; }
        .btn-voltar-top img:hover { transform: scale(1.1); }

        /* --- MENU DROPDOWN --- */
        .menu-dropdown { 
            position: absolute; top: 80px; left: 20px; display: none; 
            flex-direction: column; gap: 8px; z-index: 2000; 
        }
        .menu-item { 
            display: flex; align-items: center; gap: 12px; padding: 12px 18px; 
            background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-decoration: none; color: var(--text-dark); font-weight: 700; min-width: 200px;
        }

        /* --- SUB-HEADER --- */
        .sub-header { text-align: center; padding: 30px 10px; z-index: 10; }
        .intro-text { 
            color: #1a4a7a; font-size: 1.6rem; font-weight: 800; display: inline-flex; align-items: center; gap: 15px;
        }
        /* Faíscas amarelas da imagem */
        .intro-text::before, .intro-text::after {
            content: ""; width: 25px; height: 25px;
            background: url('data:image/svg+xml;utf8,<svg fill="%23ffcc00" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0l2.5 9.5H24l-7.5 5.5 2.5 9-7-5.5-7 5.5 2.5-9L0 9.5h9.5z"/></svg>') no-repeat center;
            background-size: contain;
        }

        /* --- CONTEÚDO (JOGOS) --- */
        main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 10px 20px; z-index: 10; }
        .game-wrapper { display: flex; gap: 20px; width: 100%; max-width: 1100px; justify-content: center; }

        /* Card PC / Tablet */
        .game-card { 
            background: white; border-radius: 35px; border: 3px solid; 
            text-decoration: none; padding: 25px; flex: 1; max-width: 320px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: 0.3s;
        }
        
        .card-img-container { 
            width: 100%; aspect-ratio: 1.25; display: flex; align-items: center; justify-content: center; 
            border-radius: 25px; margin-bottom: 20px;
        }
        .card-img-container img { width: 75%; height: 75%; object-fit: contain; }
        
        .game-card h2 { color: #1a4a7a; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; }
        
        .btn-action {
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 16px;
        }

        /* --- FOOTER RELVA --- */
        footer { 
            position: relative; min-height: 140px; width: 100%; 
            display: flex; align-items: flex-end; justify-content: center; 
            padding-bottom: 15px; font-weight: 700; color: #5d7082; font-size: 0.75rem;
            background: url('https://i.imgur.com/K1vX0S4.png') bottom center repeat-x; /* Substituir por relva se tiver local */
            background-size: cover;
        }

        /* --- RESPONSIVIDADE MOBILE --- */
        @media (max-width: 768px) {
            header { grid-template-columns: 50px 1fr 50px; padding: 0 10px; height: 70px; }
            #header-icon { height: 40px; }
            .title-main { font-size: 0.95rem; }
            .intro-text { font-size: 1.2rem; }
            
            main { align-items: center; padding-bottom: 100px; }
            .game-wrapper { flex-direction: column; align-items: center; gap: 12px; }

            /* Card vira Horizontal como no Smartphone da imagem */
            .game-card { 
                flex-direction: row; width: 100%; max-width: 95%; height: 80px; 
                padding: 10px 15px; border-radius: 22px; border-width: 2px;
            }
            .card-img-container { width: 65px; height: 65px; margin-bottom: 0; margin-right: 15px; border-radius: 12px; }
            .game-card h2 { flex: 1; text-align: left; font-size: 0.9rem; margin-bottom: 0; }
            .btn-action { width: 32px; height: 32px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)">
            <i class="fas fa-bars"></i>
        </button>
        
        <div id="dropdownMenu" class="menu-dropdown"></div>

        <div class="header-center">
            <img id="header-icon" src="" alt="Girafa">
            <div class="title-group">
                <div class="title-main">
                    <span id="txt-titulo1" style="color: var(--blue-primary);"></span> 
                    <span id="txt-titulo2"></span>
                </div>
                <span id="txt-subtitulo" class="title-sub"></span>
            </div>
        </div>

        <div class="header-right btn-voltar-top">
            <img id="icon-voltar-top" src="" alt="Voltar" onclick="voltarUmNivel()">
        </div>
    </header>

    <div class="sub-header">
        <div class="intro-text" id="txt-intro"></div>
    </div>

    <main>
        <div class="game-wrapper" id="gamesGrid"></div>
    </main>

    <footer id="txt-rodape"></footer>

    <script src="dados.js"></script>
    <script>
        function voltarUmNivel() { window.location.href = JOGO_CONFIG.links.home; }

        function toggleMenu(e) {
            if(e) e.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }
        
        window.onclick = () => document.getElementById('dropdownMenu').style.display = 'none';

        window.onload = () => {
            if (typeof JOGO_CONFIG !== 'undefined') {
                const config = JOGO_CONFIG;
                
                document.getElementById('txt-titulo1').innerText = config.textos.tituloLinha1;
                document.getElementById('txt-titulo2').innerText = config.textos.tituloLinha2;
                document.getElementById('txt-subtitulo').innerText = config.textos.subtitulo;
                document.getElementById('txt-intro').innerText = config.textos.intro;
                document.getElementById('txt-rodape').innerHTML = config.textos.rodape;
                
                document.getElementById('header-icon').src = config.caminhoIconsMenu + config.iconesMenu.ano1;
                document.getElementById('icon-voltar-top').src = config.caminhoIconsMenu + config.iconesMenu.voltarMobile;

                const menuBox = document.getElementById('dropdownMenu');
                Object.keys(config.links).forEach(key => {
                    const labels = { home: "Início", pre: "Pré-Escolar", ano1: "1º Ano", ano2: "2º Ano", ano3: "3º Ano", ano4: "4º Ano" };
                    if(config.links[key]) {
                        const a = document.createElement('a');
                        a.className = 'menu-item';
                        a.href = config.links[key];
                        a.innerHTML = `<img src="${config.caminhoIconsMenu}${config.iconesMenu[key]}"> <span>${labels[key] || key}</span>`;
                        menuBox.appendChild(a);
                    }
                });

                const grid = document.getElementById('gamesGrid');
                config.listaJogos.forEach(jogo => {
                    const tema = config.temaCores[jogo.tema];
                    const card = document.createElement('a');
                    card.className = 'game-card';
                    card.href = jogo.link;
                    card.style.borderColor = tema.borda;
                    
                    card.innerHTML = `
                        <div class="card-img-container" style="background-color: ${tema.fundo};">
                            <img src="${config.caminhoIconsJogos}${jogo.icon}" alt="${jogo.nome}">
                        </div>
                        <h2>${jogo.nome}</h2>
                        <div class="btn-action" style="background-color: ${tema.seta};">
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        };
    </script>
</body>
</html>

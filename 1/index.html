<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pequenos Exploradores</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #007bff; /* Cor exata do botão voltar_az.png */
            --text-dark: #2d5a88;
            --text-grey: #a5b4c4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: linear-gradient(to bottom, #e1f0ff 0%, #ffffff 50%, #ffffff 100%);
            min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; position: relative;
        }

        /* --- ELEMENTOS DE FUNDO --- */
        .sky-decor {
            position: absolute; top: 0; left: 0; width: 100%; height: 300px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300"><circle cx="100" cy="50" r="40" fill="white" opacity="0.6"/><circle cx="140" cy="60" r="30" fill="white" opacity="0.6"/><circle cx="850" cy="80" r="50" fill="white" opacity="0.6"/><circle cx="890" cy="90" r="35" fill="white" opacity="0.6"/></svg>');
            z-index: 0; pointer-events: none;
        }

        .grass-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 110px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 20"><path d="M0 20h120V10a10 10 0 0 0-20 0 10 10 0 0 0-20 0 10 10 0 0 0-20 0 10 10 0 0 0-20 0 10 10 0 0 0-20 0 10 10 0 0 0-20 0z" fill="%234fb443"/></svg>') repeat-x bottom;
            background-size: 280px auto; z-index: 1; pointer-events: none;
        }

        /* --- HEADER --- */
        header { 
            background: white; display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; 
            padding: 5px 20px; height: 85px; z-index: 1000;
        }

        /* Hambúrguer com cor da seta e efeito rollover */
        .hamburger-btn { 
            background: none; border: none; color: var(--primary-blue); 
            font-size: 32px; cursor: pointer; display: flex; align-items: center; justify-content: flex-start;
            transition: transform 0.2s;
        }
        .hamburger-btn:hover { transform: scale(1.1); color: #0056b3; }

        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        #header-icon { height: 60px; }
        
        .title-group { display: flex; flex-direction: column; text-align: left; }
        .title-main { font-weight: 900; font-size: 1.4rem; text-transform: uppercase; color: var(--primary-blue); line-height: 1; }
        .title-main span { color: var(--text-grey); }
        .title-sub { color: var(--primary-blue); font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

        .btn-voltar-top { display: flex; justify-content: flex-end; }
        .btn-voltar-top img { height: 45px; cursor: pointer; transition: transform 0.2s; }
        .btn-voltar-top img:hover { transform: scale(1.1); }

        /* --- MENU DROPDOWN --- */
        .menu-dropdown { 
            position: absolute; top: 85px; left: 20px; display: none; 
            flex-direction: column; gap: 8px; z-index: 2000; 
        }
        .menu-item { 
            display: flex; align-items: center; gap: 12px; padding: 12px 18px; 
            background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-decoration: none; color: var(--text-dark); font-weight: 700; min-width: 220px;
            transition: background 0.2s, color 0.2s;
        }
        .menu-item:hover { background: var(--primary-blue); color: white; }
        .menu-item img { height: 25px; }

        /* --- SUB-HEADER --- */
        .sub-header { text-align: center; padding: 30px 10px; z-index: 10; }
        .intro-text { color: #2d5a88; font-size: 1.7rem; font-weight: 800; display: inline-flex; align-items: center; gap: 15px; }
        .sparkle { color: #ffcc00; font-size: 1.8rem; font-weight: 900; }

        /* --- GRID DE JOGOS --- */
        main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 10px 20px; z-index: 10; }
        .game-wrapper { display: flex; gap: 25px; width: 100%; max-width: 1100px; justify-content: center; }

        .game-card { 
            background: white; border-radius: 35px; border: 3px solid; 
            text-decoration: none; padding: 25px; flex: 1; max-width: 330px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: transform 0.3s;
        }
        .game-card:hover { transform: translateY(-8px); }
        
        .card-img-container { 
            width: 100%; aspect-ratio: 1.3; display: flex; align-items: center; justify-content: center; 
            border-radius: 25px; margin-bottom: 20px;
        }
        .card-img-container img { width: 85%; height: 85%; object-fit: contain; }
        
        .game-card h2 { color: var(--text-dark); font-size: 1.2rem; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; }
        
        /* Botão redondo de ação com rollover */
        .btn-action { 
            width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; 
            transition: transform 0.2s, filter 0.2s;
        }
        .game-card:hover .btn-action { transform: scale(1.15); filter: brightness(1.1); }

        footer { position: fixed; bottom: 15px; width: 100%; text-align: center; font-weight: 700; color: #5d7082; font-size: 0.75rem; z-index: 10; }

        /* --- RESPONSIVIDADE MOBILE --- */
        @media (max-width: 768px) {
            header { grid-template-columns: 60px 1fr 60px; height: 75px; padding: 0 10px; }
            #header-icon { height: 45px; }
            .title-main { font-size: 1rem; }
            .btn-voltar-top img { height: 38px; }
            .game-wrapper { flex-direction: column; align-items: center; gap: 15px; padding-bottom: 120px; }
            .game-card { flex-direction: row; width: 95%; height: 85px; padding: 10px 20px; border-radius: 22px; }
            .card-img-container { width: 65px; height: 65px; margin-bottom: 0; margin-right: 15px; border-radius: 12px; }
            .game-card h2 { flex: 1; text-align: left; font-size: 1rem; margin-bottom: 0; }
            .btn-action { width: 34px; height: 34px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="sky-decor"></div>
    <div class="grass-footer"></div>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)">
            <i class="fas fa-bars"></i>
        </button>
        <div id="dropdownMenu" class="menu-dropdown"></div>
        
        <div class="header-center">
            <img id="header-icon" src="" alt="Logo">
            <div class="title-group">
                <div class="title-main"><span id="txt-titulo1"></span> <span id="txt-titulo2"></span></div>
                <span id="txt-subtitulo" class="title-sub"></span>
            </div>
        </div>
        
        <div class="header-right btn-voltar-top">
            <img id="icon-voltar-top" src="" alt="Voltar" onclick="window.location.href='../'">
        </div>
    </header>

    <div class="sub-header">
        <div class="intro-text"><span class="sparkle">✨</span><span id="txt-intro"></span><span class="sparkle">✨</span></div>
    </div>

    <main><div class="game-wrapper" id="gamesGrid"></div></main>
    <footer id="txt-rodape"></footer>

    <script src="dados.js"></script>
    <script>
        function toggleMenu(e) {
            if(e) e.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }
        window.onclick = () => document.getElementById('dropdownMenu').style.display = 'none';

        window.onload = () => {
            const config = JOGO_CONFIG;
            document.getElementById('txt-titulo1').innerText = config.textos.tituloLinha1;
            document.getElementById('txt-titulo2').innerText = config.textos.tituloLinha2;
            document.getElementById('txt-subtitulo').innerText = config.textos.subtitulo;
            document.getElementById('txt-intro').innerText = config.textos.intro;
            document.getElementById('txt-rodape').innerHTML = config.textos.rodape;
            
            // Ícones unificados
            document.getElementById('header-icon').src = config.caminhoIconsMenu + config.iconesMenu.ano1;
            document.getElementById('icon-voltar-top').src = config.caminhoIconsMenu + config.iconesMenu.voltar;

            const menuBox = document.getElementById('dropdownMenu');
            const labels = { home: "Início", pre: "Pré-Escolar", ano1: "1º Ano", ano2: "2º Ano", ano3: "3º Ano", ano4: "4º Ano" };
            Object.keys(config.links).forEach(key => {
                const a = document.createElement('a');
                a.className = 'menu-item'; a.href = config.links[key];
                a.innerHTML = `<img src="${config.caminhoIconsMenu}${config.iconesMenu[key]}"> <span>${labels[key] || key}</span>`;
                menuBox.appendChild(a);
            });

            const grid = document.getElementById('gamesGrid');
            config.listaJogos.forEach(jogo => {
                const tema = config.temaCores[jogo.tema];
                const card = document.createElement('a');
                card.className = 'game-card'; card.href = jogo.link; card.style.borderColor = tema.borda;
                card.innerHTML = `<div class="card-img-container" style="background-color: ${tema.fundo};"><img src="${config.caminhoIconsJogos}${jogo.icon}"></div><h2>${jogo.nome}</h2><div class="btn-action" style="background-color: ${tema.seta};"><i class="fas fa-arrow-right"></i></div>`;
                grid.appendChild(card);
            });
        };
    </script>
</body>
</html>

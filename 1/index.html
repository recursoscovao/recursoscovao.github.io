<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pequenos Exploradores</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #1e88e5;
            --text-dark: #1a3c5e;
            --sky-top: #d8ebff;
            --sky-bottom: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 50%, var(--sky-bottom) 100%);
            min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* --- ELEMENTOS DE FUNDO (NUVENS E ARBUSTOS) --- */
        .sky-elements {
            position: absolute; width: 100%; height: 300px; top: 0; left: 0; z-index: 0; pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300"><path fill="white" opacity="0.6" d="M150,100 Q180,70 210,100 T270,100 T330,100 T210,130 Z M700,50 Q730,20 760,50 T820,50 T880,50 T760,80 Z"/></svg>');
        }

        .ground-elements {
            position: absolute; bottom: 0; width: 100%; height: 120px; z-index: 1; pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120"><path fill="%234CAF50" d="M0,120 L1440,120 L1440,40 Q1380,20 1320,40 T1200,40 T1080,40 T960,40 T840,40 T720,40 T600,40 T480,40 T360,40 T240,40 T120,40 T0,40 Z"/></svg>');
            background-position: bottom; background-repeat: repeat-x;
        }

        /* --- HEADER --- */
        header { 
            background: white; display: flex; justify-content: space-between; align-items: center; 
            padding: 0 20px; height: 80px; z-index: 1000;
        }

        .hamburger-btn { 
            background: white; border: 2px solid #f0f4f8; color: var(--primary-blue);
            width: 45px; height: 45px; border-radius: 12px; font-size: 20px; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header-center { display: flex; align-items: center; gap: 10px; }
        #header-icon { height: 60px; width: auto; }
        .title-group { display: flex; flex-direction: column; text-align: left; }
        .title-main { font-weight: 900; font-size: 1.4rem; text-transform: uppercase; color: #1e88e5; line-height: 1; }
        .title-main span:last-child { color: #a5b4c4; }
        .title-sub { color: #1e88e5; font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px;}

        .btn-voltar-circle { 
            background: var(--primary-blue); width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; text-decoration: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1); font-size: 18px;
        }

        /* --- INTRO TEXT COM FAÍSCAS --- */
        .sub-header { text-align: center; padding: 25px 10px; z-index: 10; }
        .intro-container { display: inline-flex; align-items: center; gap: 15px; }
        .intro-text { color: #2c3e50; font-size: 1.6rem; font-weight: 800; }
        .sparks { color: #ffcc00; font-size: 1.8rem; font-weight: 900; }

        /* --- ÁREA PRINCIPAL --- */
        main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 10px 20px; z-index: 10; }
        .game-wrapper { display: flex; gap: 20px; width: 100%; max-width: 1100px; justify-content: center; }

        /* DESIGN PC / TABLET */
        .game-card { 
            background: white; border-radius: 40px; border: 4px solid; 
            text-decoration: none; padding: 30px; flex: 1; max-width: 320px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .game-card:hover { transform: translateY(-10px); }
        
        .card-img-container { 
            width: 100%; aspect-ratio: 1.3; display: flex; align-items: center; justify-content: center; 
            border-radius: 25px; margin-bottom: 20px; background-color: #f8fbff;
        }
        .card-img-container img { width: 75%; height: 75%; object-fit: contain; }
        
        .game-card h2 { color: #1e88e5; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; }
        
        .btn-card-action {
            width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* --- FOOTER --- */
        footer { 
            height: 100px; display: flex; align-items: flex-end; justify-content: center; 
            padding-bottom: 20px; font-weight: 700; color: #5d7082; font-size: 0.75rem; z-index: 10;
        }

        /* --- MENU DROPDOWN --- */
        #dropdownMenu {
            position: absolute; top: 80px; left: 20px; display: none; 
            flex-direction: column; gap: 10px; z-index: 2000;
        }
        .menu-item {
            display: flex; align-items: center; gap: 12px; padding: 15px 20px; 
            background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-decoration: none; color: #5d7082; font-weight: 700; min-width: 220px;
        }

        /* --- RESPONSIVIDADE TELEMÓVEL (IGUAL À IMAGEM) --- */
        @media (max-width: 650px) {
            header { height: 70px; padding: 0 10px; }
            #header-icon { height: 45px; }
            .title-main { font-size: 1.1rem; }
            .intro-text { font-size: 1.3rem; }
            
            main { align-items: center; padding-bottom: 120px; }
            .game-wrapper { flex-direction: column; align-items: center; gap: 15px; }
            
            /* TRANSFORMANDO O CARD EM LISTA HORIZONTAL */
            .game-card { 
                flex-direction: row; width: 95%; max-width: 100%; height: 90px; 
                padding: 10px 20px; border-radius: 25px; border-width: 3px;
            }
            .card-img-container { width: 70px; height: 100%; margin-bottom: 0; margin-right: 15px; background: none; }
            .card-img-container img { width: 100%; height: 100%; }
            .game-card h2 { flex: 1; text-align: left; font-size: 1rem; margin-bottom: 0; color: #476a8a; }
            .btn-card-action { width: 35px; height: 35px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="sky-elements"></div>
    <div class="ground-elements"></div>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)">
            <i class="fas fa-bars"></i>
        </button>
        
        <div id="dropdownMenu"></div>

        <div class="header-center">
            <img id="header-icon" src="" alt="Girafa">
            <div class="title-group">
                <div class="title-main">
                    <span id="txt-titulo1"></span> 
                    <span id="txt-titulo2"></span>
                </div>
                <span id="txt-subtitulo" class="title-sub"></span>
            </div>
        </div>

        <div class="header-right">
            <a href="javascript:voltarUmNivel()" class="btn-voltar-circle">
                <i class="fas fa-arrow-left"></i>
            </a>
        </div>
    </header>

    <div class="sub-header">
        <div class="intro-container">
            <span class="sparks">✨</span>
            <span id="txt-intro" class="intro-text"></span>
            <span class="sparks">✨</span>
        </div>
    </div>

    <main>
        <div class="game-wrapper" id="gamesGrid"></div>
    </main>

    <footer id="txt-rodape"></footer>

    <script src="dados.js"></script>
    <script>
        function voltarUmNivel() { window.location.href = "../"; }
        function toggleMenu(e) {
            const m = document.getElementById('dropdownMenu');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
            if(e) e.stopPropagation();
        }
        window.onclick = () => document.getElementById('dropdownMenu').style.display = 'none';

        window.onload = () => {
            const config = JOGO_CONFIG;
            document.getElementById('txt-titulo1').innerText = config.textos.tituloLinha1;
            document.getElementById('txt-titulo2').innerText = config.textos.tituloLinha2;
            document.getElementById('txt-subtitulo').innerText = config.textos.subtitulo;
            document.getElementById('txt-intro').innerText = config.textos.intro;
            document.getElementById('txt-rodape').innerHTML = config.textos.rodape;
            document.getElementById('header-icon').src = config.caminhoIconsMenu + config.iconesMenu.ano1;

            const grid = document.getElementById('gamesGrid');
            config.listaJogos.forEach(jogo => {
                const tema = config.temaCores[jogo.tema];
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = jogo.link;
                card.style.borderColor = tema.borda;
                
                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${config.caminhoIconsJogos}${jogo.icon}" alt="${jogo.nome}">
                    </div>
                    <h2>${jogo.nome}</h2>
                    <div class="btn-card-action" style="background-color: ${tema.seta};">
                        <i class="fas fa-arrow-right"></i>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Gerar menu lateral simples
            const menu = document.getElementById('dropdownMenu');
            Object.keys(config.links).forEach(key => {
                const a = document.createElement('a');
                a.className = 'menu-item';
                a.href = config.links[key];
                a.innerHTML = `<span>${key.toUpperCase()}</span>`;
                menu.appendChild(a);
            });
        };
    </script>
</body>
</html>

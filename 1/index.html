<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pequenos Exploradores</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #3a86ff;
            --text-dark: #2d5a88;
            --text-grey: #a5b4c4;
            --bg-light: #f0f7ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-light); 
            display: flex; flex-direction: column; min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header { 
            background: white; display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; 
            padding: 10px 20px; height: 90px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .hamburger-btn { 
            background: #f0f7ff; border: none; width: 50px; height: 50px; border-radius: 12px;
            color: var(--primary-blue); font-size: 24px; cursor: pointer;
        }

        .header-center { display: flex; align-items: center; justify-content: center; gap: 15px; }
        #header-icon { height: 60px; width: auto; }
        .title-group { display: flex; flex-direction: column; }
        .title-main { font-weight: 900; font-size: 1.4rem; text-transform: uppercase; color: var(--primary-blue); line-height: 1; }
        .title-main span:last-child { color: var(--text-grey); }
        .title-sub { color: var(--text-grey); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        .btn-voltar-mobile img { height: 45px; transition: transform 0.2s; }

        /* --- SUB-HEADER --- */
        .sub-header { text-align: center; padding: 30px 10px; position: relative; }
        .intro-text { 
            color: var(--text-dark); font-size: 1.6rem; font-weight: 800; display: inline-block; position: relative;
        }
        /* Faíscas amarelas da imagem */
        .intro-text::before, .intro-text::after {
            content: ''; position: absolute; width: 25px; height: 25px;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23FFD700" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0l2.5 9.5H24l-7.5 5.5 2.5 9-7-5.5-7 5.5 2.5-9L0 9.5h9.5z"/></svg>');
            background-size: contain; background-repeat: no-repeat;
        }
        .intro-text::before { left: -40px; top: -5px; transform: rotate(-20deg); }
        .intro-text::after { right: -40px; top: -5px; transform: rotate(20deg); }

        /* --- CONTEÚDO PRINCIPAL (GRELHA DE JOGOS) --- */
        main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
        .game-wrapper { display: flex; gap: 25px; width: 100%; max-width: 1200px; justify-content: center; }

        /* Estilo Card PC / TABLET */
        .game-card { 
            background: white; border-radius: 35px; border: 3px solid; 
            text-decoration: none; padding: 25px; flex: 1; max-width: 350px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: transform 0.3s ease;
        }
        .game-card:hover { transform: translateY(-10px); }
        
        .card-img-container { 
            width: 100%; aspect-ratio: 1.2; display: flex; align-items: center; justify-content: center; 
            border-radius: 25px; margin-bottom: 20px;
        }
        .card-img-container img { width: 80%; max-height: 85%; object-fit: contain; }
        
        .game-card h2 { color: var(--text-dark); font-size: 1.2rem; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; }
        
        .btn-action {
            width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 20px;
        }

        /* --- FOOTER DECORATIVO --- */
        footer { 
            background: url('https://i.imgur.com/HqyV79S.png') bottom center repeat-x; 
            background-size: contain; min-height: 120px; display: flex; align-items: flex-end; 
            justify-content: center; padding-bottom: 15px; font-weight: 700; color: #666; font-size: 0.8rem;
        }

        /* --- MENU DROPDOWN --- */
        .menu-dropdown { 
            position: absolute; top: 95px; left: 20px; display: none; 
            flex-direction: column; gap: 10px; z-index: 2000; 
        }
        .menu-item { 
            display: flex; align-items: center; gap: 15px; padding: 15px 20px; 
            background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-decoration: none; color: var(--text-dark); font-weight: 700; min-width: 220px;
        }
        .menu-item img { height: 25px; }

        /* --- MEDIA QUERIES (TABLET & MOBILE) --- */

        /* Tablet (Ecrãs Médios) */
        @media (max-width: 1024px) {
            .game-wrapper { gap: 15px; padding: 0 10px; }
            .game-card { padding: 15px; border-radius: 25px; }
            .title-main { font-size: 1.2rem; }
        }

        /* Telemóvel (Ecrã Pequeno conforme imagem) */
        @media (max-width: 650px) {
            header { grid-template-columns: 60px 1fr 60px; height: 75px; padding: 0 10px; }
            #header-icon { height: 45px; }
            .title-main { font-size: 1rem; }
            .btn-voltar-mobile img { height: 35px; }

            .intro-text { font-size: 1.2rem; }
            .intro-text::before, .intro-text::after { width: 15px; height: 15px; }

            main { align-items: center; padding-bottom: 100px; }
            .game-wrapper { flex-direction: column; align-items: center; width: 92%; }

            /* Card vira Horizontal no Mobile */
            .game-card { 
                flex-direction: row; width: 100%; max-width: 100%; height: 85px; 
                padding: 10px 15px; border-radius: 20px;
            }
            .card-img-container { width: 65px; height: 65px; margin-bottom: 0; margin-right: 15px; border-radius: 12px; }
            .game-card h2 { flex: 1; text-align: left; font-size: 0.95rem; margin-bottom: 0; }
            .btn-action { width: 35px; height: 35px; font-size: 16px; }

            footer { position: fixed; bottom: 0; min-height: 80px; width: 100%; z-index: -1; }
        }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)">
            <i class="fas fa-bars"></i>
        </button>
        
        <div id="dropdownMenu" class="menu-dropdown"></div>

        <div class="header-center">
            <img id="header-icon" src="" alt="Logo">
            <div class="title-group">
                <div class="title-main">
                    <span id="txt-titulo1"></span> 
                    <span id="txt-titulo2"></span>
                </div>
                <span id="txt-subtitulo" class="title-sub"></span>
            </div>
        </div>

        <div class="header-right">
            <a href="javascript:voltarUmNivel()" class="btn-voltar-mobile">
                <img id="icon-voltar-mobile" src="" alt="Voltar">
            </a>
        </div>
    </header>

    <div class="sub-header">
        <div id="txt-intro" class="intro-text"></div>
    </div>

    <main>
        <div class="game-wrapper" id="gamesGrid"></div>
    </main>

    <footer id="txt-rodape"></footer>

    <script src="dados.js"></script>
    <script>
        function voltarUmNivel() { window.location.href = JOGO_CONFIG.links.home; }

        function toggleMenu(e) {
            if(e) e.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }
        
        window.onclick = () => document.getElementById('dropdownMenu').style.display = 'none';

        window.onload = () => {
            if (typeof JOGO_CONFIG !== 'undefined') {
                const config = JOGO_CONFIG;
                
                // Preencher textos do Header e Rodapé
                document.getElementById('txt-titulo1').innerText = config.textos.tituloLinha1;
                document.getElementById('txt-titulo2').innerText = config.textos.tituloLinha2;
                document.getElementById('txt-subtitulo').innerText = config.textos.subtitulo;
                document.getElementById('txt-intro').innerText = config.textos.intro;
                document.getElementById('txt-rodape').innerHTML = config.textos.rodape;
                
                // Ícones do Header
                document.getElementById('header-icon').src = config.caminhoIconsMenu + config.iconesMenu.ano1;
                document.getElementById('icon-voltar-mobile').src = config.caminhoIconsMenu + config.iconesMenu.voltarMobile;

                // Gerar Menu Lateral
                const menuBox = document.getElementById('dropdownMenu');
                const labels = { home: "Início", pre: "Pré-Escolar", ano1: "1º Ano", ano2: "2º Ano", ano3: "3º Ano", ano4: "4º Ano" };

                Object.keys(config.links).forEach(key => {
                    if(config.links[key]) {
                        const a = document.createElement('a');
                        a.className = 'menu-item';
                        a.href = config.links[key];
                        a.innerHTML = `<img src="${config.caminhoIconsMenu}${config.iconesMenu[key]}"> <span>${labels[key] || key}</span>`;
                        menuBox.appendChild(a);
                    }
                });

                // Gerar Cards de Jogos
                const grid = document.getElementById('gamesGrid');
                config.listaJogos.forEach(jogo => {
                    const tema = config.temaCores[jogo.tema];
                    const card = document.createElement('a');
                    card.className = 'game-card';
                    card.href = jogo.link;
                    card.style.borderColor = tema.borda;
                    
                    card.innerHTML = `
                        <div class="card-img-container" style="background-color: ${tema.fundo};">
                            <img src="${config.caminhoIconsJogos}${jogo.icon}" alt="${jogo.nome}">
                        </div>
                        <h2>${jogo.nome}</h2>
                        <div class="btn-action" style="background-color: ${tema.seta};">
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        };
    </script>
</body>
</html>

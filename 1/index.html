<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pequenos Exploradores</title>
    <style>
        /* =========================================
           CSS - RESPONSIVIDADE E DESIGN
           ========================================= */
        :root {
            /* Cores extraídas do teu tema azul (ano 1) */
            --borda-header: #5ba4e5;
            --fundo-header: #ffffff;
            --texto-titulo: #5ba4e5;
            --texto-secundario: #7a8ba0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Rounded MT Bold', Arial, sans-serif; }

        body {
            background-color: #f4f9ff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- HEADER (Cantos arredondados e borda azul) --- */
        .header-container {
            background: var(--fundo-header);
            border: 3px solid #e1f0ff; /* Tom suave de azul para a borda */
            border-radius: 30px;
            padding: 10px 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Área Central do Logo */
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            height: 70px;
            width: auto;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-text h1 {
            color: var(--texto-titulo);
            font-size: 1.8rem;
            line-height: 1;
            margin-bottom: 2px;
        }

        .logo-text h2 {
            color: var(--texto-secundario);
            font-size: 1.8rem;
            line-height: 1;
        }

        .logo-text p {
            color: var(--texto-secundario);
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        /* Botões laterais */
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.2s;
        }

        .icon-btn:hover { transform: scale(1.1); }

        .icon-btn img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        /* --- SECÇÃO DESCRIÇÃO --- */
        .descricao-section {
            text-align: center;
            padding: 25px 10px;
        }

        .descricao-section h3 {
            color: var(--texto-secundario);
            font-size: 1.5rem;
            font-weight: 500;
        }

        /* --- MAIN --- */
        main {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- FOOTER --- */
        .footer-container {
            background: #ffffff;
            border: 2px solid #e1f0ff;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            margin-top: 20px;
        }

        .footer-container p {
            color: var(--texto-secundario);
            font-size: 0.9rem;
        }

        /* =========================================
           MEDIA QUERIES (ADAPTAÇÃO TOTAL)
           ========================================= */

        /* 1. TABLET LANDSCAPE / MONITOR PEQUENO */
        @media (max-width: 1024px) {
            .logo-icon { height: 60px; }
            .logo-text h1, .logo-text h2 { font-size: 1.4rem; }
        }

        /* 2. TELEMÓVEL LANDSCAPE (Ecrã deitado) */
        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 8px; }
            .header-container { padding: 5px 20px; border-radius: 20px; }
            .logo-icon { height: 45px; }
            .logo-text h1, .logo-text h2 { font-size: 1.1rem; }
            .logo-text p { display: none; } /* Esconde o subtítulo para sobrar espaço */
            .descricao-section { padding: 10px; }
            .icon-btn img { width: 40px; height: 40px; }
        }

        /* 3. TELEMÓVEL PORTRAIT (Vertical) */
        @media (max-width: 480px) {
            .header-container { padding: 10px 15px; border-radius: 20px; }
            .logo-icon { height: 50px; }
            .logo-wrapper { gap: 10px; }
            .logo-text h1, .logo-text h2 { font-size: 1rem; }
            .logo-text p { font-size: 0.7rem; }
            .icon-btn img { width: 40px; height: 40px; }
            .descricao-section h3 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header-container">
        <div class="header-content">
            <!-- Botão Menu (Home) -->
            <button class="icon-btn" id="btn-home">
                <img id="img-menu" src="" alt="Home">
            </button>

            <!-- Logótipo e Títulos -->
            <div class="logo-wrapper">
                <img id="logo-dinamico" src="" alt="Logo" class="logo-icon">
                <div class="logo-text">
                    <h1 id="titulo1"></h1>
                    <h2 id="titulo2"></h2>
                    <p id="subtitulo"></p>
                </div>
            </div>

            <!-- Botão Voltar -->
            <button class="icon-btn" id="btn-voltar">
                <img id="img-voltar" src="" alt="Voltar">
            </button>
        </div>
    </header>

    <!-- SECÇÃO DESCRIÇÃO -->
    <section class="descricao-section">
        <h3 id="intro-texto"></h3>
    </section>

    <!-- SECÇÃO MAIN -->
    <main id="main-content">
        <!-- Conteúdo virá a seguir -->
    </main>

    <!-- SECÇÃO FOOTER -->
    <footer class="footer-container">
        <p id="rodape-texto"></p>
    </footer>

    <!-- CARREGAR DADOS EXTERNOS -->
    <script src="dados.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Verifica se o objeto JOGO_CONFIG existe no dados.js
            if (typeof JOGO_CONFIG !== 'undefined') {
                
                const conf = JOGO_CONFIG;

                // 1. Preencher Textos
                document.getElementById("titulo1").innerText = conf.textos.tituloLinha1;
                document.getElementById("titulo2").innerText = conf.textos.tituloLinha2;
                document.getElementById("subtitulo").innerText = conf.textos.subtitulo;
                document.getElementById("intro-texto").innerText = conf.textos.intro;
                document.getElementById("rodape-texto").innerHTML = conf.textos.rodape;

                // 2. Preencher Ícones (Caminho + Nome do ficheiro)
                const pathMenu = conf.caminhoIconsMenu;
                
                // Ícone Esquerda (Home)
                document.getElementById("img-menu").src = pathMenu + conf.iconesMenu.home;
                
                // Ícone Direita (Voltar)
                document.getElementById("img-voltar").src = pathMenu + conf.iconesMenu.voltar;

                // Ícone Central Dinâmico (baseado no anoAtivo: "ano1")
                // Se quiseres a girafa fixa, basta trocar para: pathMenu + "girafa.png"
                document.getElementById("logo-dinamico").src = pathMenu + conf.iconesMenu[conf.anoAtivo];

                // 3. Links
                document.getElementById("btn-home").onclick = () => window.location.href = conf.links.home;
                document.getElementById("btn-voltar").onclick = () => window.location.href = conf.links.home;

            } else {
                alert("Erro: O ficheiro dados.js não foi carregado corretamente.");
            }
        });
    </script>
</body>
</html>

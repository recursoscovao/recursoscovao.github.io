<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pequenos Exploradores</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #007bff;
            --text-dark: #2d5a88;
            --text-grey: #a5b4c4;
            --sky-top: #e1f0ff;
            --sky-bottom: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        body { 
            /* Fundo de Céu com Gradiente */
            background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 50%, var(--sky-bottom) 100%);
            display: flex; flex-direction: column; min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Nuvens Decorativas no Fundo */
        body::before {
            content: ""; position: absolute; top: 10%; left: 10%; width: 100px; height: 40px;
            background: white; border-radius: 50px; opacity: 0.6; filter: blur(10px); z-index: -1;
            box-shadow: 200px 50px 0 10px white, 600px -20px 0 5px white, 900px 80px 0 15px white;
        }

        /* --- HEADER --- */
        header { 
            background: white; display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; 
            padding: 5px 20px; height: 80px; z-index: 1000;
        }

        .hamburger-btn { background: none; border: none; color: var(--primary-blue); font-size: 28px; cursor: pointer; }

        .header-center { display: flex; align-items: center; justify-content: center; gap: 10px; }
        #header-icon { height: 55px; width: auto; }
        .title-group { display: flex; flex-direction: column; text-align: left; }
        .title-main { font-weight: 900; font-size: 1.3rem; text-transform: uppercase; color: var(--primary-blue); line-height: 1; }
        .title-main span:last-child { color: var(--text-grey); }
        .title-sub { color: var(--primary-blue); font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

        .btn-voltar-mobile img { height: 35px; }

        /* --- SUB-HEADER (O QUE VAMOS APRENDER) --- */
        .sub-header { text-align: center; padding: 25px 10px; }
        .intro-text { 
            color: #1a4a7a; font-size: 1.6rem; font-weight: 800; display: inline-flex; align-items: center; gap: 15px;
        }
        /* As faíscas amarelas da imagem */
        .spark { color: #ffcc00; font-size: 1.8rem; font-weight: 900; }

        /* --- ÁREA DOS JOGOS --- */
        main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 10px 20px; z-index: 10; }
        .game-wrapper { display: flex; gap: 20px; width: 100%; max-width: 1100px; justify-content: center; }

        /* Estilo Card PC / Tablet */
        .game-card { 
            background: white; border-radius: 30px; border: 3px solid; 
            text-decoration: none; padding: 20px; flex: 1; max-width: 320px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); transition: 0.3s;
        }
        .game-card:hover { transform: translateY(-5px); }
        
        .card-img-container { 
            width: 100%; aspect-ratio: 1.3; display: flex; align-items: center; justify-content: center; 
            border-radius: 20px; margin-bottom: 15px;
        }
        .card-img-container img { width: 70%; object-fit: contain; }
        
        .game-card h2 { color: #1a4a7a; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; }
        
        .btn-action {
            width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 16px;
        }

        /* --- RODAPÉ COM RELVA E FLORES --- */
        footer { 
            position: relative; min-height: 120px; width: 100%; 
            display: flex; align-items: flex-end; justify-content: center; 
            padding-bottom: 15px; font-weight: 700; color: #5d7082; font-size: 0.75rem;
            /* Camada de Relva: Usamos uma imagem repetida ou gradiente decorado */
            background: url('https://www.transparenttextures.com/patterns/grass.png'), linear-gradient(to top, #76c94a 0%, #a8e063 100%);
            border-top-left-radius: 50% 20px; border-top-right-radius: 50% 20px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
        }
        
        /* Flores na relva (CSS Puro) */
        footer::before {
            content: "🌸   🌼   🌸"; position: absolute; top: 15px; width: 100%; text-align: center; font-size: 1.2rem; opacity: 0.8;
        }

        /* --- RESPONSIVIDADE MOBILE --- */
        @media (max-width: 768px) {
            .game-wrapper { flex-direction: column; align-items: center; width: 100%; }
            
            .game-card { 
                flex-direction: row; width: 100%; max-width: 100%; height: 80px; 
                padding: 10px 15px; border-radius: 20px;
            }
            .card-img-container { width: 60px; height: 60px; margin-bottom: 0; margin-right: 15px; }
            .game-card h2 { flex: 1; text-align: left; font-size: 0.9rem; margin-bottom: 0; }
            .btn-action { width: 32px; height: 32px; }

            .intro-text { font-size: 1.2rem; }
            footer { min-height: 80px; border-top-left-radius: 30px; border-top-right-radius: 30px; }
        }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)">
            <i class="fas fa-bars"></i>
        </button>
        <div id="dropdownMenu" style="display:none; position:absolute; top:80px; left:20px; background:white; padding:10px; border-radius:10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); z-index:2000;">
            <!-- Conteúdo dinâmico do menu -->
        </div>

        <div class="header-center">
            <img id="header-icon" src="" alt="Logo">
            <div class="title-group">
                <div class="title-main">
                    <span id="txt-titulo1"></span> 
                    <span id="txt-titulo2"></span>
                </div>
                <span id="txt-subtitulo" class="title-sub"></span>
            </div>
        </div>

        <div class="header-right">
            <a href="javascript:voltarUmNivel()" class="btn-voltar-mobile">
                <img id="icon-voltar-mobile" src="" alt="Voltar">
            </a>
        </div>
    </header>

    <div class="sub-header">
        <div class="intro-text">
            <span class="spark">✨</span>
            <span id="txt-intro"></span>
            <span class="spark">✨</span>
        </div>
    </div>

    <main>
        <div class="game-wrapper" id="gamesGrid"></div>
    </main>

    <footer id="txt-rodape"></footer>

    <script src="dados.js"></script>
    <script>
        function voltarUmNivel() { window.location.href = JOGO_CONFIG.links.home; }
        
        function toggleMenu(e) {
            const m = document.getElementById('dropdownMenu');
            m.style.display = m.style.display === 'none' ? 'block' : 'none';
        }

        window.onload = () => {
            if (typeof JOGO_CONFIG !== 'undefined') {
                const config = JOGO_CONFIG;
                document.getElementById('txt-titulo1').innerText = config.textos.tituloLinha1;
                document.getElementById('txt-titulo2').innerText = config.textos.tituloLinha2;
                document.getElementById('txt-subtitulo').innerText = config.textos.subtitulo;
                document.getElementById('txt-intro').innerText = config.textos.intro;
                document.getElementById('txt-rodape').innerHTML = config.textos.rodape;
                document.getElementById('header-icon').src = config.caminhoIconsMenu + config.iconesMenu.ano1;
                document.getElementById('icon-voltar-mobile').src = config.caminhoIconsMenu + config.iconesMenu.voltarMobile;

                const grid = document.getElementById('gamesGrid');
                config.listaJogos.forEach(jogo => {
                    const tema = config.temaCores[jogo.tema];
                    const card = document.createElement('a');
                    card.className = 'game-card';
                    card.href = jogo.link;
                    card.style.borderColor = tema.borda;
                    
                    card.innerHTML = `
                        <div class="card-img-container" style="background-color: ${tema.fundo};">
                            <img src="${config.caminhoIconsJogos}${jogo.icon}" alt="${jogo.nome}">
                        </div>
                        <h2>${jogo.nome}</h2>
                        <div class="btn-action" style="background-color: ${tema.seta};">
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        };
    </script>
</body>
</html>

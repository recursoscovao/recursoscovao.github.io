<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogos Educativos</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-page: #ffffff; --primary-blue: #1A499C; --text-grey: #8792a1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { background-color: var(--bg-page); height: 100dvh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* ----- HEADER ----- */
        header { 
            height: 80px; background: white; display: grid; grid-template-columns: 50px 1fr 50px; 
            align-items: center; padding: 0 15px; z-index: 1000; flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-radius: 0 0 35px 35px;
        }
        .hamburger-btn { justify-self: start; background: none; border: none; color: var(--primary-blue); font-size: 24px; cursor: pointer; }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 10px; }
        #head-logo { height: 50px; object-fit: contain; }
        .title-group { display: flex; flex-direction: column; text-align: left; line-height: 0.9; }
        #tit-l1, #tit-l2 { color: var(--primary-blue); font-weight: 900; font-size: 1.1rem; }
        #sub-tit { color: var(--text-grey); font-weight: 700; font-size: 0.65rem; margin-top: 2px; text-transform: uppercase; }
        .btn-voltar { justify-self: end; }
        #header-back { height: 35px; width: 35px; cursor: pointer; }

        /* ----- CONTEÚDO ----- */
        main { flex: 1; padding: 40px 20px; max-width: 1200px; margin: 0 auto; width: 100%; overflow-y: auto; }

        /* CONTENTOR DA FASE (DESIGN IMAGEM 2) */
        .phase-section {
            background: rgba(255,255,255,0.4);
            border: 2px solid white;
            border-radius: 40px;
            padding: 50px 25px 30px 25px;
            margin-bottom: 60px;
            position: relative;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }

        .phase-label {
            position: absolute;
            top: -20px; left: 25px;
            background: var(--fase-color);
            color: white;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 0.85rem;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* CARTÃO DO JOGO (DESIGN IMAGEM 1) */
        .game-card {
            background: white;
            aspect-ratio: 1 / 1.1; /* Formato quadrado como na imagem 1 */
            border-radius: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.2s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            position: relative;
        }
        .game-card:hover { transform: translateY(-10px); }

        .card-img-box {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card-img-box img { 
            max-width: 90%; 
            max-height: 90%; 
            object-fit: contain;
            /* Se quiseres remover o fundo cinza, não usamos caixa aqui, apenas a img solta */
        }

        .game-card h2 { 
            width: 100%;
            padding: 0 15px 20px 15px;
            color: #1A499C; /* Azul padrão dos títulos da imagem 1 */
            font-size: 0.85rem; 
            font-weight: 900; 
            text-transform: uppercase; 
            text-align: center;
        }

        /* BARRA COLORIDA NO FUNDO (DESIGN IMAGEM 1) */
        .card-footer-bar {
            width: 100%;
            height: 12px; 
            background-color: var(--item-color);
        }

        /* ----- FOOTER ----- */
        footer { background: white; width: 100%; padding: 15px 0; text-align: center; color: var(--text-grey); font-size: 0.8rem; box-shadow: 0 -4px 10px rgba(0,0,0,0.02); }

        @media (max-width: 600px) {
            .phase-section { grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 45px 15px 20px 15px; }
            .game-card { border-radius: 25px; }
            .game-card h2 { font-size: 0.65rem; padding-bottom: 12px; }
            .card-footer-bar { height: 8px; }
        }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn"><i class="fas fa-bars"></i></button>
        <div class="header-center">
            <img id="head-logo" src="" alt="">
            <div class="title-group">
                <h1 id="tit-l1"></h1>
                <h1 id="tit-l2"></h1>
                <div id="sub-tit"></div>
            </div>
        </div>
        <a href="#" class="btn-voltar" onclick="window.history.back()">
            <img id="header-back" src="" alt="Voltar">
        </a>
    </header>

    <main id="fasesContainer"></main>

    <footer id="txt-rodape"></footer>

    <script src="biblioteca.js"></script>
    <script src="dados.js"></script>
    <script>
        function initUI() {
            const conf = JOGO_CONFIG;
            const tema = BIBLIOTECA_TEMAS[conf.areaAtiva];
            const info = BIBLIOTECA_CONTEUDO[conf.anoAtivo][conf.areaAtiva];
            const root = document.documentElement;

            root.style.setProperty('--bg-page', tema.corPagina);
            root.style.setProperty('--primary-blue', tema.corPrimaria);
            
            document.getElementById('tit-l1').innerText = info.t1;
            document.getElementById('tit-l2').innerText = info.t2;
            document.getElementById('sub-tit').innerText = info.sub;
            document.getElementById('txt-rodape').innerHTML = info.rodape;
            document.getElementById('head-logo').src = conf.caminhoIconsMenu + conf.iconesMenu[conf.anoAtivo];
            document.getElementById('header-back').src = conf.caminhoIconsMenu + tema.voltarMobile;

            const container = document.getElementById('fasesContainer');

            conf.listaFases.forEach(fase => {
                const section = document.createElement('section');
                section.className = 'phase-section';
                section.style.setProperty('--fase-color', fase.corEtiqueta);
                section.innerHTML = `<div class="phase-label">${fase.tituloFase}</div>`;

                fase.jogos.forEach(jogo => {
                    const card = document.createElement('a');
                    card.className = 'game-card';
                    card.href = jogo.link;
                    card.style.setProperty('--item-color', jogo.cor);

                    card.innerHTML = `
                        <div class="card-img-box">
                            <img src="${conf.caminhoIconsJogos}${jogo.icon}">
                        </div>
                        <h2>${jogo.nome}</h2>
                        <div class="card-footer-bar"></div>
                    `;
                    section.appendChild(card);
                });
                container.appendChild(section);
            });
        }
        window.onload = initUI;
    </script>
</body>
</html>

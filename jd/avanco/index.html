<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Jogo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           1. CONFIGURAÇÕES GLOBAIS
           ============================================================ */
        :root { --primary-color: #5EA2E6; --bg-color: #EAF4FE; --text-grey: #8792a1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        
        body, html { 
            min-height: 100vh; 
            width: 100vw; 
            background-color: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden; 
            overflow-y: auto; 
        }
        
        header { background: white; border-radius: 0 0 35px 35px; display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; padding: 0 15px; z-index: 1000; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .header-center { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .title-group { display: flex; flex-direction: column; line-height: 0.85; text-transform: uppercase; }
        
        main { flex: 1 0 auto; display: flex; justify-content: center; align-items: flex-start; padding: 15px; }
        
        /* Largura da área de jogo (Mantida conforme gostaste) */
        .game-shell { 
            background: white; 
            width: 95%;
            max-width: 960px; 
            min-height: 450px; 
            border: 1.5px solid var(--primary-color); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            border-radius: 40px;
        }

        .shell-header { text-align: center; border-bottom: 2px dashed #f5f5f5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .shell-body { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 20px; }
        .shell-footer { display: flex; align-items: center; background: #fafafa; flex-shrink: 0; }

        footer { text-align: center; background: white; flex-shrink: 0; padding: 10px; }

        /* ============================================================
           MENU HAMBURGUER (CORREÇÃO DE DESIGN)
           ============================================================ */
        .hamburger-btn { background: none; border: none; color: var(--primary-color); cursor: pointer; transition: 0.2s; font-size: 26px; width: 50px; height: 50px; }
        
        .menu-dropdown { 
            position: absolute; 
            display: none; 
            flex-direction: column; 
            gap: 8px; 
            z-index: 2000; 
            background: white; 
            padding: 12px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid #f0f0f0;
        }

        .menu-item { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            text-decoration: none; 
            color: var(--text-grey); 
            font-weight: 800; 
            background: #f8f9fa; 
            padding: 0 20px; 
            height: 52px; 
            border-radius: 12px; 
            transition: 0.2s;
            white-space: nowrap;
            min-width: 260px;
        }

        .menu-item img { width: 28px; height: 28px; flex-shrink: 0; object-fit: contain; }
        .menu-item:hover { background-color: var(--primary-color); color: white !important; }
        
        /* ============================================================
           MEDIA QUERIES (AJUSTES DE POSIÇÃO)
           ============================================================ */
        @media screen and (min-width: 1025px), (min-width: 768px) and (orientation: landscape) {
            header { height: 85px; }
            .menu-dropdown { top: 80px; left: 15px; }
        }

        @media screen and (min-width: 501px) and (max-width: 1024px) and (orientation: portrait) {
            header { height: 100px; } 
            .menu-dropdown { top: 95px; left: 15px; }
            .menu-item { min-width: 300px; height: 60px; font-size: 1.1rem; }
        }

        @media screen and (max-width: 500px) {
            header { height: 85px; }
            .menu-dropdown { top: 80px; left: 10px; width: calc(100vw - 20px); max-width: 300px; }
        }
    </style>
</head>
<body>

    <header>
        <button class="hamburger-btn" onclick="toggleMenu(event)"><i class="fas fa-bars"></i></button>
        <div id="dropdownMenu" class="menu-dropdown"></div>
        <div class="header-center">
            <img id="header-icon" src="" alt="" style="height: 50px;">
            <div class="title-group">
                <div id="txt-titulo1">---</div>
                <div id="txt-titulo2">---</div>
                <div id="txt-subtitulo-header">---</div>
            </div>
        </div>
        <img id="icon-voltar-top" src="" onclick="location.reload()" style="height: 38px; cursor: pointer;">
    </header>

    <main>
        <div class="game-shell">
            <div id="shell-header-content" class="shell-header"></div>
            <div id="game-content" class="shell-body"></div>
            <div id="shell-footer-content" class="shell-footer"></div>
        </div>
    </main>

    <footer><span class="footer-text" id="txt-rodape"></span></footer>

    <script src="dados.js"></script>
    <script>
        const Engine = {
            init() {
                const config = JOGO_CONFIG;
                const tema = BIBLIOTECA_TEMAS[config.areaAtiva];
                const conteudo = BIBLIOTECA_CONTEUDO[config.anoAtivo][config.areaAtiva];

                document.title = config.nomeDoJogo;
                document.documentElement.style.setProperty('--primary-color', tema.corPrimaria);
                document.documentElement.style.setProperty('--bg-color', tema.corPagina);

                document.getElementById('txt-titulo1').innerText = conteudo.t1;
                document.getElementById('txt-titulo2').innerText = conteudo.t2;
                document.getElementById('txt-subtitulo-header').innerText = conteudo.sub;
                document.getElementById('txt-rodape').innerHTML = conteudo.rodape;
                
                const voltarIconPath = config.caminhoIconsMenu + tema.voltarMobile;
                document.getElementById('icon-voltar-top').src = voltarIconPath;

                const itemAtivo = (config.menuItens || config.menu_itens).find(i => i.id === config.anoAtivo);
                if(itemAtivo) document.getElementById('header-icon').src = config.caminhoIconsMenu + itemAtivo.icon;
                
                const menuBox = document.getElementById('dropdownMenu');
                menuBox.innerHTML = ''; 

                // --- FILTRO ROBUSTO PARA REMOVER "DESTAQUES" ---
                const listaOriginal = (config.menuItens || config.menu_itens);
                listaOriginal.forEach(item => {
                    // Ignora se o texto for "Destaques" (independente de espaços ou maiúsculas)
                    if (item.label.trim().toLowerCase() === "destaques") return;

                    const a = document.createElement('a'); 
                    a.className = 'menu-item'; 
                    a.href = item.link;
                    const imgPath = (item.icon === "AUTO") ? voltarIconPath : config.caminhoIconsMenu + item.icon;
                    a.innerHTML = `<img src="${imgPath}"> <span>${item.label}</span>`;
                    menuBox.appendChild(a);
                });

                if(typeof mostrarCapa === "function") mostrarCapa();
            },

            showStatusBar(ronda, total, certos, erros) {
                const lampPath = JOGO_CONFIG.caminhoIconsMenu + "lampada.png";
                document.getElementById('shell-header-content').innerHTML = `
                    <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <img src="${lampPath}" style="height:45px; cursor:pointer;" onclick="darAjuda()">
                            <div style="background: #6c757d; color: white; padding: 5px 15px; border-radius: 20px; font-weight: 900; font-size: 1.1rem;">${ronda}/${total}</div>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <div style="padding: 5px 12px; border-radius: 12px; color: white; font-weight: 900; background: #8cc63f;">${certos}</div>
                            <div style="padding: 5px 12px; border-radius: 12px; color: white; font-weight: 900; background: #ff5a5f;">${erros}</div>
                        </div>
                    </div>`;
                document.getElementById('shell-header-content').style.display = 'flex';
            }
        };

        function toggleMenu(e) { 
            e.stopPropagation(); 
            const m = document.getElementById('dropdownMenu'); 
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; 
        }

        window.onclick = () => { document.getElementById('dropdownMenu').style.display = 'none'; }
        window.onload = () => Engine.init();
    </script>
    <script src="jogo.js"></script>
</body>
</html>

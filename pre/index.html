<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carregando...</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-page: #ffffff; --primary-blue: #5ba4e5; --primary-dark: #3d7db8; 
            --white: #ffffff; --text-grey: #5d7082; 
            --header-h: 100px; 
            --outer-shadow: 0px 4px 15px rgba(176, 196, 217, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-page); height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; transition: background 0.3s; }

        header { 
            height: var(--header-h); background: #fbfdff; display: flex; align-items: center; 
            justify-content: space-between; padding: 0 25px; z-index: 2500; flex-shrink: 0;
            box-shadow: var(--outer-shadow); position: relative;
        }
        .logo-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; pointer-events: none; white-space: nowrap; }
        .logo-center img { height: 65px; width: auto; } 
        .logo-text h1 { font-size: 22px; color: var(--primary-blue); font-weight: 900; text-transform: uppercase; line-height: 0.9; }
        
        .logo-text p { 
            font-size: 9px; 
            color: #7A8B9A !important; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        /* BOTÃO HAMBÚRGUER 3D */
        .hamburger-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(176,196,217,0.3);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
            z-index: 3001;
            border: 2px solid rgba(176,196,217,0.15);
        }
        .hamburger-container:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 14px rgba(176,196,217,0.5);
        }
        .hamburger-container:active { transform: scale(0.95); }
        .hamburger-btn { font-size: 22px; color: var(--primary-blue); }
        
        /* BOTÃO VOLTAR DO CABEÇALHO (voltar_rs.png) */
        .btn-voltar-header { display: none !important; }
        .btn-voltar-mobile { 
            display: flex !important; 
            align-items: center; 
            justify-content: center;
            text-decoration: none; 
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3001;
            background: transparent;
            border: none;
        }
        .btn-voltar-mobile:hover { transform: scale(1.08); }
        .btn-voltar-mobile:active { transform: scale(0.95); }
        .btn-voltar-mobile img { height: 52px; width: auto; object-fit: contain; display: block; }

        /* MENU DROPDOWN */
        .menu-dropdown { position: absolute; top: 85px; left: 15px; display: none; flex-direction: column; gap: 6px; z-index: 3000; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: white; border-radius: 12px; box-shadow: 2px 4px 10px rgba(0,0,0,0.1); text-decoration: none; color: #5d7082; font-weight: 700; font-size: 0.9rem; min-width: 200px; transition: 0.2s; }
        .menu-item:hover { background: var(--primary-blue); color: white; }
        .menu-item img { height: 22px; width: 22px; object-fit: contain; }
        
        /* ITEM VOLTAR DO HAMBÚRGUER (EM TOM AZUL) */
        .menu-item-voltar { background: var(--primary-blue) !important; color: white !important; }
        .menu-item-voltar img { filter: brightness(0) invert(1); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.1); display: none; z-index: 2000; }

        main { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; align-items: center; }
        .intro-container { text-align: center; margin-bottom: 30px; }
        .intro-container p { color: var(--text-grey); font-weight: 700; font-size: 18px; } 

        /* GRELHA DO PRÉ-ESCOLAR */
        .game-wrapper { 
            width: 100%; 
            max-width: 1100px; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); 
            gap: 40px 35px; 
            justify-items: center; 
            padding-bottom: 40px; 
        }
        
        /* ITEM COMPLETO DO JOGO */
        .game-item-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* CARTÃO DE JOGO */
        .game-card { 
            background: transparent; 
            width: 100%;
            height: 190px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none; 
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer;
        }
        
        .game-card:hover { transform: scale(1.06); }
        .game-card img { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* TEXTO DO CONTADOR DEBAIXO DO BOTÃO */
        .game-counter-text {
            margin-top: 10px;
            font-size: 13px;
            font-weight: 700;
            color: #b05373;
            text-align: center;
            white-space: nowrap;
        }
        .game-counter-text span {
            font-weight: 900;
            background: rgba(91, 164, 229, 0.15);
            color: var(--primary-dark);
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 4px;
        }

        footer { 
            padding: 15px; display: flex; justify-content: center; align-items: center;
            text-align: center; color: var(--text-grey); font-weight: 700; font-size: 0.75rem; 
            border-top: 1px solid rgba(176, 196, 217, 0.15); opacity: 0.65; 
        }

        @media (max-width: 650px) { 
            header { height: 80px; padding: 0 15px; }
            .hamburger-container { width: 42px; height: 42px; }
            .hamburger-btn { font-size: 18px; }
            .btn-voltar-mobile img { height: 42px; }
            .logo-text p { font-size: 8px; margin-top: 2px; }
            .logo-text h1 { font-size: 18px; }
            .logo-center img { height: 50px; }
            .game-wrapper { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 30px 20px; }
            .game-card { height: 150px; }
            .game-counter-text { font-size: 11px; margin-top: 6px; }
            .game-counter-text span { padding: 1px 6px; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeMenus()"></div>

    <header>
        <div class="header-left">
            <div class="hamburger-container" onclick="toggleHamburger(event)">
                <i class="fas fa-bars hamburger-btn"></i>
            </div>
            <div id="dropdownMenu" class="menu-dropdown"></div>
        </div>
        
        <div class="logo-center">
            <img id="head-logo" src="" alt="Logo">
            <div class="logo-text">
                <h1 id="tit-l1"></h1>
                <h1 id="tit-l2"></h1>
                <p id="sub-tit"></p>
            </div>
        </div>

        <div class="header-right">
            <a href="../" id="link-voltar-mobile" class="btn-voltar-mobile">
                <img id="header-back-mobile" src="" alt="Voltar">
            </a>
        </div>
    </header>

    <main>
        <div class="intro-container">
            <p id="hub-intro-sub"></p>
        </div>
        <div class="game-wrapper" id="gamesGrid"></div>
    </main>

    <footer id="txt-rodape"></footer>

    <script src="biblioteca.js"></script>
    <script src="dados.js"></script>
    
    <script>
        const APP_ID = "pequenos_curiosos_hub";

        function initUI() {
            if (typeof JOGO_CONFIG === 'undefined' || typeof BIBLIOTECA_TEMAS === 'undefined' || typeof BIBLIOTECA_CONTEUDO === 'undefined') return;
            
            const conf = JOGO_CONFIG;
            const tema = BIBLIOTECA_TEMAS[conf.areaAtiva];
            const info = BIBLIOTECA_CONTEUDO[conf.anoAtivo][conf.areaAtiva];
            const pIconsMenu = conf.caminhoIconsMenu;
            const pIconsJogos = conf.caminhoIconsJogos;
            const root = document.documentElement;

            root.style.setProperty('--bg-page', tema.corPagina);
            root.style.setProperty('--primary-blue', tema.corPrimaria);
            root.style.setProperty('--primary-dark', tema.corEscura);
            root.style.setProperty('--text-grey', tema.corTexto);

            document.title = info.t1 + " " + info.t2;
            document.getElementById('tit-l1').innerText = info.t1;
            document.getElementById('tit-l2').innerText = info.t2;
            document.getElementById('sub-tit').innerText = info.sub;
            document.getElementById('hub-intro-sub').innerText = info.intro;
            document.getElementById('txt-rodape').innerHTML = info.rodape;
            
            document.getElementById('head-logo').src = pIconsMenu + conf.iconesMenu[conf.anoAtivo];
            
            // Botão Principal do Header recebe voltar_rs.png
            document.getElementById('header-back-mobile').src = pIconsMenu + conf.iconesMenu.voltar;

            const menuBox = document.getElementById('dropdownMenu');
            menuBox.innerHTML = ''; 
            const menuLabels = { home: 'Início', pre: 'Pré-Escolar', ano1: '1º Ano', ano2: '2º Ano', ano3: '3º Ano', ano4: '4º Ano' };
            ['home', 'pre', 'ano1', 'ano2', 'ano3', 'ano4'].forEach(k => {
                if(conf.links[k]) {
                    const a = document.createElement('a'); a.className = 'menu-item'; a.href = conf.links[k];
                    a.innerHTML = `<img src="${pIconsMenu}${conf.iconesMenu[k]}"><span>${menuLabels[k]}</span>`;
                    menuBox.appendChild(a);
                }
            });
            
            // Botão Voltar do Menu Hamburguer recebe a seta.png (voltarMenu)
            const btnV = document.createElement('a'); 
            btnV.className = 'menu-item menu-item-voltar'; 
            btnV.href = "../"; 
            btnV.innerHTML = `<img src="${pIconsMenu}${conf.iconesMenu.voltarMenu}"> <span>VOLTAR</span>`;
            menuBox.appendChild(btnV);

            // MONTAGEM DOS JOGOS E CONTADORES
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = ''; 
            
            conf.listaJogos.forEach(jogo => {
                const itemContainer = document.createElement('div');
                itemContainer.className = 'game-item-container';

                const card = document.createElement('a'); 
                card.className = 'game-card'; 
                card.href = jogo.link;
                card.title = jogo.nome; 

                const gameKey = `${conf.anoAtivo}_${jogo.link.replace(/\//g, '')}`;
                const numberId = `num_${gameKey}`;
                
                card.innerHTML = `<img src="${pIconsJogos}${jogo.icon}" alt="${jogo.nome}">`;
                
                card.onclick = function(e) {
                    e.preventDefault();
                    registarEAvancar(gameKey, jogo.link);
                };

                const counterLabel = document.createElement('div');
                counterLabel.className = 'game-counter-text';
                counterLabel.innerHTML = `Nº de vezes jogado: <span id="${numberId}">0</span>`;

                itemContainer.appendChild(card);
                itemContainer.appendChild(counterLabel);
                grid.appendChild(itemContainer);

                atualizarVisualContador(gameKey, numberId, jogo.jogadas || 0);
            });
        }

        async function atualizarVisualContador(gameKey, numberId, valorInicial) {
            const txtNum = document.getElementById(numberId);
            if (!txtNum) return;

            const localKey = `backup_${gameKey}`;
            let valorAtual = parseInt(localStorage.getItem(localKey)) || valorInicial;
            txtNum.innerText = valorAtual;

            try {
                const response = await fetch(`https://api.countapi.xyz/get/${APP_ID}/${gameKey}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.value) {
                        txtNum.innerText = data.value;
                        localStorage.setItem(localKey, data.value);
                    }
                }
            } catch (err) {}
        }

        async function registarEAvancar(gameKey, destino) {
            const localKey = `backup_${gameKey}`;
            let atual = parseInt(localStorage.getItem(localKey)) || 0;
            localStorage.setItem(localKey, atual + 1);

            try {
                fetch(`https://api.countapi.xyz/hit/${APP_ID}/${gameKey}`);
            } catch (err) {}
            
            window.location.href = destino;
        }

        function toggleHamburger(e) {
            e.stopPropagation();
            const m = document.getElementById('dropdownMenu');
            const ov = document.getElementById('overlay');
            if(m.style.display === 'flex') { closeMenus(); } 
            else { m.style.display = 'flex'; ov.style.display = 'block'; }
        }

        function closeMenus() {
            document.getElementById('dropdownMenu').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        window.onload = initUI;
    </script>
</body>
</html>
